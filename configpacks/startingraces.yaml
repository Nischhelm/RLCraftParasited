        - Name:generic.reachDistance, Amount:0.75, Operation:1
        - Name:xat.flyspeed, Amount:-0.4, Operation:2
        - Name:xat.jump, Amount:0.4, Operation:2
        - Name:xat.stepheight, Amount:0.5, Operation:0
