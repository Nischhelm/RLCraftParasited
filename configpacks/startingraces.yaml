        - Name:generic.attackDamage, Amount:0.5, Operation:1
        - Name:generic.knockbackResistance, Amount:0.75, Operation:1
        - Name:generic.luck, Amount:1, Operation:0
        - Name:generic.reachDistance, Amount:0.5, Operation:1
        - Name:xat.flyspeed, Amount:-0.2, Operation:2


