name: "Dregora HCC Overrides"
version: "1.0.0"
description: "Dregora-specific overrides for HCC configpack"
inherits: hcc
patches:
- type: cfg_patch
  file: config/battletowers.cfg
  description: "top 2 chests are locked (added key blank), overridden cause dregora gives heart dust/shards instead of full hearts"
  changes:
    battletowerchestitems:
      S:"Floor 9": locks:key_blank-0-100-1-1;bountifulbaubles:spectralsilt-0-1-1-4;xat:glowing_ingot-0-15-1-2;potionfingers:ring-0-10-1-1;blaze_rod-0-20-1-2;armorunder:auto_chestplate_liner-0-3-1-1;armorunder:auto_leggings_liner-0-3-1-1;baubles:ring-0-10-1-1;qualitytools:emerald_ring-0-10-1-1;qualitytools:emerald_amulet-0-10-1-1;diamond_horse_armor-0-15-1-1;diamond_horse_armor-0-10-1-1;lapis_block-0-70-1-3;experience_bottle-0-50-1-16;blaze_powder-0-50-1-5;glowstone_dust-0-70-1-5;glowstone_dust-0-70-1-5;diamond_helmet-0-30-1-1;diamond_chestplate-0-30-1-1;diamond_leggings-0-30-1-1;diamond_boots-0-30-1-1;bookshelf-0-70-1-5;bookshelf-0-70-1-5;bookshelf-0-70-1-5;ender_pearl-0-50-1-4;emerald-0-40-3-6;emerald-0-30-4-8;emerald_block-0-30-1-3;redstone_lamp-0-60-2-2;brewing_stand-0-50-1-1;scalinghealth:crystalshard-0-1-1-1;ChestGenHook:chests/simple_dungeon:4
      S:"Top Floor": locks:key_blank-0-100-1-1;defiledlands:essence_mourner-0-5-1-4;defiledlands:essence_destroyer-0-5-1-4;defiledlands:ravaging_ingot-0-5-1-4;bountifulbaubles:spectralsilt-0-1-1-4;xat:glowing_ingot-0-15-1-2;potionfingers:ring-0-10-1-1;baubles:ring-0-10-1-1;xpbook:xp_book-0-3-1-1;xpbook:xp_book-250-3-1-1;xpbook:xp_book-500-3-1-1;xpbook:xp_book-1000-3-1-1;qualitytools:emerald_ring-0-10-1-1;qualitytools:emerald_amulet-0-10-1-1;nether_star-0-1-1-1;lapis_block-0-70-1-3;experience_bottle-0-50-1-10;experience_bottle-0-50-1-10;blaze_powder-0-50-1-5;blaze_rod-0-50-1-4;glowstone_dust-0-70-1-5;glowstone_dust-0-70-1-5;glowstone_dust-0-70-1-5;ender_pearl-0-50-1-4;diamond-0-25-1-3;diamond-0-10-2-4;diamond-0-5-3-5;diamond_block-0-5-1-2;redstone-0-75-5-10;gold_ingot-0-70-8-16;ChestGenHook:chests/simple_dungeon:5

- type: cfg_patch
  file: config/scalinghealth/main.cfg
  description: "difficulty as distance from spawn, halved in dregora hcc to be able to explore more"
  changes:
    main.difficulty:
      S:"Difficulty Per Block": 0.0005
build:
  output_name: "HCC.zip"
