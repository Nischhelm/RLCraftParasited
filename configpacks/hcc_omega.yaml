name: "RLCraft Parasited HCC_OMEGA"
version: "1.0.0"
description: "This is shivs HARDCORE Server Setup v2"

# Patches to apply
patches:
  - type: file_add
    source: hcc_omega/readme.txt
    destination: readme.txt
    description: "Readme"

  - type: cfg_patch
    file: config/levelup2.cfg
    description: "lose L menu progression"
    changes:
      general:
        B:"Reset class on death": true

  - type: cfg_patch
    file: config/corpsecomplex.cfg
    description: "lose various things on death (xp, inventory)"
    changes:
      experience:
        I:"Maximum Recoverable XP": 0
        D:"Recoverable XP Percent": 0.0
      inventory:
        B:"Enable Inventory Module": true
        D:"Random Destroy Chance": 1.0
      respawning:
        B:"Reset Skills on Respawn": true
        B:"Return Scroll": false

  - type: file_add
    source: hcc_omega/mods/RLDeath-1.12.2-1.1.1.jar
    destination: mods/RLDeath-1.12.2-1.1.1.jar
    description: "removes various stuff on death - can get it on cf as well"

  - type: cfg_patch
    file: config/trinkets/Trinkets_And_Baubles.cfg
    description: "lose xat race on death"
    changes:
      "general.server settings.magical foods":
        B:"Keep Transformations": false

  - type: json_patch
    file: config/bountiful/rewards.json
    description: "Remove corpsecomplex:scroll reward"
    changes:
    - op: remove
      path: /56

  - type: cfg_patch
    file: config/scalinghealth/main.cfg
    description: "lose heart containers on death"
    changes:
      "main.player.health":
        I:"Health Lost On Death": 100

      ## From here this is copy-pasted from hcc. if for whatever reason someone wants omega without hcc, this would need to be left out
        I:"Min Health": 2
      "main.client":
        B:"Render Difficulty Meter": true
        B:"Render Difficulty Meter Always": true
      "main.mob":
        S:"Damage Modifier": 3.0
        S:"Max Damage Bonus": 69420.0
      "main.mob.health":
        S:"Base Health Modifier": 3.0
        S:"Base Health Modifier Peaceful": 3.0
        S:"Scaling Mode": MULTI
      "main.mob.potion":
        S:"Mob Potions":
          - minecraft:strength,30,1
          - minecraft:speed,10,1
          - minecraft:speed,50,2
          - minecraft:fire_resistance,10,1
          - minecraft:invisibility,25,1
          - minecraft:resistance,30,1
      "main.difficulty":
        S:"Area Mode": DISTANCE_FROM_SPAWN
        S:"Difficulty Per Block": 0.001
        S:"Max Value": 20.0
        S:"Min Value": 0.5

# Build configuration
