name: "Dregora Parasited"
version: "building on Dregora 1.1.2b"
description: "TODO: Add description of what this configpack changes"

# Build configuration
build:
  mode: modpack
  output_name: DregoraParasited.zip
  include:
    - manifest.json

# Patches to apply
patches:
  - type: file_add
    source: dregora/SERVER README OR DIE.txt
    destination: SERVER README OR DIE.txt
    description: "TODO: Describe why this file is added"

  - type: keyvalue_patch
    file: options.txt
    description: "TODO: TODO"
    changes:
      resourcePacks: ["RLHats.zip","LycanitesMobs32X.zip","Lum.1.12.2.zip","AnimEmis_InF_SW_Blue.zip","AnimEmis_defiledlands.zip","AnimEmis_srparasites.zip","Emis_Rlcraft.zip","RL SRP Better Visuals V0.1.zip","TotallyNormalVindicators.zip","boom.mp3.zip","AnimEmis_ForgottenItems.zip","DLD_Textures.zip","FMB_Textures.zip","IceAndFire_SoundFixes.zip","RLD_Textures.zip","RLEnchantedBooks.zip","jappabp-1.2-mc1.12.zip","JAPPA_RLCraftAdd-on_Nether.zip","Anthrax101\u0027s Remastered Bedrock.zip","RLDTooltips.zip","Lycanites Redux 1.12.2-v8.2.1.zip","AnimEmis_InF_SW_Blue_9.zip","RLC_Nuclear.v1.0.1.zip"]
      key_key.otghud.desc: 0
      key_key.mod_lavacow.special: 34

  - type: file_add
    source: dregora/manifest.json
    destination: manifest.json
    description: "TODO: TODO"

  - type: file_add
    source: dregora/config/pinatamobs.cfg
    destination: config/pinatamobs.cfg
    description: "Added Pinata Mobs"

  - type: file_add
    source: dregora/config/mob_arson.cfg
    destination: config/mob_arson.cfg
    description: "Added Mob Arson"

  - type: file_add
    source: dregora/config/Fishs_Undead_Rising.cfg
    destination: config/Fishs_Undead_Rising.cfg
    description: "Added FUR"

  - type: file_add
    source: dregora/config/viraltracker.cfg
    destination: config/viraltracker.cfg
    description: "Added ViralTracker"

  - type: file_add
    source: dregora/config/dynamictreesbop.cfg
    destination: config/dynamictreesbop.cfg
    description: "Added DynTrees BOP"

  - type: file_add
    source: dregora/config/epicsiegemod.cfg
    destination: config/epicsiegemod.cfg
    description: "Added ESM"

  - type: file_add
    source: dregora/config/nuclearcraft.cfg
    destination: config/nuclearcraft.cfg
    description: "Added nc"

  - type: file_add
    source: dregora/config/cookingforblockheads.cfg
    destination: config/cookingforblockheads.cfg
    description: "Added woodhead cuisine"

  - type: file_add
    source: dregora/config/dsurround/dregora_sounds.json
    destination: config/dsurround/dregora_sounds.json
    description: "Special dregora atmosphere"

  - type: file_add
    source: dregora/config/dsurround/biomes.json
    destination: config/dsurround/biomes.json
    description: "Special dregora atmosphere"

  - type: file_add
    source: dregora/config/dsurround/dimensions.json
    destination: config/dsurround/dimensions.json
    description: "Special dregora atmosphere"

  - type: file_add
    source: dregora/config/itlt/icon.png
    destination: config/itlt/icon.png
    description: "Override game icon"

  - type: file_add
    source: dregora/config/recurrentcomplex/scripts/biome_blacklist.rcs
    destination: config/recurrentcomplex/scripts/biome_blacklist.rcs
    description: "Don't create structs in skyscraper biomes"

  - type: file_add
    source: dregora/config/betterquesting/DefaultQuests.json
    destination: config/betterquesting/DefaultQuests.json
    description: "Fully replace quests with dregora version"

  - type: file_add
    source: dregora/config/betterquesting/resources/title_card.png
    destination: config/betterquesting/resources/title_card.png
    description: "Replace BetterQuesting background"

  - type: cfg_patch
    file: config/mobends.cfg
    description: "Not sure why we dont animate skeletons anymore"
    changes:
      animated:
        B:"mobends-minecraft:skeleton": false

  - type: json_patch
    file: config/enhancedvisuals.json
    description: "More Death msgs"
    changes:
    - op: add
      path: /messages/deathMessages/48
      value: "enhancedvisuals.deathmessage.48"
    - op: add
      path: /messages/deathMessages/49
      value: "enhancedvisuals.deathmessage.49"
    - op: add
      path: /messages/deathMessages/50
      value: "enhancedvisuals.deathmessage.50"
    - op: add
      path: /messages/deathMessages/51
      value: "enhancedvisuals.deathmessage.51"
    - op: add
      path: /messages/deathMessages/52
      value: "enhancedvisuals.deathmessage.52"

  - type: cfg_patch
    file: config/itlt.cfg
    description: "Change game window title"
    changes:
      display:
        S:windowDisplayTitle: "RLCraft Dregora"

  - type: cfg_patch
    file: config/srpmixins.cfg
    description: "TODO: Describe what changes in srpmixins.cfg"
    changes:
      "general.chunk phases":
        I:"Dimension blacklist":
          add:
            - 3
            - 4598
      "general.dimension multipliers":
        S:"Parasite Armor Multipliers":
          add:
            - 3,2
        S:"Parasite Dmg Multipliers":
          add:
            - 3,3
        S:"Parasite Drop chance Multipliers":
          add:
            - 3,1
        S:"Parasite Health Multipliers":
          add:
            - 3,3
        S:"Parasite KBRes Multipliers":
          add:
            - 3,1
        S:"Parasite mob cap Multipliers":
          add:
            - 3,1.5

