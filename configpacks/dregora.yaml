  - type: keyvalue_patch
    file: resources/betterquesting/lang/en_us.lang
    description: "Lang keys for quests"
    changes:
      betterquesting.quest.desc.117: "Click the buttons below for useful links!\\n{Embed}TypeLink;https://discord.gg/QURkzuQ;128;20;Shivaxi/RLCraft Discord{Embed}\\n{Embed}TypeLink;https://discord.gg/kyzax24d59;128;20;Dregora Discord{Embed}\\n{Embed}TypeLink;https://www.reddit.com/r/RLCraft;128;20;RLCraft Subreddit{Embed}\\n{Embed}TypeLink;https://rldregora.wiki.gg/;128;20;RLCraft Dregora Wiki{Embed}\\n{Embed}TypeLink;https://speedrun.com/RLCraft;128;20;RLCraft Speedrunning{Embed}"
      add:
        betterquesting.quest.desc.349: "Ah.. Nothing beats the roars of the surface world's Dragons!"
        betterquesting.quest.desc.350: "Yeah... I don't think I want to be here."
        betterquesting.quest.desc.351: "Ghouls, Machines and Death awaits those who walk the dried sands in these lands of yellow, green fog but for you may have traveled for the poison took root thou might find treasure amids the loot.\\n\\nAncient Machinery and anti-rad may be part of what you thought and if so, keep steady and walk forth for you have finally found the lands of nuclear wrought."
        betterquesting.quest.desc.352: "Use your flint & steel to light up your way out!"
        betterquesting.quest.desc.353: "Find or craft a Flint & Steel."
        betterquesting.quest.desc.354: ""
        betterquesting.quest.desc.355: ""
        betterquesting.quest.desc.356: "Location: Nuclear Blight - The Fortress in the Tunnels.\\nEntrance: Unknown\\n\\nUseful Machinery Found:\\n\\n- Salt Mixer\\n- Alloy Furnace\\n- Ingot Former\\n- Rock Crusher\\n- Fuel Reprocessor\\n- Decay Hastener\\n\\nCritical function: Ingredients used in fabrication of Heavy Radiation Shielding"
        betterquesting.quest.desc.357: "Location: Nuclear Blight - The Atrium\\nEntrance: Nuclear Blight\\n\\nUseful Machinery Found:\\n\\n- Manufactory\\n- Fluid Infuser\\n- Fluid Enricher\\n- Chemical Reactor\\n- Universal Bin\\n- Melter\\n\\nCritical function: Fabrication of Rad-Away \u0026 Parasite Experimentation"
        betterquesting.quest.desc.358: "Location: Lower Reactor Entrance\\nCreated in the Manufactory through following process:\\n\\n- Sugar Cane in Manufactory creates Bioplastic"
        betterquesting.quest.desc.359: "You look rad!"
        betterquesting.quest.desc.360: "Location: Bottom Floor Atrium [Laboratory]"
        betterquesting.quest.desc.361: "Location: Any relatively flat surface biome.\\nEntrance: Factory Ruins\\n\\nUseful Machinery Found:\\n\\n- Fluid Enricher\\n- Fluid Infuser\\n- Plutonium RTG\\n\\nCritical function: Fabrication of Reinforced Concrete"
        betterquesting.quest.desc.362: "Location: Lower Reactor Entrance\\nCreated in the Fluid Infuser through following process:\\n\\n- Sugar in Melter creates Molten Sugar\\n- Molten Sugar \u0026 Water creates Ethanol in Chemical Reactor\\n- Glowing Mushroom \u0026 Ethanol creates RadAway Fluid in Fluid Enricher\\n- Bioplastic \u0026 RadAway Fluid in Fluid Infuser creates Radaway\\n\\nRadaway can be consumed to lower radiation contamination"
        betterquesting.quest.desc.363: "Location: Upper lab [Reactor Entrance]\\nCreated in the machine Ingot Former through the following process:\\n\\n- Molten Boron \u0026 Steel creates Ferroboron liquid in Salt Mixer.\\n- Molten Lithium \u0026 Ferroboron creates Tough liquid in Salt Mixer.\\n- Tough in Ingot Former creates Tough Alloy."
        betterquesting.quest.desc.364: "Location: Upper lab [Reactor Entrance]\\nCreated in the machine Rock Crusher through following process:\\n\\n- Andesite in Rock Crusher creates Beryllium Dust\\n- Beryllium Dust in Melter creates Beryllium Liquid\\n- Beryllium Liquid in Ingot Former creates Beryllium Ingot"
        betterquesting.quest.desc.365: "Location: Upper lab [Reactor Entrance]\\nCreated in the machine Rock Crusher through following process:\\n\\n- Granite in Rock Crusher creates Sulfur"
        betterquesting.quest.desc.366: "Location: Upper lab [Reactor Entrance]\\nCreated in the machine Alloy Furnace through following process:\\n\\n- Coal in Melter creates Liquefacted Coal\\n- Liquefacted Coal and Diamonds in Alloy Furnace creates Hard Carbon Alloy"
        betterquesting.quest.desc.367: "Location: Upper lab [Reactor Entrance]\\nCreated in the machine Alloy Furnace through following process:\\n\\n- Coal in Melter creates Liquefacted Coal\\n- Liquefacted Coal in Ingot Former creates Graphite Ingot"
        betterquesting.quest.desc.368: "Location: Lower lab [Reactor Pump Room]\\nCreated in a crafting table through the following process:\\n\\n- LEU-235 Fuel creates Power \u0026 Depleted LEU-235 Fuel in Fission Reactor\\n- Depleted LEU-235 creates Uranium-238 | Neptunium-237 | Plutonium-239 | Plutonium-241 in Fuel Reprocessor \\n- Plutonium-241 creates Uranium-235 in Decay Hastener\\n- Uranium-235 \u0026 Uranium-238 creates LEU-235 Fuel in crafting table"
        betterquesting.quest.desc.369: "Requires following machinery:\\n\\n- Salt Mixer\\n- Alloy Furnace\\n- Ingot Former\\n- Rock Crusher\\n- Fuel Reprocessor\\n- Decay Hastener\\n- Fission Reactor\\n- Melter\\n- Manufactory"
        betterquesting.quest.desc.370: "Requires following machinery:\\n\\n- Salt Mixer\\n- Ingot Former\\n- Melter\\n- Manufactory"
        betterquesting.quest.desc.371: "Gives a little protection versus the contamination effect\\nConsult JEI for more information"
        betterquesting.quest.desc.372: "Location: Factory Shelter\\nCreated in the crafting table through following process:\\n\\n- Lattice in crafting table creates Rebar"
        betterquesting.quest.desc.373: "Location: Factory Shelter\\nSpecial Properties: extra strong versus parasites!\\nCreated in Fluid Infuser through following process:\\n\\n- Rebar \u0026 Uncured Cement in Fluid Infuser creates Reinforced Concrete"
        betterquesting.quest.desc.374: "May Contain various machinery required for the fabrication of safety equipment sucH as anti-rad or radiation shielding"
        betterquesting.quest.desc.375: "Location: Nuclear Blight [Red-Sign Shelters] \u0026 Rarely found in resource crates [Nuclear Blight \u0026 Underneath]\\nUsed for containment of reactor\\n\\n\\n§4Multiblock Reactor Guide:\\n\\n§r- Use any block to create a 5x5x5 frame using 44 blocks in total\\n- Fill the outter gaps of the frame with the Reactor (Trap)Doors and (Transparent) Reactor Casings blocks.\\n- Place both the Buffer block as the Fission Controller block anywhere in the 3x3 sides of the Reactor Multiblock Structure.\\n\\n§4Clicking the Reactor Fission block should now display a valid 3x3x3 Fission Reactor.§r\\n\\n- Place the Reactor Cell block anywhere inside the Reactor Mutliblock Structure.\\n- Place the Active Cooler block anywhere next to the Reactor Cell.\\n- Place the Infinite Water Source block anywhere next to the Active Cooler.\\n- Place a lever next to the Fission Controller, put in the LEU-235 fuel pellet and turn it on.\\n\\n§4Power is being generated and is accessible through the Buffer Block on the outside of the Reactor. Heat \u0026 §eRadiation §4are also being produced by this Reactor, make sure to never let it overheat or it\u0027ll blow up!"
        betterquesting.quest.desc.376: "§4Parasite Weaknesses:§r\\n\\n- Parasites are weak to Radiation, Lightning and Fire\\n- Parasites have mild trouble breaking reinforced iron\\n- Parasites up to pure variantsa have a lot trouble breaking reinforced concrete\\n- Lures can be used to lower the parasite phase in localized biomes\\n- Biome Purifiers can be used to revert the corruption\\n\\n\\n§5§4Parasite Origins:\\n§r\\n- First appearance after the Blight, a catastrophic event that created interdimensional rifts between ours and other worlds such as the Lost Cities\\n\\n- Radiation decimated the surface of Dregora, former Earth and caused the retreat of Parasitic beings to deep within the Earth, commonly referred to as the Underneath\\n\\n- Underneath, home to the Altered Hadron Collider. Being the direct cause of the Blight and the interdimensional rift this plane of existence is located closest to the Lost Cities and thus most infested by the corruption"
        betterquesting.quest.desc.377: "Found in non-canyon biomes deep under solid ground\\n\\nUsed in various recipes related to protection from nuclear contamination"
        betterquesting.quest.desc.378: "Found in Nuclear Blight and below Cities\\n\\nUsed to power up ancient machinery found in Nuclear Blight and from Resource Crates and various recipes related to protection from nuclear contamination"
        betterquesting.quest.desc.379: "Found in Abyssal Rift and lower Underneath/Lost Cities\\n\\nUsed to power up ancient machinery found in Nuclear Blight and from Resource Crates"
        betterquesting.quest.desc.380: "Found deep below Mountains and lower Underneath/Lost Cities\\n\\nUsed in various recipes related to protection from nuclear contamination"
        betterquesting.quest.desc.381: "Resource found in the Underneath/Lost Cities\\n\\nUsed in various recipes related to protection from nuclear contamination."
        betterquesting.quest.desc.382: ""
        betterquesting.quest.desc.383: "Got to collect them all!"
        betterquesting.quest.desc.384: ""
        betterquesting.quest.desc.385: "Many, many years ago once home to a thriving civilization now in ruins and infested by those who caused it\u0027s demise.\\n\\nFew dare travel here despite the riches found within the confines of the once mighty buildings, some tall littered with chests spread across the floors reaching to heaven and other buried deep below mighty banks of old in secured vaults hidden from the prying eyes of looters.\\n\\n\\n- Jungle\\n- Parasite Starting Phase: 4"
        betterquesting.quest.desc.386: ""
        betterquesting.quest.desc.387: ""
        betterquesting.quest.desc.388: "Many, many years ago once home to a thriving civilization now in ruins and infested by those who caused it\u0027s demise.\\n\\nFew dare travel here despite the riches found within the confines of the once mighty buildings, some tall littered with chests spread across the floors reaching to heaven and other buried deep below mighty banks of old in secured vaults hidden from the prying eyes of looters.\\n\\n\\n- Frozen\\n- Parasite Starting Phase: 4"
        betterquesting.quest.desc.389: ""
        betterquesting.quest.desc.390: "Many, many years ago once home to a thriving civilization now in ruins and infested by those who caused it\u0027s demise.\\n\\nFew dare travel here despite the riches found within the confines of the once mighty buildings, some tall littered with chests spread across the floors reaching to heaven and other buried deep below mighty banks of old in secured vaults hidden from the prying eyes of looters.\\n\\n\\n- Desert\\n- Low Radiation Level\\n- Parasite Starting Phase: 4"
        betterquesting.quest.desc.391: ""
        betterquesting.quest.desc.392: ""
        betterquesting.quest.desc.393: "Fight the Corruption!"
        betterquesting.quest.desc.394: "There where the corruption slumbers, home to the energy extraction point from which once massive amounts of energy rushed into our dimension enabled by the ALHC (Altered Large Hadron Collider) until a equilibrium was met and while only spanning mere seconds the world was forever changed.\\n\\nThis event would later be known as the Blight."
        betterquesting.quest.desc.395: ""
