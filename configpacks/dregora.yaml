name: "Dregora Parasited"
version: "Dregora 1.1.2b - Aug 21 2026"
description: "Dregora x Parasited"

# Build configuration
build:
  mode: modpack
  output_name: "Dregora Parasited.zip"
  build_configpacks:
    - dregora_hcc
    - dregora_omega
    - dregora_unparasited
  configpacks_dest: "overrides"
  include:
    - manifest.json
    - readme.md

# Patches to apply
patches:
  - type: folder_add
    source: dregora/changelogs
    destination: changelogs
    description: "Dregora changelogs"

  - type: file_add
    source: dregora/SERVER README OR DIE.txt
    destination: SERVER README OR DIE.txt
    description: "TODO: Describe why this file is added"

  - type: keyvalue_patch
    file: server.properties
    description: "Dregora server settings"
    changes:
      level-type: OTG
      level-name: DregoraRL

  - type: json_patch
    file: manifest.json
    description: "update manifest"
    changes:
      - op: replace
        path: /name
        value: "Dregora Parasited"
      - op: replace
        path: /version
        value: "{{version}}"

  - type: json_patch
    file: manifest.json
    description: "Remove deprecated mods replaced by Dregora equivalents"
    changes:
      # Remove CustomMainMenu -> FancyMenu
      - op: remove_by_key
        path: /files
        key: projectID
        value: 226406
      # Remove MainMenuScale -> FancyMenu
      - op: remove_by_key
        path: /files
        key: projectID
        value: 310375
      # Remove Ruins -> OTG
      - op: remove_by_key
        path: /files
        key: projectID
        value: 227873
      # Remove RTG -> OTG
      - op: remove_by_key
        path: /files
        key: projectID
        value: 237989

  - type: json_patch
    file: manifest.json
    description: "RLTooltips -> RLDTooltips"
    changes:
      - op: replace_by_key
        path: /files
        key: projectID
        match: 813247
        value:
          projectID: 813247
          fileID: 6919621
          required: true
          fileName: "RLDTooltips"

  - type: json_append_all
    file: manifest.json
    source: dregora/manifest_additions.json
    path: /files
    description: "Add Dregora-specific mods"

  - type: folder_add
    source: dregora/fancymenu_data
    destination: fancymenu_data
    description: "Dregora main menu (using FancyMenu instead of CustomMainMenu)"

  - type: folder_add
    source: dregora/config/fancymenu
    destination: config/fancymenu
    description: "Dregora main menu (using FancyMenu instead of CustomMainMenu)"

  - type: folder_add
    source: dregora/config/cd4017be
    destination: config/cd4017be
    description: "Vertically stacked dimensions"

  - type: folder_add
    source: dregora/config/biomesoplenty
    destination: config/biomesoplenty
    description: "BOP"

  - type: folder_add
    source: dregora/config/konkrete
    destination: config/konkrete
    description: "no clue"

