  - type: keyvalue_patch
    file: config/fermiummixins/dsurround_chat.cfg
    description: "Chatty entities"
    changes:
      add:
        chat.creeper.0: 10,Don't mind me!
        chat.creeper.1: 10,I just want a hug!
        chat.creeper.2: 10,Let's be cuddle friends!
        chat.creeper.3: 10,Come closer I have a secret to tell you!
        chat.creeper.4: 10,Psssttt I have a hint on that hidden prize in RLCraft!
        chat.painting.0: 10,Booeeehooeeee... Spooky Spooky Possessed Painting...
        chat.painting.1: 10,LET ME OUT!
        chat.golem.0: 10,One more step and ill torch you!
        chat.golem.1: 10,Don't you dare!
        chat.golem.2: 10,Argh! Leave me alone!
        chat.golem.3: 10,Don't you dare!
        chat.golem.4: 10,Flap Along!
        chat.golem.5: 10,Did you really had to wake me!
        chat.golem.6: 10,Blast, I was just taking my beauty nap!
        chat.golem.7: 10,Get out!!!!
        chat.vindication_illager.0: 10,Johnny's gonna get you!
        chat.vindication_illager.1: 10,Have you met the Imposter yet?
        chat.vindication_illager.2: 10,Axe-citing!
        chat.vindication_illager.3: 10,Why would you run, I just want a hug!
        chat.vindication_illager.4: 10,I was an executioner once but I didn't make the cut.
        chat.vindication_illager.5: 10,Don't run, there's so much fun to be-head
        chat.vindication_illager.6: 10,With my axe, it's easier to get ahead!
        chat.vindication_illager.7: 10,You'd choose me over the Dragon wont you?
        chat.vindication_illager.8: 10,Axe-Terminate!
        chat.vindication_illager.9: 10,You don't want my random axes of kindness?!
        chat.vindication_illager.10: 10,It was only an Axident!
        chat.illusion_illager.0: 10,My first trick this evening is impossible, so now lets do the second trick!
        chat.illusion_illager.1: 10,Being a magician has its advantages. What other profession lets you cut up your wife into halves and get away with it?
        chat.illusion_illager.2: 10,You Shall Not Pass!
        chat.illusion_illager.3: 10,I am a Wizard!
        chat.illusion_illager.4: 10,Oh, do I miss spelling class sometimes...
        chat.illusion_illager.5: 10,Fishing?! The only thing I cast are spells!
        chat.illusion_illager.6: 10,Witchhiker's guide to the galaxy! A true classic.
        chat.illusion_illager.7: 10,By Merlin's Beard!
        chat.illusion_illager.8: 10,RLCraft hard!? Imagine how it is for us!
        chat.illusion_illager.9: 10,Yeah, we aren't particularly fond of Dragons either.
        chat.illusion_illager.10: 10,Hocus Pocus Pilatus Pas!
        chat.illusion_illager.11: 10,I'm a flying sorcerer from outer space!
        chat.illusion_illager.12: 10,Fly you fool!
        chat.evocation_illager.0: 10,Gimme that Villager Booty... Treasure!
        chat.evocation_illager.1: 10,AaahhH!!! Keep your hands of my Totem!
        chat.evocation_illager.2: 10,Come closer, I want to show you a magic trick!
        chat.evocation_illager.3: 10,I wont bite, I promise!
        chat.evocation_illager.4: 10,If you'd been there, you would've run from that deer, too!
        chat.evocation_illager.5: 10,I'm not a cheater and I definitely don't have reach nor no-clip powers!
        chat.evocation_illager.6: 10,I'm not my own person you say? All my lines are pre-written!? What person would subject themselves to such horror!?
        chat.evocation_illager.7: 10,I know, my Evocation skills leave many vexed.
        chat.evocation_illager.8: 10,These days I'm asked to evoke the weirdest of things...
        chat.evocation_illager.9: 10,Don't let me evoke your memory of me!
