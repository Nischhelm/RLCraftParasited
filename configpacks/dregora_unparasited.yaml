name: "Dregora Unparasited Overrides"
version: "1.0.0"
description: "Dregora-specific overrides for Unparasited configpack"
inherits: unparasited

patches:
  - type: cfg_patch
    file: config/srparasites/SRParasites.cfg
    description: "Also allow spawning paras in underneath and overworld"
    changes:
      configuration_general:
        I:"Mobs Blacklisted Dimensions":
          add:
            - 0
            - 3
      parasite_properties:
        I:"Block Limit For Beckon Infestation": 750
        I:"Block Limit For Beckon Infestation Cooldown": 5
        I:"Block Limit For Biome Infestation": 350
        I:"Block Limit For Biome Infestation Cooldown": 5

  - type: cfg_patch
    file: config/srparasites/SRParasitesSystems.cfg
    description: "TODO: Describe what changes in SRParasitesSystems.cfg"
    changes:
      parasite_evolution_phases:
        B:"Damage Deterrent RS": false
        B:"Evolution Custom Spawner": true
        B:"Evolution Phases": true
        S:"Evolution Phases Dimension Starting Phase List":
          remove:
            - -1;-1;-100
            - 0;0;0
            - 111;7;599999999
            - 1;3;1800
          add:
            - -1;-2;-20000
            - 0;-2;0
            - 111;11;1799999999
            - 1;-2;-20000
            - 3;8;500000000
        I:"Evolution Phases Point Gain Blacklist":
          add:
            - -1
            - 1
            - 111
        I:"Evolution Phases Point Loss Blacklist":
          add:
            - 3
        I:"Phase Parasites Ignore Sunlight": 0
        S:"Evolution Parasite Lock List":
          remove:
            - 0;4;pri_vermin
            - 111;8;anc_dreadnaut
            - 111;8;anc_overlord
            - 111;8;beckon_sii
            - 111;8;beckon_siii
            - 111;8;beckon_siv
            - 111;8;bogle
            - 111;8;bomber_heavy
            - 111;8;carrier_colony
            - 111;8;dispatcher_sii
            - 111;8;dispatcher_siii
            - 111;8;dispatcher_siv
            - 111;8;haunter
            - 111;8;wraith
      reinforcement_system:
        I:"Reinforcement System Block Revert Stage": 3
        S:"Reinforcement System Infestation Spawning Beckons": 0.0

  - type: cfg_patch
    file: config/srparasites/SRParasitesWorld.cfg
    description: "Para biome spread only in special biomes"
    changes:
      world_biome:
        S:"Biome Spread BlackList":
          add:
            - biomesoplenty:steppe
            - biomesoplenty:wasteland
            - openterraingenerator:overworld_lair_of_the_thing
            - openterraingenerator:overworld_nuclear_ruins
            - openterraingenerator:overworld_ruins_of_blight
        B:"Biome Spread BlackList Inverted": true

  - type: file_replace
    source: dregora_unparasited/config/incontrol/spawn.json
    destination: config/incontrol/spawn.json
    description: "Readded SRP spawn conditions (only from spawners or on certain blocks in low light)"

  - type: cfg_patch
    file: config/rltweaker.cfg
    description: "Disallow any parasite in end and nether, not overworld"
    changes:
      general.server.scape and run parasites:
        I:"Parasites Dimension Blacklist" :
          remove:
            - 0

  - type: cfg_patch
    file: config/eaglemixins.cfg
    description: "Restrict paras to their biomes"
    changes:
      general.srparasites options:
        B:"Kill Parasites outside alllowed biomes": true
        S:"SRParasites allowed biomes":
          remove:
            - minecraft:mutated_forest
          add:
            - 0@biomesoplenty:steppe
            - 0@openterraingenerator:overworld_abyssal_rift
            - 0@srparasites:biome_parasite
            - 0@openterraingenerator:overworld_lair_of_the_thing
            - 0@openterraingenerator:overworld_nuclear_ruins
            - 0@openterraingenerator:overworld_ruins_of_blight
            - 1@*
            - 3@*
            - -1@*
            - 111@*
        B:"SRParasites allowed biomes is whitelist": true

  - type: cfg_patch
    file: config/srpmixins.cfg
    description: "Use Chunk Phases in overworld, phase 11 in LC"
    changes:
      general.Tweaks.Phases.Custom Phases:
        B:"Use Chunk Phases": true
        B:"Use Player Phases": false
        I:"Chunk Phases Dimension Blacklist":
          add:
            - 3
      general.Tweaks.Phases.Custom Phases.Chunk Biome Start Phases:
        I:"minecraft:mutated_forest": null
        I:"biomesoplenty:steppe": 4
        I:"openterraingenerator:overworld_abyssal_rift": 4
        I:"openterraingenerator:overworld_lair_of_the_thing": 4
        I:"openterraingenerator:overworld_nuclear_ruins": 4
        I:"openterraingenerator:overworld_ruins_of_blight": 4
        I:"srparasites:biome_parasite": 4
      general.Tweaks.Spawning:
        I:"Min Blocklight Threshold": 12
        B:"Parasite Spawning Biome Blacklist per dimension is whitelist": true
        I:"Parasite Spawning Biome Blacklist - Max Phase": 11
      general.Tweaks.Spawning.Parasite Spawning Biome Blacklist per dimension:
        S:0:
          remove:
            - minecraft:mutated_forest
          add:
            - biomesoplenty:steppe
            - openterraingenerator:overworld_abyssal_rift
            - openterraingenerator:overworld_lair_of_the_thing
            - openterraingenerator:overworld_nuclear_ruins
            - openterraingenerator:overworld_ruins_of_blight
            - srparasites:biome_parasite
        S:111: []
        S:3: []
      general.Fixes.Parasite Biome:
        B:"Fix Parasitic Biome spreading limit": true
      general.Tweaks.Phases.More Phases:
        I:"Max Phase": 11
        C:Phases:
          modify:
            3: {D:"Killcount Plus": 0.0}
            4: {D:"Killcount Plus": 0.0}
            5: {D:"Killcount Plus": 0.0}
            6: {D:"Killcount Plus": 0.0, D:"Mobs Spawn With COTH Chance": 0.0}
            7: {D:"Killcount Plus": 0.25, D:"Mobs Spawn With COTH Chance": 0.0}
            8: {D:"Killcount Plus": 0.35, D:"Mobs Spawn With COTH Chance": 0.0}
            9: {D:"Killcount Plus": 0.45, D:"Mobs Spawn With COTH Chance": 0.0}
            10: {D:"Killcount Plus": 0.0, D:"Mobs Spawn With COTH Chance": 0.0}
          add:
            - I:Points: 1799999999
              D:"Killcount Plus": 0.0
              S:"Warning Message": "ELEVEN - this shouldn't happen, report to nischi"
              I:Delay: 1200
              I:"Sleep Penalty": 0
              I:"Minimum Parasite Type ID": 40
              I:"Maximum Parasite Type ID": 72
              D:"Reinforcement System Chance": 0.2
              D:"Nexus Grow Stun Chance - Stage I": 0.0
              D:"Nexus Grow Stun Chance - Stage II": 0.0
              D:"Nexus Grow Stun Chance - Stage III": 0.0
              I:"Odds Residue Spawns Beckon": 150
              I:"Scent Death Bonus": 800
              I:"Scent Reaction Bonus": 2
              D:"Mobs Spawn With COTH Chance": 0.0
              D:"Crop Grow Stunned": 1.0
        C:"Phase Spawn List":
          add:
            - S:Phases: "11"
              S:Mob: srparasites:ada_arachnida
              I:"Min Group Count": 1
              I:"Max Group Count": 3
              I:Weight: 25
