name: "RLCraft Parasited Unparasited"
version: "1.0.0"
description: "Parasited minus the parasites"

# Patches to apply
patches:
  - type: file_add
    source: unparasited/readme.md
    destination: readme.md
    description: "Readme"

  - type: cfg_patch
    file: config/rltweaker.cfg
    description: "Disallow any parasite outside LC"
    changes:
      "general.server.scape and run parasites":
        B:"Parasites Dimension Blacklist Enabled": true

  - type: cfg_patch
    file: config/OverLast/OverLast.cfg
    description: "Hide phase HUD"
    changes:
      client:
        I:Xoffset: 300

  - type: json_patch
    file: config/CustomMainMenu/mainmenu.json
    encoding: latin-1
    description: "change main menu modpack name"
    changes:
    - op: replace
      path: /labels/rl_craft/text
      value: "RLCraft Parasited Unparasited"

  - type: cfg_patch
    file: config/srparasites/SRParasites.cfg
    description: "Only allow spawning of paras in LC"
    changes:
      configuration_general:
        I:"Mobs Blacklisted Dimensions":
          add:
            - 111
        B:"Mobs Blacklisted Dimensions Inverted": true

  - type: cfg_patch
    file: config/srparasites/SRParasitesSystems.cfg
    description: "no evo phases and RLCraft 2.9.3 para spawning rules"
    changes:
      parasite_evolution_phases:
        B:"Evolution Custom Spawner": false
        B:"Evolution Phases": false

# Build configuration
build:
  output_name: "Unparasited.zip"
