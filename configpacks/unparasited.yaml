name: "RLCraft Parasited Unparasited"
version: "1.0.0"
description: "Parasited minus the parasites"

# Patches to apply
patches:
  - type: file_add
    source: unparasited/readme.md
    destination: readme.md
    description: "Readme"

  - type: cfg_patch
    file: config/rltweaker.cfg
    description: "Disallow any parasite outside LC"
    changes:
      "general.server.scape and run parasites":
        B:"Parasites Dimension Blacklist Enabled": true

  - type: cfg_patch
    file: config/OverLast/OverLast.cfg
    description: "Hide phase HUD"
    changes:
      client:
        I:Xoffset: 300

  - type: json_patch
    file: config/CustomMainMenu/mainmenu.json
    encoding: latin-1
    description: "change main menu modpack name"
    changes:
    - op: replace
      path: /labels/rl_craft/text
      value: "RLCraft Parasited Unparasited"

  - type: cfg_patch
    file: config/srparasites/SRParasites.cfg
    description: "Only allow spawning of paras in LC"
    changes:
      configuration_general:
        I:"Mobs Blacklisted Dimensions":
          add:
            - 111
        B:"Mobs Blacklisted Dimensions Inverted": true

  - type: cfg_patch
    file: config/srparasites/SRParasitesSystems.cfg
    description: "no evo phases and RLCraft 2.9.3 para spawning rules"
    changes:
      parasite_evolution_phases:
        B:"Evolution Custom Spawner": false
        B:"Evolution Phases": false

  - type: cfg_patch
    file: config/lostcities/profile_rlcraft.cfg
    description: "Remove para biome from LC chunk gen"
    changes:
      lostcity_rlcraft:
        S:allowedBiomeFactors: []

  - type: json_patch
    file: config/CustomMainMenu/mainmenu.json
    encoding: latin-1
    description: "Change the mainmenu images to the old 2.9.3 to avoid spoilers for LC"
    changes:
    - op: replace
      path: /other/background/slideshow/images
      value:
        - "mainmenu:images/unparasited/0.jpg"
        - "mainmenu:images/unparasited/1.jpg"
        - "mainmenu:images/unparasited/1 new.jpg"
        - "mainmenu:images/unparasited/2.jpg"
        - "mainmenu:images/unparasited/2 new.jpg"
        - "mainmenu:images/unparasited/3.jpg"
        - "mainmenu:images/unparasited/4.jpg"
        - "mainmenu:images/unparasited/4 new.jpg"
        - "mainmenu:images/unparasited/5.jpg"
        - "mainmenu:images/unparasited/6.jpg"
        - "mainmenu:images/unparasited/6 new.jpg"
        - "mainmenu:images/unparasited/6 newer.jpg"
        - "mainmenu:images/unparasited/7.jpg"
        - "mainmenu:images/unparasited/7 new.jpg"
        - "mainmenu:images/unparasited/8.jpg"
        - "mainmenu:images/unparasited/9.jpg"
        - "mainmenu:images/unparasited/10.jpg"
        - "mainmenu:images/unparasited/10 new.jpg"
        - "mainmenu:images/unparasited/10 newer.jpg"
        - "mainmenu:images/unparasited/10 newer off.jpg"
        - "mainmenu:images/unparasited/11.jpg"
        - "mainmenu:images/unparasited/12.jpg"
        - "mainmenu:images/unparasited/13.jpg"
        - "mainmenu:images/unparasited/14.jpg"
        - "mainmenu:images/others/1.jpg"

  - type: file_add
    source: unparasited/config/loadingscreens/LoadingScreens.txt
    destination: config/loadingscreens/LoadingScreens.txt
    description: "Add old 2.9.3 loadingscreen to avoid spoilers for LC"

  - type: folder_add
    source: unparasited/resources/mainmenu/images/unparasited
    destination: resources/mainmenu/images/unparasited
    description: "Add old 2.9.3 mainmenu to avoid spoilers for LC"

# Build configuration
build:
  output_name: "Parasited Unparasited.zip"
