# Configuration file

general {
    # Custom mob overrides for spawn chance and clone counts.
    # Format: modid:entity, chance, min, max (min and max clone counts are optional).
    # Example: 'minecraft:pig, 0.1, 1, 15' (10% chance, 1 to 15 clones)
    # Example: 'minecraft:cow, 0.05' (5% chance, uses default clone counts)
    # Supports wildcards like 'lycanitesmobs:*, 0.02, 2, 6'.
    S:"Custom Mob Overrides" <
     >

    # If true, Blights (Scaling Health) never burst as Pinata.
    B:"Disable Blight Pinata"=false

    # If true, boss mobs never burst as Pinata.
    B:"Disable Boss Pinata"=false

    # If true, Champions (Champions mod, tier 1 and above) never burst as Pinata.
    B:"Disable Champion Pinata"=true

    # If true, Infernal Mobs (rare, ultra and infernal) never burst as Pinata.
    B:"Disable Infernal Pinata"=true

    # Enable Pinata mobs feature. If false, no new Pinata mobs will spawn.
    B:"Enable Pinata Mobs"=true

    # If true, the list above becomes a whitelist: only listed mobs (or mods, with modid:*) can be Pinata.
    B:"Invert Pinata Entity Blacklist"=false

    # Maximum amount of clones spawned when a Pinata mob dies.
    # Min: 1
    # Max: 100
    I:"Max Clone Count"=9

    # Minimum amount of clones spawned when a Pinata mob dies.
    # Min: 1
    # Max: 100
    I:"Min Clone Count"=3

    # A list of mobs that can't ever turn into a Pinata mob.
    # Use modid:entity for a single mob, or modid:* for every mob from that mod (example: lycanitesmobs:*).
    S:"Pinata Entity Blacklist" <
        iceandfire:myrmex_egg
        iceandfire:dragonegg
        amphitheremod:amphithere_egg
        playerbosses:player_boss
        minecraft:villager
        iceandfire:snowvillager
        iceandfire:gorgon
        iceandfire:shivaxi_dragon
        iceandfire:black_frost
        iceandfire:dread_queen
        battletowers:golem
     >

    # The word put in front of a Pinata mob's name. This is read on the server, so it works on dedicated servers. Change it here to translate it.
    S:"Pinata Name Prefix"=Pinata

    # If true, a Pinata mob gets the name prefix below added to its name. Set to false to keep Pinata mobs a surprise.
    B:"Show Pinata Name"=true

    # Chance for a mob to spawn as Pinata (0.0 to 1.0). 1.0 = 100%, 0.01 = 1%
    # Min: 0.0
    # Max: 1.0
    D:"Spawn Chance"=0.005
}


