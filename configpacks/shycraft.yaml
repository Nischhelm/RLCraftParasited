name: RLCraft Parasited ShyCraft
version: 1.2.3 - July 25 2026
description: 'ShyCraft Parasited: A modification of Parasited'
build:
  mode: modpack
  output_name: ShyCraft Parasited.zip
  include:
    - manifest.json
    - profileImage
patches:
- type: json_patch
  file: manifest.json
  description: "Update manifest for ShyCraft"
  changes:
  - op: replace
    path: /name
    value: "ShyCraft Parasited X"
  - op: replace
    path: /version
    value: "1.2.3 - July 25 2026"
  - op: add
    path: /image
    value: "profileImage/ShyCraft Minecraft ver.png"
  - op: add
    path: /files/238
    value:
      projectID: 1395835
      fileID: 7701356
      required: true
      fileName: "Pinata Mobs-1.0.6"

- type: keyvalue_patch
  file: options.txt
  description: "change direct connect server to ShyCraft"
  changes:
    lastServer: ShyCraft.mcserver.us

- type: keyvalue_patch
  file: config/VariedCommodities.cfg
  description: "Increase weapon damage and reduce musket knockback"
  changes:
    MachineGunDamage: 10
    MusketDamage: 30
    MusketKnockback: 3

- type: file_add
  source: shycraft/config/pinatamobs.cfg
  destination: config/pinatamobs.cfg
  description: "TODO: Describe why this file is added"

- type: cfg_patch
  file: config/srpmixins.cfg
  description: "TODO: Describe what changes in srpmixins.cfg"
  changes:
    general.spawning:
      S:"Parasite Spawning Biome Blacklist per dimension":
        add:
        - 10

- type: cfg_patch
  file: config/reskillable.cfg
  description: "TODO: Describe what changes in reskillable.cfg"
  changes:
    general:
      S:"Skill Locks":
        replace:
        - old: iceandfire:armor_silver_metal_boots:*=reskillable:defense|4,reskillable:magic|2
          new: iceandfire:armor_silver_metal_boots:*=reskillable:defense|16,reskillable:magic|16
        - old: iceandfire:armor_silver_metal_leggings:*=reskillable:defense|4,reskillable:magic|2
          new: iceandfire:armor_silver_metal_leggings:*=reskillable:defense|16,reskillable:magic|16
        - old: iceandfire:armor_silver_metal_chestplate:*=reskillable:defense|4,reskillable:magic|2
          new: iceandfire:armor_silver_metal_chestplate:*=reskillable:defense|16,reskillable:magic|16
        - old: iceandfire:armor_silver_metal_helmet:*=reskillable:defense|4,reskillable:magic|2
          new: iceandfire:armor_silver_metal_helmet:*=reskillable:defense|16,reskillable:magic|16
        - old: rlmixins:scarlite_boots:*=reskillable:defense|8
          new: rlmixins:scarlite_boots:*=reskillable:defense|30
        - old: rlmixins:scarlite_leggings:*=reskillable:defense|8
          new: rlmixins:scarlite_leggings:*=reskillable:defense|30
        - old: rlmixins:scarlite_chestplate:*=reskillable:defense|8
          new: rlmixins:scarlite_chestplate:*=reskillable:defense|30
        - old: rlmixins:scarlite_helmet:*=reskillable:defense|8
          new: rlmixins:scarlite_helmet:*=reskillable:defense|30
        - old: minecraft:gold_ore=reskillable:mining|2,reskillable:magic|2
          new: minecraft:gold_ore=reskillable:mining|6,reskillable:magic|6
        - old: iceandfire:silver_ore=reskillable:mining|2,reskillable:magic|2
          new: iceandfire:silver_ore=reskillable:mining|12,reskillable:magic|12
        - old: rustic:brewing_barrel:*=reskillable:farming|18
          new: rustic:brewing_barrel:*=reskillable:farming|32,reskillable:building|32
        - old: rustic:grape_stem:*=reskillable:farming|8
          new: rustic:grape_stem:*=reskillable:farming|30

- type: cfg_patch
  file: config/parasited.cfg
  description: "TODO: Describe what changes in parasited.cfg"
  changes:
