name: Build and Release Configpacks

on:
  push:
    tags:
      - '*'  # Trigger on any tag

permissions:
  contents: write  # Required to create releases

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/requirements.txt

      - name: Build RLCraft Parasited
        run: python tools/packbuilder.py build rlcraft_parasited

      - name: Build Dregora Parasited
        run: python tools/packbuilder.py build dregora

      - name: Build ShyCraftParasited
        run: python tools/packbuilder.py build shycraft

      - name: List built files
        run: |
          ls -lh build/

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Extract latest changelog
        id: changelog
        run: |
          python .github/scripts/extract_changelog.py overrides/changelog.md > /tmp/changelog_entry.md
          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          cat /tmp/changelog_entry.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create release body
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          CHANGELOG: ${{ steps.changelog.outputs.CHANGELOG }}
        run: |
          cat > /tmp/release_body.md << 'EOFBODY'
          ## RLCraft, Dregora & ShyCraft **Parasited** ${VERSION}

          ${CHANGELOG}

          ---

          ### Modpacks:
          - **RLCraft Parasited.zip** - Main pack, building on RLCraft 2.10 betas
          - **Dregora Parasited.zip** - Main pack ported to Dregora 1.1.2b
          - **ShyCraft Parasited.zip** - Some changes by the ShyCraft team for their Server. This is not an official release!

          ### Installation:
          Import the ZIP of your choice in CurseForge app or similar features in other launchers.

          ### Config Packs:
          RLCraft Parasited and Dregora include three config packs (located in your profile folder). Extract them in place to apply:
          - **HCC.zip** - Hardcore Config (if you like pain)
          - **OmegaHCC_Server.zip** - Hardcore Config Omega (lose all progression on death)
          - **Unparasited.zip** - Unparasited (put the parasites where they came from)
          
          EOFBODY
          # Expand environment variables
          envsubst < /tmp/release_body.md > /tmp/release_body_final.md
          mv /tmp/release_body_final.md /tmp/release_body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: ${{ steps.version.outputs.VERSION }}
          body_path: /tmp/release_body.md
          files: |
            build/RLCraft Parasited.zip
            build/Dregora Parasited.zip
            build/ShyCraft Parasited.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}