name: Build and Release Configpacks

on:
  push:
    tags:
      - '*'  # Trigger on any tag

permissions:
  contents: write  # Required to create releases

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/requirements.txt

      - name: Check if ShyCraft release
        id: check_shycraft
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/ShyCraft* ]]; then
            echo "IS_SHYCRAFT=true" >> $GITHUB_OUTPUT
          else
            echo "IS_SHYCRAFT=false" >> $GITHUB_OUTPUT
          fi

      - name: Build ShyCraft only
        if: steps.check_shycraft.outputs.IS_SHYCRAFT == 'true'
        run: |
          python tools/packbuilder.py build shycraft

      - name: Build main modpack
        if: steps.check_shycraft.outputs.IS_SHYCRAFT == 'false'
        run: |
          python tools/build_mainpack.py

      - name: Build configpacks (without ShyCraft)
        if: steps.check_shycraft.outputs.IS_SHYCRAFT == 'false'
        run: |
          python tools/packbuilder.py build hcc
          python tools/packbuilder.py build hcc_omega
          python tools/packbuilder.py build unparasited

      - name: List built files
        run: |
          ls -lh build/

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Extract latest changelog
        id: changelog
        run: |
          python .github/scripts/extract_changelog.py overrides/changelog.md > /tmp/changelog_entry.md
          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          cat /tmp/changelog_entry.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create release body for normal releases
        if: steps.check_shycraft.outputs.IS_SHYCRAFT == 'false'
        id: normal_body
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          CHANGELOG: ${{ steps.changelog.outputs.CHANGELOG }}
        run: |
          cat > /tmp/release_body.md << 'EOFBODY'
          ## Dregora Parasited ${VERSION}

          ${CHANGELOG}

          ---

          ### Main Pack (import in cf app):
          - **Dregora Parasited.zip**

          ### Config Packs:
          - **DregoraParasitedHCC.zip** - Hardcore Config (if you like pain)
          - **DregoraParasitedOmegaHCC_Server.zip** - Hardcore Config Omega (lose all progression on death)
          - **DregoraParasitedUnparasited.zip** - Unparasited (put the parasites where they came from)

          ### Installation:
          **Main Pack:** Import ZIP in CurseForge app or similar features in other launchers
          **Configpacks:** Download and extract over your Dregora Parasited installation, confirm to overwrite files
          EOFBODY
          # Expand environment variables
          envsubst < /tmp/release_body.md > /tmp/release_body_final.md
          mv /tmp/release_body_final.md /tmp/release_body.md

      - name: Create release body for ShyCraft releases
        if: steps.check_shycraft.outputs.IS_SHYCRAFT == 'true'
        id: shycraft_body
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          cat > /tmp/release_body.md << 'EOFBODY'
          ## ShyCraft Dregora Parasited ${VERSION}

          **⚠️ Pre-Release:** This is an automated build that ports the latest Dregora Parasited changes to the ShyCraft modpack. This is NOT an official ShyCraft release, ShyCraft doesn't even have a Dregora version yet.

          The ShyCraft team will release their own official versions on their own schedule.

          ---

          ### ShyCraft Modpack (import in cf app):
          - **ShyCraft Dregora Parasited.zip** - Complete modpack with ShyCraft customizations

          ### Installation:
          Import ZIP in CurseForge app or similar features in other launchers. This is a complete modpack, not a configpack overlay.
          EOFBODY
          # Expand environment variables
          envsubst < /tmp/release_body.md > /tmp/release_body_final.md
          mv /tmp/release_body_final.md /tmp/release_body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: ${{ steps.version.outputs.VERSION }}
          body_path: /tmp/release_body.md
          files: |
            build/*.zip
          draft: false
          prerelease: ${{ steps.check_shycraft.outputs.IS_SHYCRAFT == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}