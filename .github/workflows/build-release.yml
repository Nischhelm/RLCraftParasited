name: Build and Release Configpacks

on:
  push:
    tags:
      - '*'  # Trigger on any tag

permissions:
  contents: write  # Required to create releases

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/requirements.txt

      - name: Build main modpack
        run: |
          python tools/build_mainpack.py

      - name: Build all configpacks
        run: |
          python tools/packbuilder.py build --all

      - name: List built files
        run: |
          ls -lh build/

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Extract latest changelog
        id: changelog
        run: |
          python .github/scripts/extract_changelog.py overrides/changelog.md > /tmp/changelog_entry.md
          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          cat /tmp/changelog_entry.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: ${{ steps.version.outputs.VERSION }}
          body: |
            ## RLCraft Parasited ${{ steps.version.outputs.VERSION }}

            ${{ steps.changelog.outputs.CHANGELOG }}

            ---

            ### Main Pack (import in cf app):
            - **RLCraft Parasited.zip**

            ### Config Packs:
            - **RLCraftParasitedHCC.zip** - Hardcore Config (if you like pain)
            - **RLCraftParasitedOmegaHCC_Server.zip** - Hardcore Config Omega (lose all progression on death)
            - **RLCraftParasitedUnparasited.zip** - Unparasited (put the parasites where they came from)

            ### Installation:
            **Main Pack:** Import ZIP in CurseForge app or similar features in other launchers
            **Configpacks:** Download and extract over your RLCraft Parasited installation, confirm to overwrite files
          files: |
            build/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}