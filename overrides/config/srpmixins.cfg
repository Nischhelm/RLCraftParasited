# Configuration file

~CONFIG_VERSION(general): 1.0

general {
    # Bug fixes for SRP
    # Every option in here is a fix for something that doesn't work as intended in SRP
    Fixes {
        # Living/Sentient Armor and parasite adaptation fixes
        Adaptation {
            # In SRP, adaptable Parasites will have a chance to fail adapting to a damage type if they got hit by inFire or onFire dmg maximum 10 ticks (half a second) before the current hit.
            # This means you would have to hit them during the iframe the fire tick creates to make them fail the adaptation.
            # Enable this fix to instead make them have a chance to fail adaptation whenever they are burning (and not having fire resistance).
            # Warning: this makes any burn inflicting method to deal with parasites about twice as useful against their adaptation
            # Default: true
            B:"Fix Adaptation While Burning"=true

            # If adapting during an attack with no immediate attacker entity, SRP adapts to "". This fixes that bug. Requires "Overhaul Adaptation".
            # Default: true
            B:"Fix Null Adaptation"=true

            # If SRP doesn't find a blacklisted damage type for a mob/player in BlackList Mobs, it will also search the Blacklist Else list. This fixes that bug. Requires "Overhaul Adaptation".
            # Default: true
            B:"Fix Blacklist Check"=true

            # SRPConfig has a list "Adaptation Bonus" which isn't read properly and will crash if filled with entries. This fixes it.
            # Default: true
            B:"Fix Adaptation Bonus Config"=true

            # Adaptable parasites will adapt to the players mainhand weapon when hit by indirect dmgs (harming splash potions, arrows, modded indirect dmg sources). Enable this to make them adapt to the indirect dmg source instead (so magic, arrow etc). Moved from RLMixins (thanks Kotlin!)
            # Default: true
            B:"Fix Adaptation to Indirect Damages"=true
        }

        # Call of the Hive, assimilation and feralisation fixes
        "Call of the Hive" {
            # Fixes the srpcothimmunity tag (basically counting coth lvls) getting incremented for coth immune mobs, making them not immune anymore
            # Default: true
            B:"Fix srpcothimmunity tag"=true

            # If setting SRP config min assimilations required to spawn for a specific parasite, setting it to 0 will still not auto allow that spawn. This fixes it.
            # Default: true
            B:"Fix Min Assimilations Zero"=true

            # Feral Bears couldn't get created from assimilated ones upgrading or from gnats. This fixes it.
            # Default: true
            B:"Fix Feral Bear Creation"=true

            # Fixes mobs not checking for visibility when trying to spread COTH onto other mobs that have camouflage.
            # Also fixes assimilated mobs never checking for visibility when infecting nearby mobs
            # Default: true
            B:"Fix Infect Nearby Visibility"=true

            # When mobs convert due to COTH without a parasite attacking them, vanilla onDeath is not called for the entitiy. 
            # This for example leads to dead pets not notifying their owner about their death in chat and mobs with inventories (donkeys etc) not dropping the contents of their inventories. 
            # This fix calls onDeath and cancels the normal mob drops that would result in calling onDeath.
            # Default: true
            B:"Call OnDeath when converting"=true

            # Camouflage has a chance to protect against COTH (default: 70%). Since a lot of effects try to apply COTH every single tick, any chance to protect against COTH will fail in less than a second.
            # This fix makes Camouflage only check once whether it protects against COTH and then either protect or not protect for the entire duration.
            # This will also not apply Camouflage to mobs that already have COTH, which gives a small ability to check if a mob has low stage COTH (otherwise green particles)
            # NOTE: Camouflage only protects against COTH from some sources, not from all of them. Those sources are
            # - getting attacked by a parasite (except rupter)
            # - standing on gore/remain
            # - mobs & assimilated paras spreading COTH to nearby
            # Default: true
            B:"Fix Camouflage"=true

            # Assimilated mobs with a high enough killcount (SRP default config: 60) are supposed to turn into their feral forms, but this doesn't work in SRP. This fixes it.
            # Note: this will still only rarely happen, as the more usual thing is the assimilated mob having enough killcount to melt with 3 other nearby Assimilateds to moving flesh.
            # Default: true
            B:"Fix Assim turn to Feral"=true

            # Assimilated mobs only spawn naturally once enough of them have been created through assimilation. 
            # Assimilated Adventurers are created by players dying with COTH. 
            # However, this doesn't increase the number of total assimilations for Assimilated Adventurers, leading to them being unable to spawn naturally if their config min assimilation value is not 0.
            # Default: true
            B:"Fix Sim Adventurer Points"=true

            # SRP has the min assimilation value for sim adventurer use the sim human value. This overwrites it. Requires "Fix Sim Adventurer Points"
            # Default: 5
            I:"Sim Adventurer Min Assimilations"=5

            # Mobs that picked up items lose those items when they get assimilated, feralised or hijacked without dying first (for example through COTH or Gnats).
            # This fix makes them drop their picked up items when converting.
            # Default: true
            B:"Drop Picked Up Items on Conversion"=true
        }

        # Parasite damage fixes
        Damage {
            # The melee auras of Ancient Dreadnaughts, Bogles and Wraiths and the homing missiles of Ancient Overlords and Haunters use fixed damage values that ignore damage multipliers. This fixes it, using the base damages below.
            # Default: true
            B:"Fix Melee Aura and Homing Missile Damage"=true

            # Ancient Overlord homing missile base damage. Will be increased by various multipliers (SRP global damage multiplier and Stat Increase Rules)
            # Min: 0 Max: 2147483647 Default: 50.0
            D:"Overlord projectile base damage"=50.0

            # Haunter homing missile base damage. Will be increased by various multipliers (SRP global damage multiplier and Stat Increase Rules)
            # Min: 0 Max: 2147483647 Default: 32.0
            D:"Haunter projectile base damage"=32.0

            # Ancient Dreadnaught melee aura base damage. Will be increased by various multipliers (SRP global damage multiplier and Stat Increase Rules)
            # Min: 0 Max: 2147483647 Default: 32.0
            D:"Dreadnaught melee aura base damage"=32.0

            # Bogle melee aura base damage. Will be increased by various multipliers (SRP global damage multiplier and Stat Increase Rules)
            # Min: 0 Max: 2147483647 Default: 25.0
            D:"Bogle melee aura base damage"=25.0

            # Wraith melee aura base damage. Will be increased by various multipliers (SRP global damage multiplier and Stat Increase Rules)
            # Min: 0 Max: 2147483647 Default: 25.0
            D:"Wraith melee aura base damage"=25.0

            # Most parasite projectiles (bombs, spineballs, the balls of Elvia, Lencia, Anged, Alafha, Webball and DragonE) deal fixed damage values that ignore the shooters attack damage.
            # This makes them use the attack damage attribute of the shooter, so the SRP damage multipliers and Stat Increase Rules apply to them.
            # Default: true
            B:"Projectiles Use Attack Attribute"=true

            # Prevent spineballs (green projectiles shot by various parasites) from damaging armor if the hit failed, for example due to iframes.
            # Default: true
            B:"Fix Spineball Armor Damage"=true
        }

        # Beckon infestation, deterrent and nexus fixes
        "Infestation and Deterrents" {
            # Fix beckons reverting all the infested blocks around them on stage increase if evolution is disabled.
            # This also fixes dying higher stage beckons reverting infested blocks (if evolution is disabled) ignoring the SRP config "Reinforcement System Block Revert Stage" value, which would only allow reversion if the infested blocks were made by beckons with stage lower or equal to the config value.
            # Default: true
            B:"Fix Infested Block Reversion"=true

            # SRP only uses the Beckon Stage III Infestation Limits (in SRParasitesMobs.cfg) instead of limiting the infestation spread by beckon stage, essentially ignoring the stage I and stage II config values. This fixes it.
            # Default: true
            B:"Fix Block Infestation Limit"=true

            # When Beckons stand inside infested grass, they will not be able to propagate their new stage (after upgrade) to the infested blocks around them, making some infestation mechanics not work properly in those cases. This fixes it.
            # Default: true
            B:"Fix Block Infestation Beckon Upgrade"=true

            # If Dispatcher Nidus blocks are removed by unusual ways, the tile entity stays behind and will keep spawning a new dispatcher every second, or increase points massively if there already is a dispatcher nearby. This fix removes the tile entity correctly.
            # Default: true
            B:"Fix Infinite Dispatchers"=true
        }

        # Evolution phase and point fixes
        "Phases and Points" {
            # Limit point reduction from parasite kills to the min point value for each phase, stopping unintended phase decreases
            # Default: true
            B:"Fix phase point reduction"=true

            # SRP sometimes gets Evolution Data on clientside which overrides the current evolution phase in single player. Enable to stop this from happening
            # Default: true
            B:"Fix Phase Resets"=true

            # SRP doesn't prevent getting Node Data on clientside which would override the current node/colony data in single player. Nothing in SRP code actually does that, but SRP addon mods might. Enable to prevent this from happening.
            # Default: true
            B:"Fix Node Resets"=true

            # If Adapted mobs spawn and instantly despawn again due to distance to a player, SRP still gives players point penalty. This fixes it.
            # Default: true
            B:"Fix Adapted Penalty on Instant Despawn"=true

            # Allows using parasite names instead of ids for the SRParasitesSystems.cfg "Evolution Parasite Lock List".
            # Also checks for currphase >= lockphase instead of only currphase == lockphase as SRP does (only matters when using commands or high dim starting phases).
            # Default: true
            B:"Fix Parasites Unlocking"=true
        }

        # Parasite spawning fixes
        Spawning {
            # Fully overhauls the SRP spawning system.
            # SRP spawns parasites just to cancel the spawns right afterwards in various situations.
            # This slows down hostile mob spawning and takes up performance for no reason, even in dimensions where parasites aren't even allowed to spawn.
            # It also does mob cap counts for every single spawn instead of doing what vanilla does and doing a mob cap check for every spawn attempt (which can include multiple spawn packs).
            # It's also just very hard to read and includes various oversights due to being so spread out throughout the SRP code.
            # This fix puts the whole spawning logic into one place, auto fixes some bugs and fixes the aforementioned issues.
            # Automatically includes the following fixes (and probably others i haven't even spotted):
            # 	- "Fix Parasite Biome Spawns"
            # 	- "Fix Colony Lock in Para Biome"
            # 	- Auto fixes Quark Soul Beads being effectively incompat with SRP
            # Nerd info: This is done by adding a whole new spawning group PARASITE on top of the existing HOSTILE, PASSIVE, AMBIENT and WATER_CREATURE spawning groups, 
            # and modifying the potentialSpawnEvent instead of the checkSpawnEvent.
            # Default: true
            B:"Fix Spawning Entirely"=true

            # Parasites can't spawn from spawners in base SRP. This fixes it. Reintroduced after moving it to RLMixins
            # Default: true
            B:"Fix Spawner Block spawning"=true

            # SRP disables certain parasites until a colony is created. This also happens though if colonies aren't even activated, fully locking away certain parasites (preeminents by default). This makes SRP ignore the colony lock if colonies are disabled.
            # WARNING: SRP has preeminents in the default phase spawning lists for phase 3 and beyond. If you enable this fix, you will need to change your SRP defaults. Preeminents should only spawn in parasite biomes and/or late phases like 9/10.
            # Default: false
            B:"Fix Colony Lock - requires SRP config change"=false

            # SRP allows to disable certain parasites until a certain phase in a certain dimension is reached. This also happens though if phases aren't even activated, fully locking away certain parasites. This makes SRP ignore the evolution lock if evolution is disabled.
            # Default: true
            B:"Fix Evolution Lock"=true

            # If custom phase spawner is disabled, SRP checks for min and max type id of parasites per phase to spawn them. Different than with the custom spawner though, it also checks those ids for parasite biome spawns, which can make parasite biomes feel very empty. This makes the parasite biome ignore the min and max id and instead just spawn its config-set parasites no matter the phase.
            # Default: true
            B:"Fix Parasite Biome Spawns"=true

            # Colony Carrier has type id 31, making it equal to primitive mobs for phases enabled but custom phase spawner disabled. This will fix it to have a type id of 63, making it equal to other ground preeminents, making it spawn in phases 8-10 by default.
            # Default: true
            B:"Fix Colony Carrier Type Id"=true

            # If SRParasitesWorld.cfg "Colony Parasite Values Biome" is enabled, spawns in Parasite Biome would NEVER allow colony-locked parasites (default: preeminents) no matter how many colonies have been established in the world.
            # This fix makes it then use the actual colony point requirements set in SRParasitesWorld.cfg "Colony Parasite Values" instead.
            # Default: true
            B:"Fix Colony Lock in Para Biome"=true

            # Waves and Shockwaves are normal Parasite Entities and thus get lots of normal parasite behavior, for example the ability to target any mob once the phase is above phase total slaughter. This makes the wave instantly die though. This fixes it.
            # Default: true
            B:"Fix Wave Entities Early Death"=true

            # Make Primitive Devourer and Assimilated Squid spawn correctly in water
            # Default: true
            B:"Enable Water Spawns"=true
        }

        # Lure and carcass fixes
        "Lures and Carcasses" {
            # Make Carcasses reduce points while cooldown is active
            # Default: true
            B:"Fix Carcasses not working during cooldown"=true

            # When using faint lures, SRP also calls setCooldown for lures 9 and 10 (they forgot to set a break). This fixes it.
            # Default: true
            B:"Fix Cooldown Overflow"=true

            # Carcasses spawn scents with a certain level dependent on their own level. These scents will fall back to lvl 0 once they get updated once. This fixes it.
            # Default: true
            B:"Fix Carcass Scent Level"=true

            # Only allow carcasses built from 5 lures of the same type. Without this fix, only the level of the center lure matters
            # Default: true
            B:"Force carcass all same lure type"=true
        }

        # Parasite biome spreading and performance fixes
        "Parasite Biome" {
            # Fully overhauls the parasite biome spread logic to make it more performant. If there are other mods that use mixins with the biome spread system, there will be incompatibilities.
            # Includes a fix for ore blocks turning into Pestilent Ore Blocks.
            # Incompatible with Cotesia Glomerata
            # Default: true
            B:"Biome Spread Performance Overhaul"=true

            # SRParasites.cfg has two options for para biome spreading speed (cooldown+block limit), but those don't get applied. Set to true to fix that
            # Default: false
            B:"Fix Parasitic Biome spreading limit"=false

            # Parasite Bush and Vines will force load chunks when a parasite biome is growing. This stops the force loading. Moved from RLMixins (thanks fonny!)
            # Default: true
            B:"Fix Parasite Bush Generation Lag"=true

            # SRP sends a new network packet for every individual block position that gets turned into parasitic biome or back to plains. This fix sends one bigger packet instead, for performance.
            # Default: true
            B:"Fix SRP Biome Packet"=true

            # Colony buildings (and the flesh pillars they stand on) no longer overwrite node/colony cores or source portals.
            # Without this, colonies can replace their own core while building.
            # Default: true
            B:"Fix Colony Buildings Replacing Cores"=true

            # Colony buildings fill their floors by walking outwards until they hit their own wall.
            # If that wall has a gap, the walk never ends and freezes the server. This limits it to 14 blocks.
            # Default: true
            B:"Fix Colony Building Endless Floor"=true
        }

        # SRP potion effect fixes
        Potions {
            # SRP always incorrectly applies max dmg ( on mobs getting Needler, no matter the potion effect lvl. It also never applies it on players. This fixes both.
            # Default: true
            B:"Needler Fix"=true

            # SRP soft crashes whenever Needler tries to apply dmg to players. This is fixed if "Needler Fix" is enabled. Enable this config to finally make players suffer the fixed Needler effect.
            # Default: false
            B:"Needler Fix - Allow on Players"=true

            # SRP provides a configable maximum dmg for Needler applied on players, but the base percentage of max health which Needler does as dmg is the same for mobs and players. Use this value to customise this for players. Use any negative value to copy from SRPSystems value "Needler Damage" (default 0.4=40%)
            # Warning: Needler uses a fully custom damaging system via setHealth, which will ignore all other mods attempting to reduce/ignore dmg or cancel attacks/deaths. Only totems will protect players here.
            # Default: 0.4
            D:"Needler Fix - Dmg Multi for Players"=0.2

            # Potions should always be applied serverside, otherwise there can be desyncs. This fixes a few spots where SRP applies potions on clientside
            # Default: true
            B:"Fix clientside potions"=true

            # SRP Potions Rage and Heightened Senses use random UUIDs, making them stack on every restart. This fixes it.
            # Default: true
            B:"Fix attribute potions"=true
        }

        # Living and Sentient weapon fixes
        Weapons {
            # Fix parasites getting hit by sentient weapons not doing the correct things
            # Default: true
            B:"Fix parasite weapon damage"=true

            # Make living weapons evolving to sentient keep their NBT
            # Default: true
            B:"Fix parasite weapon evolution NBT loss"=true

            # Sentient Maul uses as its first lore line the second lore line of the living scythe because of an id overlap.
            # This makes Sentient Maul use a different lang key (ending in 69 instead of 10) for its first line to fix it.
            # Default: true
            B:"Fix Sentient Maul Lang Key"=true
        }

        # Fixes for how SRP reads its own configs
        "Config Handling" {
            # SRP parses its config list every single time instead of caching the result. For performance this stores the results instead.
            # Default: true
            B:"Fix Config List Parsing"=true

            # SRP has a bunch of configs that are not used. This toggle makes them all do what they are supposed to do. List of affected configs:
            # - Default Phase, Points, CanGain, Can(t)Lose
            # - Most Phase 9+10 configs (cooldown, killcount plus, scent bonus+reaction, beckon grow penalties, crop grow stunned, mobs spawning with COTH, beckon spawn from residue
            # - Spawning Rates of certain mobs making them not spawn at all with phases disabled (Monarch, Feral Bear, Light Carrier, Thrall)
            # - Merging flesh not spawning primitives with reduced health defined via merge config
            # - Mob Health/Dmg/Armor/KBres multipliers (Gnat, Hijacked Golem, Light Carrier, Worker, Prim Vermin, Feral Bear)
            # - XP value of sentries and kyphosis not using the deterrent XP value
            # - Preeminents incorrectly using the Pure value for remain value
            # - Points over time dimension blacklist
            # - Min phase for Beckons ignoring summoning cooldown
            # Default: true
            B:"Use Forgotten Configs"=true

            # SRP always uses the same method to treat its various config blacklists. In the case of an empty whitelist (list empty & treatAsWhitelist = true) the list is incorrectly treated as an empty BLACKlist, so instead of "deny all" its treated as "allow all". This fixes it.
            # Default: true
            B:"Fix Empty Whitelists read as Blacklists"=true
        }

        # Clientside, rendering and sound fixes
        "Client and Rendering" {
            # Disables non-SRP armor models from rendering in SRPLayerBipedArmor to avoid crashes
            # Default: true
            B:"SRPModelBiped Render Crash Fix"=true

            # Bit hard to explain but basically when Gnats die after 1 minute they call some serverside methods on the clientside which can lead to crashes on multiplayer servers.
            # This fixes it by just calling the relevant code on the serverside.
            # Default: true
            B:"Fix Gnat Client Crash"=true

            # Fixes SRP playing multiple phase increase warning sounds at the same time if there is multiple players in the dimension it happens in.
            # Default: true
            B:"Fix Multiple Phase Warnings"=true

            # Using RenderLib makes the head entity of Stage 4 Dispatchers not render. This fixes it.
            # Default: true
            B:"Fix Dispatcher Stage IV Head"=true
        }

        # Various fixes
        Various {
            # Some parasites have broken right click handling. When looking at them, all right click actions such as raising shields and drinking potions will get cancelled. This fixes it.
            # Default: true
            B:"Fix Right Clicking Parasite Entities"=true

            # Fixes Parasites with Tendrils regaining them on chunk reload. Also fixes Assimilated Enderdragon regaining its head the same way.
            # Default: true
            B:"Fix Paras Regaining Tendrils"=true

            # Parasites can't break blocks with zero hardness (slime, tnt etc). This fixes it.
            # Default: true
            B:"Fix Zero Hardness Break"=true

            # Disables the automatic debug log spam for Scent Entities
            # Default: true
            B:"Disable Scent Debug"=true

            # All crafting ingredient parasite drops stack to 16 except for strange bones. This makes them also stack to 16. Reintroduced after moving it to RLMixins
            # Default: true
            B:"Make Strange Bones stack to 16"=true

            # SRP Commands don't have proper autocompletion. This fixes it. Also fixes the /help command for them.
            # Default: true
            B:"Fix SRP Command Autocompletion"=true

            # Host and Herd summon their rupters/manglers only while dug down, also randomly without a target, and can send shockwaves and do swipe attacks in any state.
            # This makes them only summon while emerged and having a target, only swipe while emerged and only send shockwaves while dug down.
            # Default: true
            B:"Fix Host/Herd Emerged Attacks"=true

            # Tozoons, Hosts and Herds still take damage without an attacker (fire, poison, lava, cactus etc) while tunneled. This makes them immune to everything except void damage and /kill while fully tunneled.
            # Default: true
            B:"Fix Tunneled Parasite Immunity"=true

            # Parasite projectiles (spineballs etc) and Ancient Pods freeze and accumulate in lazy chunks (loaded but not ticking), since they only despawn while ticking. This removes them when they end up in a lazy chunk.
            # Default: true
            B:"Remove Projectiles in Lazy Chunks"=true
        }
    }

    # Changes to SRP behavior and new features
    Tweaks {
        # Evolution phase tweaks
        Phases {
            # SRP does the evolution mechanic per dimension. Custom phases do it per player, per chunk region or both.
            # Player phases: each player has their own phase and points. Cooldown, min/max days per phase, unlocks and assimilation counts are tracked per player, and players can gain or lose phases on their own.
            # Chunk phases: each chunk region has its own phase and points. Chunk regions have no cooldown of their own and their phase changes never send messages.
            # Using both: the phase at a position is the higher one of the nearest player and the chunk region there, except that phase -2 on either side overrides the other.
            # Points always go through the nearest player: the player gets them first, and the chunk region only gets them if the player accepted them.
            # Nothing gets points if no player is nearby or if either side is at phase -2.
            # Commands target the player.
            # Chunk phases (and with that the combination) get disabled if SRP Cotesia is loaded. Both toggles only take effect after a restart.
            "Custom Phases" {
                # Do the evolution mechanic per player instead of per dimension, allowing better multiplayer.
                # Can be combined with "Use Chunk Phases", see the description of this section.
                # Default: false
                B:"Use Player Phases"=true

                # Do the evolution mechanic per chunk region instead of per dimension. World areas that are inhabited longer will have higher phases.
                # Can be combined with "Use Player Phases", see the description of this section.
                # Incompatible with SRP Cotesia, gets disabled if Cotesia is loaded.
                # Default: false
                B:"Use Chunk Phases"=false

                # Worlds saved using player phases in SRPMixins 2.8.5 and earlier have their phase+point data accidentally spread out over multiple data files (one per dimension).
                # This patch loads old data and puts it into the global file in /data.
                # You can disable this patch to save a minimal amount of performance if you don't have worlds that were saved in SRPMixins 2.8.5 or older using player phases.
                # In an existing world it's enough to enter all dimensions once to have the patch be fully applied and allowing to disable this patch.
                # Default: true
                B:"Player Phases Legacy Patch"=false

                # Allows to define dimension and targeted player name in all /srpevolution subcommands. Usage: /srpevolution xyz [optional:dimid] [optional:playername]
                # Default: true
                B:"Modify srpevolution Command"=true

                # Makes timers like evolution cooldown and min/max phase use the player specific playtime instead of the global worldtime.
                # Enabling this will make players on servers stop losing cooldown etc while they are not online.
                # Default: true
                B:"Tick cooldowns individually"=true

                # If using chunk phases, a chunk region that gets points will be a square of this many chunks squared.
                # WARNING: never change this in an existing world, or you will lose your evolution progress
                # Min: 1 Max: 2147483647 Default: 3
                I:"Chunk Spacing"=3

                # If using chunk phases, how many regions around the current region should get updated when points or lure cooldown of a chunk change? It's a radius, so it will update a square of (2 x radius + 1)² regions. Default 3, so 7x7 regions
                # Min: 0 Max: 2147483647 Default: 2
                I:"Chunk Region Update Radius"=2

                # If using chunk phases, set the starting phase per biome id. All unset biomes will use the dimension default set in SRPSystems.cfg.
                # Pattern: modid:biomename=startPhase
                "Chunk Biome Start Phases" {
                    I:"minecraft:mutated_forest"=-2
                }

                # If using chunk phases, use regular dimension-wide phases for these dimensions to save performance
                # Default: [-1, 1, 111]
                I:"Chunk Phases Dimension Blacklist" <
                    -1
                    1
                    111
                >

                # If using chunk phases, turn the dimension blacklist for chunk phases into a whitelist
                # Default: false
                B:"Chunk Phases Dimension Blacklist is Whitelist"=false
            }

            # SRP phase configs for quick access and increase/decrease of phases
            "More Phases" {
                # SRP uses a fixed max phase of 10. Increase or decrease it with "Max Phase".
                # Using this will disable the base SRP configs for the values that are listed here.
                # When enabled and "Phases" is empty on startup, SRPMixins copies the current SRP config values into "Phases" and "Phase Spawn List".
                # If you want to modify the "Max Phase" your best workflow is to enable this first, start the game, close it, then change max phase and adapt the then filled lists.
                # Default: false
                B:"Enable More Phases"=true

                # SRP uses a fixed max phase of 10. Increase or decrease it with this value.
                # Default: 10
                I:"Max Phase"=10

                # Settings for each phase, the first entry is phase 0. Needs "Max Phase" + 1 entries.
                # Clear this list if you want SRPMixins to re-copy over your SRP config values.
                # Default: []
                C:Phases <
                    {
                        # Number of points required to reach this phase
                        # Default: 0
                        I:Points=0

                        # Each second the killcount of each parasite will go up by this amount
                        # Default: 0.0
                        D:"Killcount Plus"=0.0

                        # Message sent to all players in the current world when parasites reach this phase
                        # Default: 
                        S:"Warning Message"=ZERO - It begins

                        # Parasites will not be able to earn points until this time (seconds) has passed after the phase has started, working like a lure cooldown
                        # Default: 0
                        I:Delay=3600

                        # Number of points gained when skipping the night
                        # Default: 0
                        I:"Sleep Penalty"=0

                        # Only used if Custom Phase Spawner is disabled, otherwise the spawn list is used. If a parasite type ID is less than or equal to this number, the parasite will not spawn
                        # Default: 0
                        I:"Minimum Parasite Type ID"=0

                        # Only used if Custom Phase Spawner is disabled, otherwise the spawn list is used. If a parasite type ID is equal to or greater than this number, the parasite will not spawn
                        # Default: 0
                        I:"Maximum Parasite Type ID"=5

                        # Chance to spawn a Beckon when a parasite is killed
                        # Default: 0.0
                        D:"Reinforcement System Chance"=0.0

                        # Chance for stage I nexus parasites to fail to grow
                        # Default: 0.0
                        D:"Nexus Grow Stun Chance - Stage I"=0.0

                        # Chance for stage II nexus parasites to fail to grow
                        # Default: 0.0
                        D:"Nexus Grow Stun Chance - Stage II"=0.0

