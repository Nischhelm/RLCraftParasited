                # Min: 0.0 Max: 1.7976931348623157E308 Default: 40.0
                D:"Assimilated/Feral Endermen tp radius"=40.0

                # Disable this to not use min and max target tp radius config on Simmermen and Feral Endermen.
                # Default: true
                B:"Modify Assim/Feral Endermen target tp radius"=true

                # Min Distance from target at which Assimilated Endermen will tp themselves and other mobs for mobs to, default 1. Set to 0 to disable
                # Min: 0.0 Max: 1.7976931348623157E308 Default: 4.0
                D:"Assimilated Endermen min target tp radius"=4.0

                # Max Distance from target at which Assimilated Endermen will tp themselves and other mobs for mobs to, default 4. Set to 0 to disable
                # Min: 0.0 Max: 1.7976931348623157E308 Default: 6.0
                D:"Assimilated Endermen max target tp radius"=6.0

                # Min Distance from target at which Feral Endermen will tp themselves and other mobs for mobs to, default 1. Set to 0 to disable
                # Min: 0.0 Max: 1.7976931348623157E308 Default: 4.0
                D:"Feral Endermen min target tp radius"=4.0

                # Max Distance from target at which Feral Endermen will tp themselves and other mobs for mobs to, default 4. Set to 0 to disable
                # Min: 0.0 Max: 1.7976931348623157E308 Default: 6.0
                D:"Feral Endermen max target tp radius"=6.0
            }

            # Assimilated Squid and Primitive Devourer tweaks
            "Water Parasites" {
                # Make Water Parasites (Assim Squid + Prim Devourer) target Squids
                # Default: true
                B:"Water Parasites Target Squids"=true

                # How many blocks away Assimilated Squid can attack targets from. Set to -1 to disable fully, requires restart.
                # Min: -1 Max: 100 Default: 3.0
                D:"Assimilated Squid Attack Range"=3.0
            }
        }

        # Parasite spawning, conversion and despawning tweaks
        Spawning {
            # Blacklist of biomes and dimensions in which no parasites will spawn.
            # This works only for phases on + custom spawner on, except if "Fix Spawning Entirely" is enabled, in which case it always works.
            # Each entry is a dimension id with a list of biomes (modid:biomename) or full mods (modid).
            # Use an empty list to disable the full dimension.
            "Parasite Spawning Biome Blacklist per dimension" {
                S:0 <
                    minecraft:mutated_forest
                >
            }

            # Use Biome Blacklist as Whitelist
            # Default: false
            B:"Parasite Spawning Biome Blacklist per dimension is whitelist"=false

            # Max evolution phase at which the "Parasite Spawning Biome Blacklist per dimension" is active.
            # Above this phase, the black-/whitelist is ignored, including fully disabled dimensions.
            # Min: -2 Max: 2147483647 Default: 8
            I:"Parasite Spawning Biome Blacklist - Max Phase"=5

            # SRP does summoning via a max point system. Both don't really work and especially don't get saved/read to NBT so just unloading/reloading a parasite will clear its summon list. This does it correctly.
            # Pattern: paraname=maxSummonPoints
            # Set to -1 to ignore points.
            # Clear the list to disable this overhaul (requires restart).
            "Summoning Overhaul - Max Summon Points" {
                I:pri_summoner=4
                I:ada_summoner=6
                I:beckon_si=4
                I:beckon_sii=9
                I:beckon_siii=12
                I:beckon_siv=12
                I:dispatcher_si=3
                I:dispatcher_sii=5
                I:dispatcher_siii=7
                I:dispatcher_siv=9
                I:bomber_light=3
                I:grunt=3
                I:monarch=3
                I:overseer=6
                I:vigilante=3
                I:warden=3
                I:marauder=3
                I:bomber_heavy=3
                I:wraith=3
                I:bogle=3
                I:haunter=3
                I:carrier_colony=3
                I:architect=6
            }

            # Auto fill the conversion rules with existing conversion pathways when they happen. Will be updated on logout.
            # Default: false
            B:"Conversion Phase Lock Rules - Auto fill"=false

            # A lot of parasites evolve into each other. Use this list to stop specific evolution pathways until a specific phase is reached.
            # Note: this also works for COTH conversions (assim/feral/hijack/incomplete forms), use modid:mobname in that case. For SRP mobs you don't need to note the modid.
            # Special case: for incomplete forms use incompleteform without _small or _medium.
            # Default: []
            C:"Conversion Phase Lock Rules" <
                {
                    # Default: 
                    S:"Parasite In"=minecraft:squid

                    # Default: 
                    S:"Parasite Out"=sim_squid

                    # Default: 0
                    I:"Min Phase"=3
                }
                {
                    # Default: 
                    S:"Parasite In"=minecraft:enderman

                    # Default: 
                    S:"Parasite Out"=sim_enderman

                    # Default: 0
                    I:"Min Phase"=2
                }
                {
                    # Default: 
                    S:"Parasite In"=iceandfire:if_troll

                    # Default: 
                    S:"Parasite Out"=crux

                    # Default: 0
                    I:"Min Phase"=4
                }
                {
                    # Default: 
                    S:"Parasite In"=iceandfire:firedragon

                    # Default: 
                    S:"Parasite Out"=sim_dragone

                    # Default: 0
                    I:"Min Phase"=5
                }
                {
                    # Default: 
                    S:"Parasite In"=iceandfire:icedragon

                    # Default: 
                    S:"Parasite Out"=sim_dragone

                    # Default: 0
                    I:"Min Phase"=5
                }
                {
                    # Default: 
                    S:"Parasite In"=iceandfire:lightningdragon

                    # Default: 
                    S:"Parasite Out"=sim_dragone

                    # Default: 0
                    I:"Min Phase"=5
                }
                {
                    # Default: 
                    S:"Parasite In"=iceandfire:firedragon

                    # Default: 
                    S:"Parasite Out"=incompleteform

                    # Default: 0
                    I:"Min Phase"=5
                }
                {
                    # Default: 
                    S:"Parasite In"=iceandfire:icedragon

                    # Default: 
                    S:"Parasite Out"=incompleteform

                    # Default: 0
                    I:"Min Phase"=5
                }
                {
                    # Default: 
                    S:"Parasite In"=iceandfire:lightningdragon

                    # Default: 
                    S:"Parasite Out"=incompleteform

                    # Default: 0
                    I:"Min Phase"=5
                }
            >

            # In situations where parasite spawns should ignore light levels, they are still prevented by blocklight (torches and other light sources).
            # These situations are:
            # 	- when the phase is above the "Phase Parasites Ignore Sunlight"
            # 	- when inside a parasite biome
            # 	- or if "Mobs Ignore Sun" option is true (and evo phases off)
            # This config varies that behavior:
            # --- Parasites will only spawn if the blocklight is lower or equal to the given value. ---
            # Examples: Set to 16 to make light sources not affect spawning at all.
            # Or set to 0 to prevent any spawning if there is any blocklight on a block.
            # Default value of 7 is how SRP handles it.
            # NOTE: this config replaces the old RLMixins "Parasite Light Level (SRParasites)" mixin toggle (enabled = set to 16)
            # Min: 0 Max: 16 Default: 7
            I:"Min Blocklight Threshold"=7

            # Add rules to disable parasite variants. You can specify:
            # 	- group: mob group (INBORN, PRIMITIVE, ADAPTED, PURE, PREEMINENT)
            # 	- mob: specific mob or spacebar-separated list of mobs
            # 	- dim: dimension id
            # 	- phase: minphase and/or maxphase using operations >,<,=,!=,<=,>=
            # 	- nodes: count of nodes in the dimension, using the same operations
            # 	- variant: VIRULENT (green), BERSERKER (red), BREACHER (purple/dark) or SPECIAL (see below), can be multiple spacebar-separated onesIn situations where a rule is applicable, the named variant will be disabled.
            # Example: To disable all breacher parasites until phase 5 you do "[phase <= 5] [variant = BREACHER]"
            # Available variants:
            # Parasites that have VIRULENT, BERSERKER and BREACHER variants: ada_arachnida, ada_bolster, ada_longarms, ada_reeker, ada_summoner, pri_arachnida, pri_longarms, pri_reeker, pri_summoner, grunt
            # Parasites that have a BREACHER variant but no VIRULENT/BERSERKER: ada_manducater, ada_yelloweye, pri_devourer, pri_manducater, pri_yelloweye, all pures except grunt (light_bomber, marauder, monarch, overseer, vigilante, warden)
            # Rupters and Manglers only have VIRULENT and BERSERKER variants, but no BREACHER.
            # Primitive Bolsters only have VIRULENT and BREACHER variants, but no BERSERKER
            # SPECIAL cases: 
            # 	- Variants with changed stats: ada_longarms (tyrant), carrier_colony (armored), haunter (armored), pri_reeker (pale), monarch (deviantive), thrall (unnamed, no skin change)
            # 	- All three carriers (light_carrier, heavy_carrier, flying_carrier) have empty variant
            # 	- sim_enderman has crawling variant
            # Default: []
            S:"Variant Disable Rules" <
                [phase <= 3] [mob = rupter] [variant = VIRULENT BERSERKER]
                [phase <= 6] [mob = ada_longarms] [variant = SPECIAL]
            >

            # Despawn timer rules in ticks. Rules can be defined per phase, dimension, parasite and parasite group.
            # Format: [dim = xxx] [phase><= xxx] [mob = x y z] [group = xxx] despawnTimer
            # Where all [] entries are optional and are handled with an AND connection if multiple are present.
            # For phase the operator options are =, !=, <, >, <= and >= 
            # To define a specific area of phases, you can also use the "phase" keyword twice
            # "mob" can list multiple whitespace separated parasite names (without srparasites:), group can only name one
            # All rules that fit to the current state will be applied and add up to the total despawn timer.
            # If phases are disabled, rules using phases will be ignored.
            # These rules will only apply to parasites that would otherwise not despawn (depending on SRP config/default behavior). Parasites that would despawn anyway will not be affected.
            # Rules will usually apply on parasite creation so a given phase rule will mean the phase the entity got created in.
            # If the total timer is 0 or lower it won't apply.
            # Default: [[group = ASSIMILATED] 24000, [mob = sim_bigspider] -12000, [group = CRUDE] 48000]
            S:"Despawn Timer Rules" <
                [group = ASSIMILATED] 24000
                [group = FERAL] 24000
                [mob = sim_bigspider] -12000
                [group = CRUDE] 48000
                [group = NEXUS] 72000
                [mob = beckon_siv dispatcher_siv] -72000
            >

            # Make Assimilated+Feral Endermen be able to despawn if they got converted in the end (performance)
            # Default: true
            B:"End Simmermen despawn"=true

            # Parasite mob cap tweaks
            "Mob Caps" {
                # Requires "Fix Spawning Entirely"
                # Parasite Mob Cap multipliers per phase and dimension (and bloodmoon). 
                # Format: [dim = xxx] [phase><= xxx] [bloodmoon = true/false] [nodes ><= xxx] mobCapMulti
                # Where all [] entries are optional and are handled with an AND connection if multiple are present.
                # For phase the operator options are =, !=, <, >, <= and >= 
                # To define a specific area of phases, you can also use the "phase" keyword twice
                # All rules that fit to the current state will be applied as a multiplicator on the current mobCap
                # If phases are disabled, rules using phases will be ignored. The same happens if bloodmoon is disabled and a rule includes bloodmoons.
                # Default: [[dim = 0] [bloodmoon = true] 2, [dim = 111] [bloodmoon = true] 4, [phase < 0] 0, [phase >= 0] [phase <= 10] 1]
                S:"Parasite Mob Cap Rules" <
                    [phase < 0] 0
                    [phase < 3] 0.4
                    [phase = 3] [dim = 0] 0.5
                    [phase = 9] 1.25
                    [phase = 10] 1.5
                    [dim = -1] 1.25
                    [dim = 1] [phase > 3] 1.5
                    [dim = 111] 2.5
                    [dim = 0] [bloodmoon = true] 1.5
                    [dim = 111] [bloodmoon = true] 1.5
                    [dim = 254] 3
                >

                # Custom Mob Cap for Nexus Parasites (Dispatcher+Beckon) using SRP Phase Custom Spawner. Nexus Parasites still count to the global SRP Mob Cap. Disable with -1, requires MC restart for full disable
                # Min: -1 Max: 2147483647 Default: 15
                I:"Nexus Mob Cap"=15

                # After there is this many Water Parasites (including Deep Sea Danger) loaded, no more will spawn from conversion or spawning. Disable with -1, needs restart.
                # Parasites spawned from conversion have a 1.5x higher cap so the assimilation doesnt always fail directly
                # Min: -1 Max: 2147483647 Default: 10
                I:"Water Parasite Mob Cap"=10

                # Max amount of Assimilated+Feral Endermen that can spawn via assimilation in the end (Disable with -1, requires MC restart for full disable)
                # Min: -1 Max: 2147483647 Default: 40
                I:"End Simmermen Conversion Cap"=40
            }
        }

        # Beckon infestation, deterrent and nexus tweaks
        "Infestation and Deterrents" {
            # Fully overhauls the beckon infestation spread logic to make it more performant. If there are other mods that use mixins with the infestation system, there will be incompatibilities.
            # Incompatible with Cotesia Glomerata
            # Default: true
            B:"Infestation Performance Overhaul"=true

            # Beckons infest blocks in a square shaped area. This makes the area circular instead, looks better.
            # Default: true
            B:"Circular Infestation Area"=true

            # If set to true, fully disables the infestation reversion mechanic where killing a Beckon above certain infested blocks with low enough internal "stage" they will turn back to various non-infested blocks.
            # Default: false
            B:"Disable Infestation Reversion"=false

            # Will allow quenches to turn remain blocks to air on impact.
            # Default: true
            B:"Quenchs Remove Remains"=true

            # Beckons spawned when there is infested blocks with no beckons around are normally able to despawn.
            # Set to true to make those beckons persistent just like other beckons are.
            # Default: false
            B:"Stop Infested Block Beckon Despawn"=false

            # Deny Stage 3 Beckons growing up if a Stage 4 Beckon is already nearby (20 blocks distance)
            # Default: true
            B:"Limit Stage 4 Beckons"=true

            # Whitelist Deterrent and Nexus mobs to take dmg per second if world is in low evolution phase
            # Default: [srparasites:kyphosis, srparasites:sentry, srparasites:seizer, srparasites:dispatcherten, srparasites:beckon_si, srparasites:beckon_sii, srparasites:beckon_siii, srparasites:beckon_siv, srparasites:dispatcher_si, srparasites:dispatcher_sii, srparasites:dispatcher_siii, srparasites:dispatcher_siv]
            S:"Deterrents take damage from low phase whitelist" <
            >

            # Set to true to use Deterrent taking dmg whitelist as blacklist
            # Default: false
            B:"Deterrent whitelist is blacklist"=true

            # Beckon infested area grows a lot of infested grass in it. Increase this multiplier to make it more rare (default SRP is 1, default here is 8x rarer).
            # Min: 0.0 Max: 1.7976931348623157E308 Default: 8.0
            D:"Infested Grass Rarity"=8.0

            # Play respective sounds when Beckons or Dispatchers of higher stages naturally spawn
            # Default: true
            B:"Play high stage Beckon+Dispatcher spawn sounds"=true
        }

        # Parasite biome tweaks
        "Parasite Biome" {
            # Smooths client fog color and density updates and prevents unrelated world loads from clearing rendered fog.
            # Default: true
            B:"Smooth Parasitic Biome Fog"=true

            # SRP keeps a single fog density value for all players at the same time. In Multiplayer this leads to desyncs with no fog appearing inside the biome, or fog appearing outside of the biome. This makes the fog density per player instead.
            # Default: true
            B:"Per Player Parasitic Biome Fog"=true

            # How often (in ticks) the server checks whether nodes/colonies have been removed (default: 24000). Set to -1 to disable the mixin.
            # Min: -1 Max: 2147483647 Default: 200
            I:"Node/Colony Removal Check Frequency"=200

            # Overrides SRP's "Minimum Distance Between Nodes" per dimension.
            # Each entry is a dimension id with the minimum distance in blocks. Dimensions not listed use the SRP config value.
            # Leaving this empty disables the mixin (needs restart).
            "Minimum Distance Between Nodes per dimension" {
                I:111=300
            }
        }

        # Biome Purifier tweaks
        "Biome Purifier" {
            # Makes some values of the Biome Purifier tweakable (see configs here) and makes it more performant.
            # Included fixes without a toggle:
            # 	- Applies potion effects (glowing/rage) in the whole chunk column (down to bedrock) instead of just in 32 blocks cube distance
            # 	- Reverts infestation on block place instead of on random tick
            # 	- Applies potion effects on block interact instead of on random tick
            # Default: true
            B:"Tweak Biome Purifier"=true

            # How many blocks away the biome purifier will clean up infested (not parasite biome!) blocks when placed.
            # Min: 0 Max: 2147483647 Default: 5
            I:"Infestation Reversion Range"=5

            # Base SRP Biome Purifier only applies glowing to the first found Nexus parasite, this fix applies it to all of them
            # Default: true
            B:"Apply Glowing To All"=true

            # How many ticks a Nexus mob will have Glowing for after being affected by a biome purifier
            # Min: 0 Max: 2147483647 Default: 1200
            I:"Glowing Duration"=1200

            # How many ticks parasites in range will have Rage II for after being affected by a biome purifier
            # Min: 0 Max: 2147483647 Default: 1200
            I:"Rage Duration"=1200

            # How many chunks(!) away entities are affected (glowing/rage) by the biome purifier.
            # Min: 0 Max: 2147483647 Default: 2
            I:"Effect Range"=2
        }

        # Lure and carcass tweaks
        "Lures and Carcasses" {
            # Make Carcass point reduction amount be based on current phase, see multipliers below
            # Default: false
            B:"Carcass Phase Dependent"=true

            # Phase multiplier on carcass values (0 to 10). Default values are balanced against Carcasses having values of 1,3,10,40,100,1000 for the 6 available Carcass variants in SRPSystems cfg.
            # Default: [40, 40, 80, 1000, 6000, 50000, 200000, 200000, 200000, 400000, 400000]
            I:"Carcass Phase Multipliers" <
                40
                40
                80
                1000
                6000
                50000
                200000
                200000
                200000
                400000
                400000
            >

            # Make using Lures add their cooldown to current cooldown instead of setting it to a fixed value, possibly even reducing the cooldown by doing that
            # Default: true
            B:"Lures stack cooldown"=true

            # If enabled, disallows using lures and carcasses until the current phase at least matches their inherent phase
            # Default: false
            B:"Block Lures until respective phase"=true

            # If enabled, carcasses can maximally decrease the phase by 1. At max they can reduce from some phase at 99% to the phase one lower at 0%, so max the span of two entire phases. Need to use multiple carcasses to decrease by more than one phase.
            # Default: false
            B:"Carcasses decrease max one phase"=true
        }

        # Living and Sentient weapon, armor and bow tweaks
        "Weapons and Armor" {
            # Fully disable the sentient evolution mechanic where living weapons/armor/bow evolve to sentient after x kills
            # Default: false
            B:"Disable Sentient Evolution Mechanic"=false

            # Sentient weapons keep counting parasite kills(/HP) even though it doesn't do anything for them. Set to true to remove this Tooltip
            # Default: true
            B:"Remove Parasite Kills tooltip from sentient weapons"=true

            # Copy the same sentient evolution handling of living weapons to living armor and living bow
            # Default: true
            B:"Sentient Armor+Bow Evolution"=true

            # When living gear evolves to sentient, by default that gear is dropped on the ground. Set to true to keep in inventory.
            # (If for whatever reason the stack has more than one item, it will always drop the evolved gear)
            # Note: for armor and bow this only applies if "Sentient Armor+Bow Evolution" is enabled
            # Default: false
            B:"Keep Evolved Gear"=true

            # Will allow living and sentient gear to be repaired by the items they are created with. Vile Shell for Armor, Infectious Blade Fragment for Weapons, Dried Tendons for Bows.
            # Default: true
            B:"Repairable Gear"=true

            # Change how living armor evolves to sentient. 
            # DEAL_DAMAGE: gets points when players kill mobs, depending how much health they have, same as living weapons. 
            # TAKE_DAMAGE: gets points when players take damage.
            # Default: DEAL_DAMAGE
            # Valid values:
            # DEAL_DAMAGE
            # TAKE_DAMAGE
            S:"Armor Evolution System"=TAKE_DAMAGE

            # If enabled, living gear will only get points when interacting (killing/taking dmg from) parasites, not just any mob.
            # Default: false
            B:"Evolution Only From Parasites"=true

            # You can modify the default attack speed of all living+sentient weapons here. This mixin is always active, as i didnt find a good way to disable it.
            "Weapon Attack Speeds" {
                D:"Living Axe"=0.9
                D:"Living Cleaver"=0.9
                D:"Living Lance"=0.9
                D:"Living Maul"=0.9
                D:"Living Scythe"=0.9
                D:"Living Sword"=0.9
                D:"Sentient Axe"=0.7
                D:"Sentient Cleaver"=0.7
                D:"Sentient Lance"=0.7
                D:"Sentient Maul"=0.7
                D:"Sentient Scythe"=0.7
                D:"Sentient Sword"=0.7
            }
        }

        # Parasite Piercer and Parasite Slicer enchantments
        Enchantments {
            # Parasite Piercer Enchantment
            "Parasite Piercer" {
                # Chance to ignore dmg cap per enchantment lvl of Parasite Piercer Enchantment
                # Default: 0.2
                D:"Parasite Piercer - Chance to ignore"=0.2

                # Register Parasite Piercer Enchantment
                # Default: true
                B:"Parasite Piercer - Enabled"=false

                # Whether Parasite Piercer Enchantment should be incompatible with Fire Aspect
                # Default: true
                B:"Parasite Piercer - Incompatibility"=true

                # Max Lvl of Parasite Piercer Enchantment
                # Default: 3
                I:"Parasite Piercer - Max Lvl"=3

                # Whether Parasite Piercer Enchantment is a treasure enchant
                # Default: false
                B:"Parasite Piercer - Treasure"=false
            }

            # Parasite Slicer Enchantment
            "Parasite Slicer" {
                # Added Damage per enchantment lvl of Parasite Slicer Enchantment
                # Default: 2.5
                D:"Parasite Slicer - Damage"=2.5

                # Register Parasite Slicer Enchantment
                # Default: true
                B:"Parasite Slicer - Enabled"=false

                # Whether Parasite Slicer Enchantment should be incompatible with Sharp/Smite/BoA
                # Default: true
                B:"Parasite Slicer - Incompatibility"=true

                # Max Lvl of Parasite Slicer Enchantment
                # Default: 5
                I:"Parasite Slicer - Max Lvl"=5

                # Whether Parasite Slicer Enchantment is a treasure enchant
                # Default: false
                B:"Parasite Slicer - Treasure"=false
            }
        }

        # SRP potion effect tweaks
        Potions {
            # Base SRP Foster effect (only given by Colony Carriers) is op.
            # It makes adaptable parasites increase their resistances by one step about once every second (more exactly: 25 ticks)
            # That might feel a bit much. You can set a chance here for this to succeed.
            # Set to a negative value to disable the mixin.
            # Min: -0.01 Max: 1.0 Default: 0.02
            D:"Foster Chance"=0.02

            # Base SRP Fear has a modifiable damage multiplier for entities in the air (!onGround) or flying (capabilities.isFlying).
            # Enable this toggle to make the damage multiplier only apply when actually flying, not when just jumping or falling.
            # Default: false
            B:"Fear Damage Only When Flying"=false
        }

        # Item, block and loot tweaks
        "Items and Blocks" {
            # Max distance to a node of stage 1,2,3 to be found by the node compass. Will be disabled if its not exactly three entries. Clear the list if you want to disable it.
            # Default: [2147483647, 2147483647, 2147483647]
            I:"Node Compass max distance" <
                2147483647
                2147483647
                2147483647
            >

            # Parasites regularly break blocks. Use this list to blacklist some blocks for certain parasites or parasite groups.
            # Special group names: PRIMITIVE, ADAPTED, PURE, PREEMINENT, ANCIENT, NEXUS, DETERRENT, ASSIMILATED, FERAL, INBORN, HIJACKED, CRUDE
            # For specific parasites use their ingame mobid so for example ada_longarms
            # Each entry is a block (modid:blockname, or modid:blockname:metadata for only that metadata 0-15) with a list of parasite mobids and parasite groups
            "Block Break Blacklist" {
            }

            # Adaptable mobs can steal food from the players inventory via attacks or scary orbs. Use this blacklist to disable them from stealing certain foods.
            # Pattern: modid:itemname=metadata, use -1 as metadata for any metadata
            "Food Steal Item Blacklist" {
            }

            # Set to true to make the food steal item blacklist a whitelist instead
            # Default: false
            B:"Food Steal Item Blacklist is Whitelist"=false

            # Replaces all SRP loot configs with vanilla loot table jsons that will be written into /config/srpmixins/loot_tables/some_parasite.json and can be modified there.
            # Delete files there to make them regenerate from SRPs config system.
            # For people wanting to add looting modifiers to SRP drops, the relevant LootingEnchantBonus/RandomChanceWithLooting modifiers are already setup with default values of "no looting effect"You can optionally use the loot condition srp_phase (member: "phase_range" (value: min & max or just an integer)) to vary the loot tables over evolution phase
            # Default: false
            B:"Use Vanilla Loot Tables"=true
        }

        # Various tweaks
        Various {
            # Make SRP Blacklists/Whitelists use wildcards to dis/enable whole mods (*). WARNING: this forces you to change all current SRP config lists that use full mod names without wildcards
            # Default: false
            B:"SRP Blacklists are Wildcard-able"=false

            # Plays randomly overlayered different pitches of the phase sound (and occasionally some others) which according to this features author Iqury sounds more scary.
            # Default: false
            B:"Alt Phase Sounds"=false
        }

        # Source dimension WIP
        "Source Dimension" {
            # Global toggle for the source dimension WIP
            # Default: false
            B:"Enable Source Dimension"=true

            # Dimension id of the source dimension. Change it if another mod already uses this id.
            # Default: 254
            I:"Dimension ID"=66

            # Big Ball portals between the overworld and the source dimension
            Portals {
                # Big Balls (the portals) are this many times as common in the source dimension as SRP's "Biome Bigball chance" makes them in the overworld.
                # Only affects newly generated chunks.
                # Min: 0.0 Max: 1.7976931348623157E308 Default: 5.0
                D:"Big Ball Multiplier"=3.0

                # Whether mobs (including parasites) can travel through the portals. Players always can.
                # Default: true
                B:"Mobs Can Use Portals"=true
            }

            # Root organs: the cores of nodes and colonies, grown into the source dimension
            Roots {
                # Ticks before the same player can alert the parasites again
                # Min: 0 Max: 2147483647 Default: 600
                I:"Alert Cooldown"=600

                # Starting to mine a root's core alerts the parasites within this many blocks
                # Min: 0.0 Max: 1.7976931348623157E308 Default: 48.0
                D:"Alert Radius"=48.0

                # How many parasites get alerted per tick. Lower values spread the pathfinding cost over more ticks.
                # Min: 1 Max: 2147483647 Default: 3
                I:"Alerts Per Tick"=3

                # Message sent to all players in the colony's dimension and in the source dimension when a colony's root gets destroyed. Empty to disable.
                # Default: The hive falls silent. A colony has withered away.
                S:"Colony Death Message"=The hive falls silent. A colony has withered away.

                # Message sent to all players in the node's dimension and in the source dimension when a node's root gets destroyed. Empty to disable.
                # Default: The corruption recedes. A node has withered away.
                S:"Node Death Message"=The corruption recedes. A node has withered away.

                # Whether infested blocks decay while the biome recedes (living soil and flesh turn to draining water, parasite plants rot away, parasite stone crumbles to cobblestone).
                # If disabled, only the biome changes back.
                # Default: true
                B:"Recede Blocks"=true

                # Ticks it takes for a dead node's parasite biome to recede from the node to the edge of its area (54000 = 45 minutes)
                # Min: 1 Max: 2147483647 Default: 54000
                I:"Recede Duration"=54000

                # Nodes and colonies in these dimensions grow a root organ in the source dimension.
                # Their core can then only be destroyed there, which kills the node/colony and lets the parasite biome recede.
                # A portal Big Ball grows next to them, leading to the root.
                # Default: [0, -1, 1]
                I:"Root Organ Dimensions" <
                    0
                    -1
                    1
                >

                # The portal Big Ball next to a node/colony grows between these many blocks away from its core
                "Node Portal Ball Distance" {
                    # Min: 0 Max: 2147483647 Default: 14
                    I:Min=14

                    # Values below Min count as Min
                    # Min: 0 Max: 2147483647 Default: 22
                    I:Max=22
                }

                # The portal Big Ball next to a root in the source dimension grows between these many blocks away from the root's spike
                "Root Portal Ball Distance" {
                    # Min: 0 Max: 2147483647 Default: 30
                    I:Min=30

                    # Values below Min count as Min
                    # Min: 0 Max: 2147483647 Default: 45
                    I:Max=45
                }

                # Length of a root's spike, from the cavern ceiling to its tip. Min is at least 4.
                # It reaches down almost to the cavern floor, but at most the max. Caverns too low for the min get a pit dug into their floor.
                "Root Spike Length" {
                    # Min: 0 Max: 2147483647 Default: 45
                    I:Min=45

                    # Values below Min count as Min
                    # Min: 0 Max: 2147483647 Default: 80
                    I:Max=80
                }
            }

            # Biomes of the source dimension
            Biomes {
                # Size of the biome regions. 1 is the default, 2 makes them twice as big. Only affects newly generated chunks.
                # Min: 0.1 Max: 1.7976931348623157E308 Default: 1.0
                D:"Region Size"=1.0

                # How much of the dimension are the special biomes, the rest stays SRP's parasite biome.
                # 1 is the default (a bit more than half), higher values give more special biomes. Only affects newly generated chunks.
                # Min: 0.1 Max: 1.7976931348623157E308 Default: 1.0
                D:"Special Biome Amount"=1.0

                "Bone Fields" {
                    # Chance for every natural parasite spawn to bring a second one of the same kind
                    # Min: 0.0 Max: 1.0 Default: 0.0
                    D:"Extra Spawn Chance"=0.0

                    # Fog color as hex (RRGGBB), empty to keep SRP's parasite fog color
                    # Default: A8A49C
                    S:"Fog Color"=A8A49C

                    # Multiplier for how thick SRP's parasite fog is in this biome
                    # Min: 0.0 Max: 1.7976931348623157E308 Default: 1.0
                    D:"Fog Density"=1.0

                    # Multiplier for SRP's growth (trees, flowers, bushes, ...) on the floors. Only affects newly generated chunks.
                    # Min: 0.0 Max: 1.7976931348623157E308 Default: 0.35
                    D:"Growth Multiplier"=0.35
                }

                "Brood Hollows" {
                    # Chance for every natural parasite spawn to bring a second one of the same kind
                    # Min: 0.0 Max: 1.0 Default: 0.5
                    D:"Extra Spawn Chance"=0.5

                    # Fog color as hex (RRGGBB), empty to keep SRP's parasite fog color
                    # Default: 2A3110
                    S:"Fog Color"=2A3110

                    # Multiplier for how thick SRP's parasite fog is in this biome
                    # Min: 0.0 Max: 1.7976931348623157E308 Default: 1.0
                    D:"Fog Density"=1.0

                    # Multiplier for SRP's growth (trees, flowers, bushes, ...) on the floors. Only affects newly generated chunks.
                    # Min: 0.0 Max: 1.7976931348623157E308 Default: 1.0
                    D:"Growth Multiplier"=1.0
                }

                "Colony Wastes" {
                    # Chance for every natural parasite spawn to bring a second one of the same kind
                    # Min: 0.0 Max: 1.0 Default: 0.0
                    D:"Extra Spawn Chance"=0.0

                    # Fog color as hex (RRGGBB), empty to keep SRP's parasite fog color
                    # Default: 
                    S:"Fog Color"=

                    # Multiplier for how thick SRP's parasite fog is in this biome
                    # Min: 0.0 Max: 1.7976931348623157E308 Default: 0.35
                    D:"Fog Density"=0.35

                    # Multiplier for SRP's growth (trees, flowers, bushes, ...) on the floors. Only affects newly generated chunks.
                    # Min: 0.0 Max: 1.7976931348623157E308 Default: 0.5
                    D:"Growth Multiplier"=0.5
                }

                "Flesh Swamp" {
                    # Chance for every natural parasite spawn to bring a second one of the same kind
                    # Min: 0.0 Max: 1.0 Default: 0.2
                    D:"Extra Spawn Chance"=0.2

                    # Fog color as hex (RRGGBB), empty to keep SRP's parasite fog color
                    # Default: 8C1410
                    S:"Fog Color"=8C1410

                    # Multiplier for how thick SRP's parasite fog is in this biome
                    # Min: 0.0 Max: 1.7976931348623157E308 Default: 1.0
                    D:"Fog Density"=1.0

                    # Multiplier for SRP's growth (trees, flowers, bushes, ...) on the floors. Only affects newly generated chunks.
                    # Min: 0.0 Max: 1.7976931348623157E308 Default: 1.3
                    D:"Growth Multiplier"=1.3
                }

                "Parasite Biome" {
                    # Chance for every natural parasite spawn to bring a second one of the same kind
                    # Min: 0.0 Max: 1.0 Default: 0.0
                    D:"Extra Spawn Chance"=0.0

                    # Fog color as hex (RRGGBB), empty to keep SRP's parasite fog color
                    # Default: 
                    S:"Fog Color"=

                    # Multiplier for how thick SRP's parasite fog is in this biome
                    # Min: 0.0 Max: 1.7976931348623157E308 Default: 1.0
                    D:"Fog Density"=1.0

                    # Multiplier for SRP's growth (trees, flowers, bushes, ...) on the floors. Only affects newly generated chunks.
                    # Min: 0.0 Max: 1.7976931348623157E308 Default: 1.0
                    D:"Growth Multiplier"=1.0
                }
            }

            # Ruins, fossils, colony buildings and other structures of the source dimension. Only affect newly generated chunks.
            Structures {
                # Chance per chunk for a deadblood lake on a cavern floor (affected by the biome)
                # Min: 0.0 Max: 1.0 Default: 0.2
                D:"Cavern Lake Chance"=0.2

                # Chance per chunk for an SRP colony building in the colony wastes (they don't generate anywhere else)
                # Min: 0.0 Max: 1.0 Default: 0.4
                D:"Colony Building Chance"=0.4

                # Chance per chunk for a fossil in the caverns (6x in the bone fields)
                # Min: 0.0 Max: 1.0 Default: 0.02
                D:"Fossil Chance"=0.02

                # Chance per chunk in the bone fields for a giant jaw: a row of huge teeth on an arc
                # Min: 0.0 Max: 1.0 Default: 0.03
                D:"Giant Jaw Chance"=0.03

                # Chance per chunk for a deadblood lake on the surface (affected by the biome)
                # Min: 0.0 Max: 1.0 Default: 0.08
                D:"Surface Lake Chance"=0.08

                # Chance for each village block at the bottom of a building to be eaten away
                # Min: 0.0 Max: 1.0 Default: 0.1
                D:"Village Decay"=0.1

                # Extra decay chance per block above the bottom of a building, so roofs collapse first
                # Min: 0.0 Max: 1.0 Default: 0.07
                D:"Village Decay Per Height"=0.07

                # Villages (digested ruins) are this many chunks apart on average. Must be more than 8.
                # Min: 9 Max: 2147483647 Default: 24
                I:"Village Distance"=24
            }

            # Light, sound and fog of the source dimension (client side)
            Atmosphere {
                # Average ticks between two ambient sounds
                # Min: 1 Max: 2147483647 Default: 240
                I:"Ambient Sound Interval"=240

                # Volume of the ambient sounds. Above 1 makes them audible from further away, not louder.
                # Min: 0.0 Max: 1.7976931348623157E308 Default: 1.5
                D:"Ambient Sound Volume"=1.5

                # Whether parasite sounds play every now and then around the player in the source dimension
                # Default: true
                B:"Ambient Sounds"=true

                # Light level of eye bushes in the source dimension (0-15, 0 to disable)
                # Min: 0 Max: 15 Default: 10
                I:"Eye Bush Light"=10

                # How fast the fog color and density change when entering another biome. Share of the way per tick, 1 is instant.
                # Min: 0.001 Max: 1.0 Default: 0.04
                D:"Fog Transition Speed"=0.04
            }
        }
    }

    # Compatibility with other mods
    "Mod Compat" {
        # OverLast and OverLast Lite compat
        OverLast {
            # SRPMixins has compat with OverLast when using custom phases (player phases or chunk phases). 
            # Use this to toggle off the compatibility.
            # It is auto disabled anyway if you dont use custom phases or OverLast.
            # Works with both OverLast and OverLastLite (only HUD)
            # Default: true
            B:"Custom Phases Compat"=true

            # Remove point display from overlast phase HUD for more immersion and uncertainty.
            # Default: false
            B:"HUD Without Points"=true

            # Fixes the OpenGL State before rendering the OverLast evolution bar so it doesn't take on the color of the gui that was rendered before it.
            # Default: true
            B:"HUD GL State Fix"=true

            # Shows changes of the evolution points as rising and fading numbers (+1, +5, -100) above the phase number of the OverLast evolution bar.
            # Needs to be enabled on the server as well.
            # Default: false
            B:"HUD Point Changes"=true
        }

        # Scape and Spartan: Parasites compat
        "Scape and Spartan Parasites" {
            # Set to true to make "Scape and Spartan: Parasites" weapons with the Uncapped property ignore parasite damage caps.
            # NOTE: This property works without SRPMixins as well, this just streamlines the handling a bit. 
            # I kinda thought it didn't work - without actually testing it...
            # Default: true
            B:"Ignore Dmg Cap"=false
        }

        # In Control compat
        "In Control" {
            # This allows using some additional rules in InControl specifically for SRP
            # New Rules: "srp_minphase", "srp_maxphase", "srp_minnodes", "srp_maxnodes", "srp_mincolos", "srp_maxcolos"
            # All rules take a single integer number as comparison and can be used in any incontrol json.
            # Note: Nodes and Colonies are counted over all dimensions, thats just how SRP works
            # Default: true
            B:"Add SRP Rules"=true
        }

        # Antique Atlas compat
        "Antique Atlas" {
            # Renders custom tiles in the Antique Atlas for parasite biomes.
            # Default: true
            B:"Render Biome Tile"=true
        }

        # The Hordes compat
        "The Hordes" {
            # Registers "srparasites:phase", "srparasites:kills" and "srparasites:nodes" value getters and more importantly  "srpmixins:phase", "srpmixins:kills" and "srpmixins:nodes" conditions for The Hordes mod.
            # Note: i prefixed the conditions with srpmixins modid to not compete with Hordes unreleased SRP compat conditions srparasites:phase and srparasites:kills which work slightly differently and don't have srpmixins custom phase compat.
            # Default: true
            B:"Register Conditions & ValueGetters"=false
        }

        # SRPExtra compat
        SRPExtra {
            # The issue here is Aqua Remains using a clientside field crashing them.
            # This is caught but makes them not spawn, and spams the server log
            # For SRPExtra 0.6.x, will probably crash in other versions
            # Default: false
            B:"Fix serverside damageAni issues"=true
        }

        # Simple Voice Chat compat
        "Simple Voice Chat" {
            # Registers a Simple Voice Chat Plugin that makes parasites hear players.
            # Default: true
            B:"Parasites Hear Players"=false

            # If Sound Volume (in db) is higher than this, parasites will hear players
            # Min: -100.0 Max: 0.0 Default: -10.0
            D:"Volume Threshold"=-10.0

            # Parasites farther away than this distance (in blocks) will never hear players
            # Min: 1 Max: 100 Default: 50
            I:"Max Distance"=50

            # If enabled, will write a status message "They can hear you" when parasites hear the player through Simple Voice Chat. 
            # WIP, i kinda want this to be less intrusive
            # Default: true
            B:"Notify Player"=true
        }
    }

    # Debug logging
    Debug {
        # Send logs when methods try to find a player to do player phase stuff with and not finding one
        # Default: false
        B:"Player Phases debug mode"=false

        # Send logs when phase or nodes would get accidentally reset (gets prevented by SRPMixins, but should still be fixed directly)
        # Default: true
        B:"Phases reset debug mode"=true

        # Enable detailed logging for dispatcher storage.
        # Default: false
        B:"Enable Dispatcher Store Logging"=false
    }
}


