# Configuration file

~CONFIG_VERSION(general): 1.0

general {
    Bloodmoon {
        # Prevent bloodmoons if all players are below this SRP evolution phase (and evolution is enabled)
        # Disable mixin by setting to -1 (requires restart)
        # Min: -1 Max: 10 Default: 3
        I:"Bloodmoon Minimum Phase (Mixin Toggle)"=3
    }

    "Bountiful Baubles" {
        # Fix crafting recipes using existing baubles changing the bauble modifier.
        # In RLCraft this happens when changing backpack colors.
        # Default: true
        B:"Fix Crafting Changing Modifier (MixinToggle)"=true
    }

    Champions {
        # Champion spawn chance increase for parasites in phase 9+ (0.5 = 50% increase)
        # Set to 0 to disable mixin (requires restart)
        # Min: 0.0 Max: 1.7976931348623157E308 Default: 0.5
        D:"Champion Parasite Chance Increase (Mixin Toggle)"=0.5

        # Champions will not be able to get more added damage than this value times the growthFactor of their rank.
        # Example: A 5 star with growthFactor of 15 wont get more than +750 dmg.
        # The breakpoint is reached at this value divided by champions attackDamage cfg,
        #  so by default 50/0.5 = 100 base dmg
        # Disable mixin by setting to 0 (requires restart)
        # Min: 0.0 Max: 1.7976931348623157E308 Default: 50.0
        D:"Damage Cap per growthFactor (Mixin Toggle)"=50.0
    }

    "Cherry On 1.12.2" {
        # Removes all default archeology loot so it can be fully controlled by the cherryon treasure config
        # Default: true
        B:"Disable Default Archeology Loot (MixinToggle)"=true

        # Disables CherryOn overwriting various vanilla wood recipes for no reason.
        # Default: true
        B:"Disable Wood Recipe Modifications (MixinToggle)"=true

        # Fixes a clientside RTG compat method being called on remote servers leading to crashes.
        # Default: true
        B:"Fix Clientside call (MixinToggle)"=true

        # Fixes RTG compat crashing for default RTG, only for RTG plus and RTG Unofficial
        # Default: true
        B:"Fix RTG Biome Registration (MixinToggle)"=true
    }

    "Distant Horizons" {
        # Makes DistantHorizons not depend on MixinBooter.
        # Default: true
        B:"Remove MixinBooter Dependency (ASM Toggle)"=true
    }

    "Electroblob's Wizardry" {
        # Set arcane tome max stack size to 16
        # Default: true
        B:"Arcane Tome Stack Size (MixinToggle)"=true

        # Remove mana flask charging recipes for wizard armor
        # Default: true
        B:"Disable Armor Charging (MixinToggle)"=true

        # Remove scroll and armor upgrade recipes from JEI
        # Default: true
        B:"Disable Scroll & Armor Upgrade JEI Recipes (MixinToggle)"=true

        # Disable armor and wand drops from wizards and evil wizards
        # Default: true
        B:"Disable Wizard Gear Drops (MixinToggle)"=true

        # Remove armor recipes from JEI imbuement altar category
        # Default: true
        B:"JEI Imbuement Recipes (MixinToggle)"=true

        # Remove various wizard trades (arcane tomes, armor, wand upgrades)
        # Default: true
        B:"Modify Wizard Trades (MixinToggle)"=true

        # Remove ebwizardry enchantment info pages from JEI
        # Default: true
        B:"Remove Enchantments from JEI (MixinToggle)"=true

        # Blocks that wizardry spells cannot break
        # Leave empty to disable mixin (requires restart)
        # Default: [minecraft:mob_spawner, minecraft:chest]
        S:"Wizardry Unbreakable Blocks (Mixin Toggle)" <
            minecraft:mob_spawner
            minecraft:chest
        >
    }

    "Enchanter Tools" {
        # Chance to replace enchanted book trades with enchanted inkwell trades (with max ench lvl) on librarians.
        # Set to 0 to disable the mixin (requires restart).
        # Min: 0.0 Max: 1.0 Default: 0.01
        D:"Enchanted Inkwell Chance (MixinToggle)"=0.01

        # Makes Comprehension scale xp gains by +x% per lvl instead of scaling as x1.5, x3, x4.5 etc. Also allows to set a chance to get it.
        # Default: true
        B:"Modify Comprehension (MixinToggle)"=true

        # By how much to increase experience gains when comprehension is active.
        # Requires "Modify Comprehension".
        # Min: 0.0 Max: 1.7976931348623157E308 Default: 0.35
        D:"Comprehension XP Scale"=0.35

        # Chance to get Comprehension when using an XP Bottle. Requires "Modify Comprehension"
        # Min: 0.0 Max: 1.0 Default: 0.15
        D:"Comprehension Apply Chance"=0.15

        # Adds a usage falloff system to the pondering orb (repeated use causes nausea/fear).
        # Default: true
        B:"Pondering Orb Falloff (MixinToggle)"=true

        # Makes the Pondering Orb drain XP points instead of levels.
        # Default: true
        B:"Pondering Orb Uses XP (MixinToggle)"=true

        # Makes Inkwells added to loot pools be unenchanted.
        # Default: true
        B:"Loot Inkwells Unenchanted (MixinToggle)"=true

        # Fixes a bug in EnchanterTools 1.1.1a making enchanting with no bookshelves impossible for some items.
        # Default: true
        B:"Fix Min Enchanting Lvl (Mixin & ASM Toggle"=true
    }

    "Familiar Fauna" {
        # Maximum height for pixie spawning
        # Set to -1 to disable mixin (requires restart)
        # Min: -1 Max: 256 Default: 110
        I:"Pixie Max Spawn Height (Mixin Toggle)"=110
    }

    FermiumMixins {
        # Configure Bountiful Baubles Broken Heart behavior
        # Default: true
        B:"Broken Heart Config (MixinToggle)"=true

        # Maximum damage that Broken Heart bauble can activate on (-1 for infinite)
        # Min: -1.0 Max: 1.7976931348623157E308 Default: 1000.0
        D:"Broken Heart Max Damage"=-1

        # Minimum health required on a body part for Broken Heart to activate
        # Min: 0 Max: 2147483647 Default: 4
        I:"Broken Heart Min Health"=0

        # Configure Reskillable Undershirt behavior
        # Default: true
        B:"Undershirt Config (MixinToggle)"=true

        # Maximum damage that Undershirt trait can activate on (-1 for infinite)
        # Min: -1.0 Max: 1.7976931348623157E308 Default: 1000.0
        D:"Undershirt Max Damage"=-1.0

        # Minimum health required on a body part for Undershirt to activate
        # Min: 0.0 Max: 1.7976931348623157E308 Default: 4.0
        D:"Undershirt Min Health"=0.0
    }

    "Grappling Hook" {
        # Add visible item cooldown to Ender Staff
        # Default: true
        B:"Ender Staff Cooldown (MixinToggle)"=true
    }

    "Ice and Fire" {
        # Post AnimalTameEvent when amphithere is tamed
        # Default: true
        B:"Amphithere Tame Event (MixinToggle)"=true

        # Post AnimalTameEvent when cockatrice is tamed
        # Default: true
        B:"Cockatrice Tame Event (MixinToggle)"=true
    }

    "In Control!" {
        # Fixes rules using "mod".
        # If your installed profile is in a path containing "curseforge", all mobs would be matched to forge -> minecraft modid by incontrols modid check.
        # Default: true
        B:"Fix mod rules (MixinToggle)"=true
    }

    "Infernal Mobs" {
        # Infernal spawn chance increase for parasites in phase 9+ (0.5 = 50% increase)
        # Set to 0 to disable mixin (requires restart)
        # Min: 0.0 Max: 1.7976931348623157E308 Default: 0.5
        D:"Infernal Parasite Chance Increase (MixinToggle)"=0.5
    }

    Inspirations {
        # Fix cauldron creating splashing tipped arrows on some potions (water, mundane etc)
        # Default: true
        B:"Cauldron Arrow Fix (MixinToggle)"=true

        # Prevent dye recipe when cauldron is boiling (to protect charm coffee brewing)
        # Default: true
        B:"Cauldron Coffee Protection (MixinToggle)"=true
    }

    "Inventory Tweaks" {
        # Fix autorefill sometimes throwing out items, especially on laggy servers
        # Default: true
        B:"Fix Autorefill (MixinToggle)"=true
    }

    Locks {
        # Add dragonbone lock pick item
        # Default: true
        B:"Dragonbone Lock Pick (MixinToggle)"=true

        # This is the chance to not break, as long as no enchantments are involved
        # Min: 0.0 Max: 1.0 Default: 0.97
        D:"Dragonbone Lock Pick Strength"=0.97

        # Lock picking close-to-fail pitch multiplier
        # Disable mixin by setting to the default value of 1.25 (requires restart).
        # Min: 0.0 Max: 2.0 Default: 0.5
        D:"Lock Picking Pitch Multiplier"=0.5
    }

    "Mod Containers" {
        # Map of modids to dependencies that should be removed.
        # This will not magically remove actual dependencies, just the declaration in @Mod or mcmod.info
        "Removed declared Dependencies" {
            S:zenutils <
                configanytime
            >
            S:distanthorizons <
                mixinbooter
            >
        }
    }

    "Nether API" {
        # Make (default) BetterNether Bone Reef more common, otherwise it basically doesn't spawn at all when using Nether API.
        # Default: true
        B:"Fix Bone Reef Rarity (MixinToggle)"=true

        # How big nether biomes will be.
        # Set to 3 (default) to disable mixin (requires restart).
        # Min: 1 Max: 2147483647 Default: 1
        I:"Nether Biome Size"=1
    }

    "No Tree Punching" {
        # Saws are set to not be repairable, which doesnt stop mending but it does stop golden osmosis and anvil repairing. This removes that limitation.
        # Default: true
        B:"Make Saws Repairable (MixinToggle)"=true
    }

    Quark {
        # Fix quark shulker dropoff not using the correct slot making it fail in certain situations
        # Default: true
        B:"Shulker Dropoff Fix (MixinToggle)"=true
    }

    RLMixins {
        # Reduce nausea movement penalty
        # Default: true
        B:"Nausea Reduction (MixinToggle)"=true
    }

    RLTweaker {
        # Fix Drowneds spamming log about added door break AI
        # Default: true
        B:"Drowned LogSpam Fix (MixinToggle)"=true

        # Makes Curse Break tomes actually work when right clicking
        # Default: true
        B:"Fix Curse Break Tomes (MixinToggle)"=true
    }

    Reskillable {
        # Items that can be repaired with Golden Osmosis trait
        # Empty list to disable mixin (requires restart)
        # Default: []
        S:"Golden Osmosis Repairable Items" <
            forgottenitems:hasty_pickaxe
            forgottenitems:obsidian_harvester
        >

        # Only drop extra wheat when fully grown
        # Default: true
        B:"More Wheat Fix (MixinToggle)"=true
    }

    Rustic {
        # Makes hopper support for Brewing Barrels better: 
        # Top hopper: juice in, Back: empty bottles for new wine, Side: old wine, Bottom: all output slots.
        # Default: true
        B:"Hopper go Brrew (MixinToggle)"=true
    }

    "Scape and Run: Parasites" {
        # Ignore light level spawn check for parasites in End dimension
        # Default: true
        B:"Light Ignore in End Dim (MixinToggle)"=true

        # Add Pivot effect to nearby parasites when Dispatcher Nidus fails to create a Dispatcher entity
        # Default: true
        B:"Nidus Spreads Pivot (MixinToggle)"=true
    }

    "Serene Seasons" {
        # Fix serene seasons not checking simpledifficulty dimension whitelist to change temperature
        # Default: true
        B:"Temperature Dimension Fix (MixinToggle)"=true
    }

    "Set Bonus" {
        # Fix rare concurrency crash when rendering setbonus tooltips
        # Default: true
        B:"Concurrency Fix (MixinToggle)"=true
    }

    "Simple Difficulty" {
        # Apply thirst after iframes check so it only gets decreased on successful attacks
        # Default: true
        B:"Thirst IFrames Fix (MixinToggle)"=true
    }

    "Varied Commodities" {
        # Musket loading time in ticks (20 ticks = 1 second)
        # Set to default 60 ticks to disable mixin (requires restart)
        # Min: 1 Max: 200 Default: 20
        I:"Musket Loading Time"=20
    }

    "Wolf Armor" {
        # Remove wolf armor bonus roll in loot pools. Otherwise each luck point gives one extra wolf armor
        # Default: true
        B:"Disable Bonus Rolls (MixinToggle)"=true
    }

    "XP Tome" {
        # Adds a Greater XP Tome that can store up to 100 levels (30970 XP) instead of the normal tome's 30 levels (1395 XP).
        # Default: true
        B:"Greater XP Tome (MixinToggle)"=true

        # How much XP the Greater XP Tome should hold. Default 30970 = 100 lvls.
        # Min: 0 Max: 2147483647 Default: 30970
        I:"Greater XP Tome Size"=30970
    }

    ZenUtils {
        # List of classes to replace ConfigAnytime.register with zenutils ConfigAnytimeAnytime.register
        # Default: [youyihj.zenutils.impl.core.Configuration, git.jbredwards.baubleye.PatchConfigs]
        S:"ConfigAnytime Dependency Replacements (ASM Toggle)" <
            youyihj.zenutils.impl.core.Configuration
            git.jbredwards.baubleye.PatchConfigs
        >

        # Makes #mixin Share work in ZenUtils 1.27.5. Was fixed in ZenUtils 1.28.7, this backports the fix.
        # Default: true
        B:"Fix Share Annotation (ASM Toggle)"=true
    }
}


