        # Default: NORMAL
        # Valid values:
        # PEACEFUL
        # EASY
        # NORMAL
        # HARD
        S:"New World Difficulty"=HARD

        # Stops sprinting when riding an entity like a boat.
        # Without this, the server still thinks the player is sprinting while riding.
        # Default: true
        B:"Stop Sprinting While Riding (MixinToggle)"=true
    }

