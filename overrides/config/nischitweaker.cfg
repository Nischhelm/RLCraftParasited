            # Default: ANALYZER
            # Valid values:
            # ALWAYS
            # ANALYZER
            # NEVER
            S:"Stats Tooltip"=ANALYZER

            # Chance per minute for a bucketed Book Wyrm in a player inventory to hop out of its bucket. Digesting Book Wyrms never escape.
