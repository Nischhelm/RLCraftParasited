        # Adds an Anti-Lure block (requires SRPMixins)
        Anti-Lure {
            # Right clicking an Anti-Lure melts all parasites around it and breaks it.
            # Melted parasites drop no loot or xp and don't count as dying, instead the player phase increases by some points.
            # Can't be used while the parasites can't gain points, for example during the phase cooldown or in the max phase.
            # Default: false
            B:"Enable Anti-Lure"=true

            # Radius in blocks around the Anti-Lure in which parasites melt
            # Min: 0.0 Max: 1.7976931348623157E308 Default: 24.0
            D:Radius=24.0

            # How many ticks parasites take to melt
            # Min: 1 Max: 2147483647 Default: 60
            I:"Melt Duration"=60

            # Base points for parasites that have neither a group nor a name listed in "Points"
            # Min: 0 Max: 2147483647 Default: 2
            I:"Default Points"=10

            # Base evolution points gained per melted parasite, depending on parasite group or parasite. Gets multiplied by the phase multiplier
            # Pattern: group or name=value
            # Examples: PURE=5, rupter=0.5, someaddonmodid:someaddonparaname=4.2
            # If a parasite has a group and is named separately here, the parasite specific value will be used, the group value will be ignored
            Penalties {
                I:INBORN=1
                I:"srparasites:carrier_light"=5
                I:"srparasites:carrier_flying"=5
                I:"srparasites:carrier_heavy"=5
                I:ASSIMILATED=5
                I:CRUDE=20
                I:FERAL=20
                I:HIJACKED=20
                I:PRIMITIVE=20
                I:DETERRENT=20
                I:"srparasites:mangler"=20
                I:ADAPTED=50
                I:PURE=200
                I:PREEMINENT=500
                I:ANCIENT=1000
                I:"srparasites:sim_dragone"=1000
                I:"srparasites:sim_dragonehead"=200
            }

            # Registered Anti-Lure tiers (block metadata 0 to 15) and their multiplier on the gained points
            # Pattern: tier=multiplier
            "Tier Multipliers" {
                I:1=1
                I:2=3
                I:3=10
                I:4=40
                I:5=100
                I:6=1000
            }

            # Multiplier on the summed up base points of all melted parasites, depending on the current phase
            # First entry is for phase 0 (and below), the last entry is used for all phases beyond the list
            # Default: [4.0, 4.0, 10.0, 50.0, 50.0, 300.0, 1500.0, 1500.0, 1500.0, 1500.0]
            D:"Phase Multipliers" <
                4.0
                4.0
                10.0
                50.0
                50.0
                300.0
                1500.0
                1500.0
                1500.0
                1500.0
            >

            # Parasite groups or names that don't melt
            # Examples: NEXUS, beckon_si, someaddonmodid:someaddonparaname
            # Default: [beckon_siii, beckon_siv, dispatcher_siii, dispatcher_siv]
            S:Blacklist <
                srparasites:beckon_siii
                srparasites:beckon_siv
                srparasites:dispatcher_siii
                srparasites:dispatcher_siv
            >

            # Dimension ids in which the Anti-Lure can't be used
            # Default: []
            I:"Dimension Blacklist" <
            >
        }
    }

    "Serene Seasons" {
        # Fix serene seasons not checking simpledifficulty dimension whitelist to change temperature
        # Default: true
        B:"Temperature Dimension Fix (MixinToggle)"=true
    }

    "Set Bonus" {
        # Fix rare concurrency crash when rendering setbonus tooltips
        # Default: true
        B:"Concurrency Fix (MixinToggle)"=true

        # Fix NoSuchMethodError crash (PrefixedSearchTree.getMode) when SetBonus refreshes JEI tooltips with newer JEI versions
        # Default: true
        B:"JEI SearchMode Fix (MixinToggle)"=true
    }

    "Simple Difficulty" {
        # Apply thirst after iframes check so it only gets decreased on successful attacks
        # Default: true
        B:"Thirst IFrames Fix (MixinToggle)"=true
    }

    "Spartan Shields" {
        # Fixes a potential exploit in Spartan Shields
        # Default: true
        B:"Exploit Fix: Spartan Shields (MixinToggle)"=true
    }

    "The Lost Cities" {
        # Adds an Infested Bed that teleports to and from the Lost Cities dimension when right clicked, ignoring the Portal Phase Lock
        # It needs the same setup as a Lost Cities portal bed ("specialBedBlock" below it and skulls around it), but works in any dimension including the End
        # Breaking it drops nothing
        # Default: false
        B:"Infested Portal Bed (MixinToggle)"=true

        # Activating an SRP Lure in the Lost Cities dimension turns it into a Dispatcher Nidus instead
        # Default: false
        B:"Lures Become Nidus (MixinToggle)"=true

        # Lost Cities portals (sleeping in a bed) are locked until the player reaches this SRP evolution phase
        # Disable mixin by setting to -1 (requires restart)
        # Min: -1 Max: 10 Default: -1
        I:"Portal Phase Lock (Mixin Toggle)"=5

        # In Lost Cities space worlds, allows players without a bed to (re)spawn at a random position within the spawnRadius gamerule around the world spawn
        # Positions are always inside a city sphere and below its dome, never in the void or on top of the dome. Respects spawnNotInBuilding of the profile
        # Default: true
        B:"Space Spawn Radius (MixinToggle)"=true
    }

    "Varied Commodities" {
        # Musket loading time in ticks (20 ticks = 1 second)
        # Set to default 60 ticks to disable mixin (requires restart)
        # Min: 1 Max: 200 Default: 20
        I:"Musket Loading Time"=20
    }

    "Wolf Armor" {
        # Remove wolf armor bonus roll in loot pools. Otherwise each luck point gives one extra wolf armor
        # Default: true
        B:"Disable Bonus Rolls (MixinToggle)"=true
    }

    "XP Tome" {
        # Adds more XP Tomes with the given names and xp storage abilities.
        # To add more, you will need to provide a lang key, a texture, an item model json and a recipe json.
        # Default: greater_xp_book with 30970 = 100 lvl storage
        # Clear map to disable mixin.
        # Works for XP Tome v1.1.6
        "Additional XP Tomes (MixinToggle)" {
            I:greater_xp_book=30970
        }
    }

    ZenUtils {
        # List of classes to replace ConfigAnytime.register with zenutils ConfigAnytimeAnytime.register
        # Default: [youyihj.zenutils.impl.core.Configuration, git.jbredwards.baubleye.PatchConfigs, mod.acgaming.universaltweaks.config.UTConfigGeneral, mod.acgaming.universaltweaks.config.UTConfigTweaks, mod.acgaming.universaltweaks.config.UTConfigBugfixes, mod.acgaming.universaltweaks.config.UTConfigMods]
        S:"ConfigAnytime Dependency Replacements (ASM Toggle)" <
            youyihj.zenutils.impl.core.Configuration
            git.jbredwards.baubleye.PatchConfigs
        >

        # Makes #mixin Share work in ZenUtils 1.27.5. Was fixed in ZenUtils 1.28.7, this backports the fix.
        # Default: true
        B:"Fix Share Annotation (ASM Toggle)"=true
    }
