# Configuration file

general {

    weapons {
        B:ballAndChain=false
        B:batteringRam=false
        B:bladeStaff=true
        B:claws=true
        B:flail=true

        # Per-family content switches. False removes crafting/upgrade recipes and generated loot, and hides the family from Creative. Existing items remain registered and usable so old worlds are safe. Restart required.
        B:morningStar=true
        B:scimitar=false
        B:sunWarBulwark=false
        B:tartsyShield=false
    }

    reach {
        # Min: 1.0
        # Max: 64.0
        D:ballThrowReachPerCharge=4.0

        # Min: 1.0
        # Max: 64.0
        D:ballWindupReach=3.0

        # Min: 1.0
        # Max: 64.0
        D:flailRadius=4.0
    }

    effects {
        S:ballAndChainHit <
         >
        S:ballPlayerFracture <
            nanonaitors_arsenal:armor_fracture@tier@10
         >
        S:batteringRamHit <
         >
        S:bladeStaffHit <
         >
        S:bladeStaffReflect <
            nanonaitors_arsenal:stunned@1@1
         >

        # Additional successful-hit effects for each weapon family. Empty by default.
        S:clawsHit <
         >
        S:flailHit <
         >
        S:icedDragonboneHit <
            minecraft:slowness@3@5
            minecraft:mining_fatigue@3@5
         >
        S:livingBallAndChain <
            srparasites:debar@tier@10
         >
        S:livingClaws <
            srparasites:bleed@tier@10
         >
        S:livingFlail <
         >
        S:livingMorningStar <
            srparasites:corrosive@tier@10
         >
        S:morningStarFracture <
            nanonaitors_arsenal:armor_fracture@tier@tier
         >
        S:morningStarHit <
         >
        S:morningStarStun <
            nanonaitors_arsenal:stunned@1@3
         >

        # Effect lists: modid:potion@level@seconds, e.g. minecraft:weakness@2@10.
        # Levels are 1-based. Use tier for the existing tier-dependent level/duration.
        # Empty lists or blank entries apply no effect. Missing optional mod effects are skipped.
        # These replace the named potion procs, not direct damage, armor piercing, fire or lightning.
        # scimitarHitExtra: optional effects on every scimitar hit, empty by default; the scimitar's
        # ability is now the block counter (see scimitars). The old default was minecraft:weakness@tier@10.
        S:scimitarHitExtra <
         >
        S:tartsyDash <
            nanonaitors_arsenal:stunned@1@1
         >
        S:venomHit <
            minecraft:poison@3@10
         >
    }

    shields {
        # Allow shield-specific enchantments on Arsenal shields (including compatible modded shield types). Unbreaking/Mending remain allowed. Restart recommended.
        B:allowShieldEnchantments=true
    }

    stunned {
        # Entity registry IDs immune to Arsenal Stunned, e.g. minecraft:wither or modid:mob. Empty list means no extra immunities.
        S:entityBlacklist <
         >
    }

    worldequipment {
        # Offer same-tier Arsenal alternatives in Forge loot tables containing vanilla/Spartan melee weapons. Only plain entries are swapped: named, NBT-set or attribute-set items (modpack legendaries) are never replaced. Socketed stays optional and handles its own loot rolls.
        B:lootIntegration=true

        # Min: 0.0
        # Max: 1.0
        D:lootReplacementChance=0.25

        # Allow newly spawned vanilla humanoids already carrying a vanilla/Spartan melee weapon to use a same-tier Arsenal weapon. Does not equip empty hands, replace bows, or touch named mobs and named/lore/attribute gear.
        B:mobEquipment=true

        # Min: 0.0
        # Max: 1.0
        D:mobReplacementChance=0.25

        # If Socketed is installed, use its configured MOB_DROP socket roll for newly equipped Arsenal weapons. No effect without Socketed.
        B:socketMobEquipment=true
    }

    enchantments {
        # Disabled enchantments remain registered to protect existing saves, but cannot be obtained, applied, or provide effects. Restart required.
        B:enableAll=false
        B:enableBreeched=false
        B:enableEndure=false
        B:enableLongChain=false
        B:enableLuna=false
        B:enableMagicLog=false
        B:enableRecovery=false
        B:enableReverso=false
        B:enableRotationForce=false

        # Maximum level of Long Chain. The natural default cap is 2.
        # Min: 1
        # Max: 100
        I:longChainMaxLevel=2

        # Maximum level of Rotation Force. Each level adds 0.2 attack speed; the default cap is 3.
        # Min: 1
        # Max: 100
        I:rotationForceMaxLevel=3
    }

    morningstar {
        # Seconds required for a Morning Star to reach full charge. Each quarter adds 10% damage and widens the sweep.
        # Min: 0.25
        # Max: 60.0
        D:fullChargeSeconds=2.0
    }

    ##########################################################################################################
    # scimitars
    #--------------------------------------------------------------------------------------------------------#
    # Scimitar counter: blocking an attack while holding a scimitar (dual-scimitar guard or any shield) empowers the next scimitar hit or shield bash.
    ##########################################################################################################

    scimitars {
        # Damage multiplier for the next scimitar hit or shield bash after a block (the bash's combined dual-wield damage is multiplied).
        # Min: 1.0
        # Max: 5.0
        D:counterMultiplier=1.3

        # How long a block's counter stays ready before fading.
        # Min: 1
        # Max: 60
        I:counterWindowSeconds=5
    }

    ##########################################################################################################
    # sounds
    #--------------------------------------------------------------------------------------------------------#
    # Client-side: loudness of Arsenal's own weapon sounds.
    ##########################################################################################################

    sounds {
        # Multiplier for Arsenal's own weapon sounds (chains, ram, claws, bashes, reflects). 1 = normal, 0 = silent.
        # Min: 0.0
        # Max: 2.0
        D:volume=1.0
    }

    ##########################################################################################################
    # animations
    #--------------------------------------------------------------------------------------------------------#
    # Client-side third-person weapon animations. Changes apply immediately.
    ##########################################################################################################

    animations {
        # Stretch Arsenal weapon swing animations to each weapon's real attack cooldown instead of vanilla's fixed swing.
        B:attackSpeedSwings=true

        # Draw flail and ball-and-chain chains in each tier's material instead of realistic iron.
        # Off (default): every chain is dark iron, as crafted from iron chain; Living and Sentient chains are red (tendon).
        B:chainMaterialColors=false

        # With Mo' Bends installed, apply the same weapon poses through Mo' Bends' own skeleton instead of overriding it.
        B:moBendsPoses=true

        # Animate the player's arms for Arsenal weapons in third person:
        # two-handed holds, ramming, flail and ball-and-chain spins, blade staff paddling,
        # attack-speed-timed swings, and strained one-handed variants of two-handed weapons.
        B:weaponPoses=true
    }

}


