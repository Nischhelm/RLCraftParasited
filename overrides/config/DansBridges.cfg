# Configuration file

general {

    "general settings" {
        # How many of the bridges are broken, in percent: a stretch of the deck over the middle of the river has fallen in, with ragged edges, stumps of the piers and posts left in the water, and some of the rubble on the river bed. Only bridges over rivers of 6 blocks or more break. Default: 25
        # Min: 0
        # Max: 100
        I:"Broken Bridges"=25

        # How many of the squares that a river runs through get a bridge, in percent. Default: 60
        # Min: 0
        # Max: 100
        I:Chance=60

        # The dimensions, by number, that bridges are built in: 0 is the Overworld, -1 the Nether and 1 the End. Leave it empty for every dimension. They are only built over rivers, and never in flat worlds or with structures turned off. Default: 0
        I:Dimensions <
            0
         >

        # Build bridges across rivers: arched stone bridges, stone bridges with railings and a lantern under the arch, humped stone bridges, small stone footbridges, great cobblestone bridges, plain wooden bridges, wooden bridges with railings and stone gates, and rickety ones. Their kind and their wood come from the biome on the bank. Default: true
        B:Enabled=true

        # The narrowest river that a bridge is built across, in blocks of water. Default: 4
        # Min: 2
        # Max: 48
        I:"Narrowest River"=6

        # How far apart the bridges are: the world is cut into squares of this many chunks, and each square can have one, where a river runs through it. Default: 8
        # Min: 4
        # Max: 64
        I:Spacing=8

        # The widest river that a bridge is built across, in blocks of water. Default: 32
        # Min: 2
        # Max: 48
        I:"Widest River"=48
    }

    "bridge types" {

        ##########################################################################################################
        # arched stone bridges
        #--------------------------------------------------------------------------------------------------------#
        # Arched stone bridges, of stone bricks with moss and vines, or of sandstone in deserts and red sandstone in mesas.
        ##########################################################################################################

        "arched stone bridges" {
            # The bank biomes this type is built in, by registry name, e.g. minecraft:plains. Leave it empty for every biome.
            S:"Biome Whitelist" <
             >

            # How common this type is next to the others. It scales the weight each biome gives the type, so 200 makes it twice as likely and 0 turns it off. Default: 100
            # Min: 0
            # Max: 1000
            I:Weight=100
        }

        ##########################################################################################################
        # stone bridges with railings
        #--------------------------------------------------------------------------------------------------------#
        # Stone bridges with posts and wooden railings, and a lantern hanging under the arch.
        ##########################################################################################################

        "stone bridges with railings" {
            # The bank biomes this type is built in, by registry name, e.g. minecraft:plains. Leave it empty for every biome.
            S:"Biome Whitelist" <
             >

            # How common this type is next to the others. It scales the weight each biome gives the type, so 200 makes it twice as likely and 0 turns it off. Default: 100
            # Min: 0
            # Max: 1000
            I:Weight=100
        }

        ##########################################################################################################
        # humped stone bridges
        #--------------------------------------------------------------------------------------------------------#
        # Humped stone bridges on two or three arches, of stone bricks faced with polished andesite and cobblestone, with no railing.
        ##########################################################################################################

        "humped stone bridges" {
            # The bank biomes this type is built in, by registry name, e.g. minecraft:plains. Leave it empty for every biome.
            S:"Biome Whitelist" <
             >

            # How common this type is next to the others. It scales the weight each biome gives the type, so 200 makes it twice as likely and 0 turns it off. Default: 100
            # Min: 0
            # Max: 1000
            I:Weight=100
        }

        ##########################################################################################################
        # small stone bridges
        #--------------------------------------------------------------------------------------------------------#
        # Small stone footbridges on low arches over rivers of up to 14 blocks, with low walls, buttresses and a light on each corner post.
        ##########################################################################################################

        "small stone bridges" {
            # The bank biomes this type is built in, by registry name, e.g. minecraft:plains. Leave it empty for every biome.
            S:"Biome Whitelist" <
             >

            # How common this type is next to the others. It scales the weight each biome gives the type, so 200 makes it twice as likely and 0 turns it off. Default: 100
            # Min: 0
