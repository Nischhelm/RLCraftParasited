    }

    ##########################################################################################################
    # blocks from other mods
    #--------------------------------------------------------------------------------------------------------#
    # Blocks of other mods that the bridges use when one of those mods is installed.
    ##########################################################################################################

    "blocks from other mods" {
        # The wood of the bridges in a biome, used instead of the wood of the trees there. One line per biome: <biome> = <planks>, <log>, <slab>, <stairs>, <fence>, with the properties of a block in square brackets the way /setblock takes them. Lines for mods that aren't installed are left out. For example: biomesoplenty:redwood_forest = biomesoplenty:planks_0[variant=redwood], biomesoplenty:log_2[variant=redwood], biomesoplenty:redwood_slab, biomesoplenty:redwood_stairs, biomesoplenty:redwood_fence
        S:"Biome Woods" <
            suikecherry:suike_cherry_grove = suikecherry:cherry_planks, suikecherry:cherry_log, suikecherry:cherry_slab, suikecherry:cherry_stairs, suikecherry:cherry_fence
            minecraft:beach = oe:palm_planks, oe:palm_log, oe:palm_slab, oe:palm_stairs, oe:palm_fence
         >

        # The chains that the lanterns hang from in the higher arches, by registry name. The first one that is in the game is used; without one, a lantern only hangs right under an arch.
        S:Chains <
            rustic:chain
         >

        # Hang lanterns under the arches of the stone bridges with railings, and stand them on the posts at their ends. Needs a lantern from another mod (see below), and a chain for the longer ones. Default: true
        B:"Hang Lanterns"=true

        # Logs whose wood is never used for the bridges, by registry name, e.g. the logs of a mod's rubber trees.
        S:"Ignored Logs" <
         >

        # The lanterns to hang under the arches, by registry name. The first one that is in the game is used, and none is hung without one. A lantern must hang by a property named "hanging".
        S:Lanterns <
            rustic:iron_lantern
            charm:iron_lantern
         >

        # The mossy stone brick stairs of the arched stone bridges, by registry name. The first one that is in the game is used; without one, the stairs are all plain stone brick stairs.
        S:"Mossy Stone Brick Stairs" <
            sisyphus:mossy_stone_brick_stairs
         >

        # Build the wooden parts of the bridges of the wood of the trees on the bank, from any mod whose recipes make planks, slabs, stairs and fences of it. Where there are no trees, or none like that, the biome's vanilla wood is used. Default: true
        B:"Wood of Nearby Trees"=true
    }

}


