# Configuration file

##########################################################################################################
# combat
#--------------------------------------------------------------------------------------------------------#
# Core Defender timing and guarding settings. Twenty ticks equal one second.
##########################################################################################################

combat {
    # Allow attacks while blocking. [default: true]
    B:allowAttackingWhileBlocking=true

    # Fallback duration used by built-in Defender mechanics. [range: 1 ~ 1200, default: 40]
    I:debuffDurationTicks=40

    # Flat melee damage added per Finesse level while its Defender is equipped off hand. [range: 0.0 ~ 1024.0, default: 0.5]
    S:finesseDamagePerLevel=0.5

    # Reduction added per Fortification level. [range: 0.0 ~ 1.0, default: 0.05]
    S:fortificationReductionPerLevel=0.05

    # Base reduction after the parry window. [range: 0.0 ~ 1.0, default: 0.3]
    S:guardedDamageReduction=0.3

    # Maximum guarded reduction. [range: 0.0 ~ 1.0, default: 0.95]
    S:maximumGuardedReduction=0.95

    # Movement penalty while blocking. [range: 0.0 ~ 0.95, default: 0.5]
    S:movementSpeedPenalty=0.5

    # Delay after raising a Defender before a manual parry can activate. 0 is instant. [range: 0 ~ 200, default: 0]
    I:parryActivationTicks=0

    # Parry knockback. [range: 0.0 ~ 5.0, default: 0.8]
    S:parryKnockbackStrength=0.8

    # Cooldown before another parry. [range: 0 ~ 200, default: 10]
    I:parryRecoveryTicks=10

    # How long a manual parry remains available after the activation delay, in ticks. [range: 1 ~ 200, default: 20]
    I:parryWindowTicks=20

    # Personal Vulnerable damage multiplier. [range: 1.0 ~ 20.0, default: 2.0]
    S:vulnerabilityMultiplier=2.0
}


compatibility {
    # Keep supported held attacks active while blocking and preserve continuous mining input. [default: true]
    B:allowContinuousAttacksWhileBlocking=true

    # Enable Umbrium when available.
    B:enableDefiledLands=true

    # Enable Dragonbone and Myrmex when available.
    B:enableIceAndFire=true

    # Enable Living and Sentient when available.
    B:enableSRParasites=true

    # Enable Bronze, Silver and Steel when available.
    B:enableSpartanMaterials=true
}


damage_types {
    # Enable Defender logic for everything except void. [default: false]
    B:blockAllDamage=false

    # Enable armor-bypassing sources. [default: false]
    B:blockArmorBypassing=false

    # Enable direct melee. [default: true]
    B:blockDirectMelee=true

    # Enable drowning. [default: false]
    B:blockDrowning=false

    # Enable other environmental damage. [default: false]
    B:blockEnvironmental=false

    # Enable explosions. [default: false]
    B:blockExplosions=false

    # Enable fall damage. [default: false]
    B:blockFall=false

    # Enable fire and lava. [default: false]
    B:blockFire=false

    # Enable magic. [default: false]
    B:blockMagic=false

    # Enable projectiles. [default: false]
    B:blockProjectiles=false

    # Debuff a projectile owner's living source. [default: false]
    B:retaliateAgainstIndirectAttacker=false
}


durability {
    # Guarded-hit durability cost. [range: 0 ~ 100, default: 1]
    I:guardedHitCost=1

    # Main-hand hit durability cost. [range: 0 ~ 100, default: 1]
    I:mainHandHitCost=1

    # Parry durability cost. [range: 0 ~ 100, default: 2]
    I:parryCost=2
}


enchantments {
    # Extra guarded reduction per Deflection level for melee damage. [range: 0.0 ~ 1.0, default: 0.05]
    S:deflectionMeleeReductionPerLevel=0.05

    # Guarded reduction per Deflection level for non-melee damage. [range: 0.0 ~ 1.0, default: 0.1]
    S:deflectionReductionPerLevel=0.1

    # Ticks added to the parry window per Reflexes level (4 ticks = 0.2 seconds). [range: 0 ~ 100, default: 4]
    I:reflexesWindowTicksPerLevel=4

    # Chance for 6th Sense to auto-parry a direct melee attack. [range: 0.0 ~ 1.0, default: 0.1]
    S:sixthSenseAutoParryChance=0.1

    # Glowing duration applied on a 6th Sense parry. [range: 1 ~ 72000, default: 100]
    I:sixthSenseGlowDurationTicks=100
}


evolution {
    # Fallback/override evolution threshold. [range: 1 ~ 2147483647, default: 50000]
    I:evolutionHealthOverride=50000

    # Read SRP's active HP Evolve threshold. [default: true]
    B:followSRPThreshold=true

    # True grants Living Defender evolution points only for SRP parasite kills; false allows all living creatures. [default: true]
    B:requireParasiteKills=true

    # Show Living Defender progress. [default: true]
    B:showEvolutionProgress=true
}


##########################################################################################################
# parry_effects
#--------------------------------------------------------------------------------------------------------#
# Potion effects applied to the attacker on a parry. Use registry_id,level,durationTicks. Levels are human-readable (1 means amplifier 0). Separate entries in the generated list.
##########################################################################################################

parry_effects {
    # Master switch for the configurable parry potion-effect list. [default: true]
    B:enableParryPotionEffects=true

    # Examples: minecraft:slowness,3,40 or anothermod:effect_name,1,100. Invalid or missing effects are ignored. [default: [minecraft:slowness,3,40], [defenders:vulnerable,1,40]]
    S:parryPotionEffects <
        minecraft:slowness,3,40
        defenders:vulnerable,1,40
     >
}


special_effect_values {
    # Flamed/Iced bonus against the opposed dragon. [range: 0.0 ~ 1024.0, default: 13.5]
    S:dragonOpposedElementBonus=13.5

    # Native elemental main-hand knockback strength. [range: 0.0 ~ 20.0, default: 1.0]
    S:elementalMainHandKnockback=1.0

    # Flamed Defender burn duration. [range: 0 ~ 3600, default: 5]
    I:flameDurationSeconds=5

    # Iced Defender native frozen duration. [range: 0 ~ 72000, default: 200]
    I:frozenDurationTicks=200

    # Zero-based ice debuff amplifier; 2 is level III. [range: 0 ~ 255, default: 2]
    I:iceDebuffAmplifier=2

    # Iced Defender Slowness and Mining Fatigue duration. [range: 0 ~ 72000, default: 100]
    I:iceDebuffDurationTicks=100

    # Zero-based Immalleable amplifier. [range: 0 ~ 255, default: 0]
    I:immalleableAmplifier=0

    # Electric bonus against fire and ice dragons. [range: 0.0 ~ 1024.0, default: 6.75]
    S:lightningDragonBonus=6.75

    # Immalleable and Viral duration. [range: 1 ~ 72000, default: 100]
    I:livingEffectDurationTicks=100

    # Separate native Myrmex bonus against Death Worms. [range: 0.0 ~ 1024.0, default: 4.0]
    S:myrmexDeathWormBonus=4.0

    # Flat Myrmex bonus against non-arthropods. [range: 0.0 ~ 1024.0, default: 4.0]
    S:myrmexNonArthropodBonus=4.0

    # Flat main-hand bonus against undead. [range: 0.0 ~ 1024.0, default: 2.0]
    S:silverUndeadMainHandBonus=2.0

    # Silver parry damage against undead. [range: 0.0 ~ 1024.0, default: 1.0]
    S:silverUndeadParryDamage=1.0

    # Steel parry damage against Nether mobs and elementals. [range: 0.0 ~ 1024.0, default: 2.0]
    S:steelNetherBaneParryDamage=2.0

    # Zero-based poison amplifier; 2 is Poison III. [range: 0 ~ 255, default: 2]
    I:venomAmplifier=2

    # Myrmex Stinger poison duration. [range: 1 ~ 72000, default: 200]
    I:venomDurationTicks=200

    # Zero-based Viral amplifier. [range: 0 ~ 255, default: 0]
    I:viralAmplifier=0
}


special_effects {
    # Native dragon-blood effects on hits. [default: true]
    B:elementalMainHandEffects=true

    # Native dragon-blood effects on parries. [default: true]
    B:elementalParryEffects=true

    # Immalleable and Viral parry effects. [default: true]
    B:livingSentientParryEffects=true

    # Use the native Myrmex creature bonus. [default: true]
    B:myrmexCreatureDamage=true

    # Silver adds 2 main-hand damage and deals 1 parry damage to undead. [default: true]
    B:silverUndeadDamage=true

    # Steel parries deal bonus damage to the Nether Bane targets used by RLMixins. [default: true]
    B:steelNetherBane=true

    # Myrmex Stinger hits and parries apply Poison III for ten seconds. [default: true]
    B:venomParryPoison=true
}


