# Configuration file

general {
    B:"Enable Overrides"=true

    # Fixes MC-83039, where end city towers generating on top of a house destroy its loot chests.
    # Done by generating a fixed serverresources/structures/minecraft/endcity/tower_base.nbt whenever that file doesn't exist.
    # To remove the fix, set this to false and delete that file.
    B:"Fix End City Chests"=true

    # Advancements that will not be overridden even if a file for them exists, e.g. minecraft:story/mine_stone
    S:"Ignored Advancements" <
     >

    # Functions that will not be loaded even if a file for them exists, e.g. mypack:starter_kit
    S:"Ignored Functions" <
     >

    # Loot tables that will not be overridden even if a file for them exists, e.g. minecraft:chests/simple_dungeon
    S:"Ignored Loot Tables" <
     >

    # Recipes that will not be overridden even if a file for them exists, e.g. minecraft:iron_pickaxe
    S:"Ignored Recipes" <
     >

    # Structure templates that will not be overridden even if a file for them exists, e.g. minecraft:igloo/igloo_top
    S:"Ignored Structure Templates" <
     >

    # Also removes all child advancements removed advancements.
    # Default disabled, so they will fail to load and log an error about their parent missing, should be better for debugging.
    B:"Remove Child Advancements"=false

    # Advancements that will be removed entirely, e.g. minecraft:story/mine_stone
    # Child advancements of a removed advancement will fail to load as well, unless Remove Child Advancements is enabled
    # Takes priority over a file in serverresources/advancements for the same advancement
    S:"Removed Advancements" <
     >

    # Functions that will be removed entirely, e.g. mypack:starter_kit
    # Takes priority over a file in serverresources/functions for the same function
    S:"Removed Functions" <
     >

    # Loot tables that will be replaced by an empty loot table, e.g. minecraft:chests/simple_dungeon
    # Takes priority over a file in serverresources/loot_tables for the same loot table
    S:"Removed Loot Tables" <
        lycanitesmobs:belpharm_break
        enchanter_tools:extracting_book
     >

    # Recipes that will be removed entirely, e.g. minecraft:iron_pickaxe
    # Takes priority over a file in serverresources/recipes for the same recipe
    # The same can be achieved using CraftTweaker.
    S:"Removed Recipes" <
     >
}


