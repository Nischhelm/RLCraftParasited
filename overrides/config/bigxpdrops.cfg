# Configuration file

general {

    ##########################################################################################################
    # client options
    #--------------------------------------------------------------------------------------------------------#
    # Client-Side Options
    ##########################################################################################################

    "client options" {
        # This value determines the value when an XP orb will render 2x bigger.
        # For Example: 2.0 means an XP orb with 2.0x the value of the largest vanilla will visually be 2x.
        # 	4.0 means 4x the value to be 2x the visual size.
        D:"XP Double Render Scale Point"=2.0

        # This value determines the maximum size scale of an XP orb
        D:"XP Max Render Scale"=16.0
    }

    ##########################################################################################################
    # server options
    #--------------------------------------------------------------------------------------------------------#
    # Server-Side Options
    ##########################################################################################################

    "server options" {
        # This value determines when biggest possible xp orb will drop, if the total xp value is this or higher, drop a single orb.
        # Vanilla has each split step be a prime number that is about 2x more than the previous step.
        # The largest vanilla orb has a value of 2477
        # Setting a value lower than a vanilla step will override the limit and drop a big xp orb
        I:"Big XP Drop Threshold"=19853
    }

}


