# Configuration file

general {

    ##########################################################################################################
    # general
    #--------------------------------------------------------------------------------------------------------#
    # Master switch, and where the portal effect and outline are shown. Styles are applied with /cosmifyportal and /cosmifyoutline (see Commands for who may use them).
    ##########################################################################################################

    general {
        # Show the portal effect and outline on worn styled armor.
        B:"Cosmic Armor"=true

        # Show the portal effect and outline on styled items (inventory, hand, dropped, item frames).
        B:"Cosmic Items"=true

        # Show the portal effect and outline on styled mobs.
        B:"Cosmic Mobs"=true

        # Master switch for everything this mod draws.
        B:"Enable Cosmic Rendering"=true

        # For FPS: things further away than this many blocks are drawn with fewer star layers and outline steps, down to a quarter at four times this distance. Far away the difference is hard to see. 0 = always full detail.
        # Min: 0.0
        # Max: 256.0
        D:"Full Detail Distance"=12.0

        # Villagers named Sussyberian or Mentalberian get a red outline.
        B:"Outline Sussyberian And Mentalberian Villagers"=true
    }

    ##########################################################################################################
    # armor wear
    #--------------------------------------------------------------------------------------------------------#
    # Armor wear: worn armor gets holes the more damaged it is. Client side, works on any server.
    ##########################################################################################################

    "armor wear" {
        # Worn armor shows holes when it is damaged.
        B:"01 Show holes in damaged armor"=true

        # How damaged the armor has to be before the first pixels go missing. 0.0 = right away, 0.25 = after a quarter of its durability is used up. Bits only break off after this point too.
        # Min: 0.0
        # Max: 0.99
        D:"02 Damage needed before holes start"=0.1

        # Share of the armor's pixels that is gone when it is about to break. 0.6 = 60 percent missing.
        # Min: 0.0
        # Max: 1.0
        D:"03 Share of armor missing when nearly broken"=0.6

        # How many stages the wear has between Start At and broken. More = smoother, but each stage of each armor texture is one more texture in memory.
        # Min: 1
        # Max: 32
        I:"04 Number of wear stages"=10

        # Size of the missing chunks, in armor texture pixels.
        # Min: 1
        # Max: 16
        I:"05 Hole size in pixels"=3

        # 1.0 = only whole chunks go missing, 0.0 = only scattered single pixels, in between = chunks with ragged edges and some loose pixels.
        # Min: 0.0
        # Max: 1.0
        D:"06 Hole shape - chunks or scattered pixels"=0.7

        # If true, every kind of armor piece gets its own wear pattern, picked from its maximum durability and item id. If false, all armor wears in the same places.
        B:"07 Different hole pattern per armor type"=true

        # Darken the pixels around each hole a little, so the holes look chipped.
        B:"08 Darken edges of holes"=true

        # Remove scraps that the holes have cut loose from the rest of the armor, so no single pixels are left floating.
        B:"09 Remove loose scraps"=true

        # A loose scrap smaller than this many texture pixels is removed. Higher = cleaner, bigger scraps disappear too.
        # Min: 1
        # Max: 256
        I:"10 Loose scrap size limit in pixels"=6

        # The left arm and leg get holes in other places than the right ones. Off: both sides are mirror images, as the armor texture is.
        B:"11 Left and right side wear differently"=true
    }

    ##########################################################################################################
    # armor bits
    #--------------------------------------------------------------------------------------------------------#
    # Armor bits: chunks that break off worn armor when it is hit, and come back out of the ground when it is repaired. Client side, works on any server.
    ##########################################################################################################

    "armor bits" {
        # Bits break off worn armor when its holes grow. When a piece breaks completely, what was left of it falls apart into big chunks.
        B:"1 Bits fly off damaged armor"=true

        # When worn armor is repaired (mending, for example), bits rise out of the ground around the wearer and fly into them.
        B:"2 Bits fly back on repair"=true

        # How many pixels fly off. 1.0 = one to one with the armor: every pixel that disappears from it flies off when its hole opens (and flies back when it is repaired). 2.0 = twice as many, 0.5 = half.
        # Min: 0.0
        # Max: 20.0
        D:"3 Amount of bits - 1.0 is realistic"=1.0

        # Amount for your own armor while you are in first person, as a share of the amount above. 0.4 = 40 percent, 1.0 = no reduction, 0.0 = none. Other players, mobs and third person are not affected.
        # Min: 0.0
        # Max: 1.0
        D:"4 Amount of bits in first person"=0.4

        # How chunky the bits are. 0.0 = single pixels only. 0.5 = mostly single pixels, with big chunks on very strong hits and big repairs. 1.0 = big chunks all the time. This does not change how many pixels come off, only whether they come as crumbs or as chunks.
        # Min: 0.0
        # Max: 1.0
        D:"5 Big chunks - 0 none to 1 lots"=0.5

        # Size of one pixel of a bit, in blocks (each bit varies a little). 0.0625 is one pixel of a block.
        # Min: 0.01
        # Max: 0.5
        D:"6 Bit size in blocks"=0.06

        # How long a bit lies on the ground before it sinks in and fades, in seconds (each one varies a little).
        # Min: 0.0
        # Max: 120.0
        D:"7 Seconds bits stay on the ground"=4.0

        # Bits look like the armor they came from: its portal effect, its outline and its enchantment shimmer. Turn off if styled or enchanted armor breaking costs FPS.
        B:"8 Bits copy the armor's effects"=true

        # The most bits that exist at once. When there are more, the oldest disappear. Only the newest fifth of this number get the armor's effects. Lower it if fights cost FPS.
        # Min: 10
        # Max: 5000
        I:"9 Performance limit - most bits at once"=1000

        # Hide the game's own item-break particles for armor, so only this mod's chunks show when a piece breaks. The break sound stays.
        B:"Hide vanilla armor break particles"=true
    }

    ##########################################################################################################
    # armor bits - orbit
    #--------------------------------------------------------------------------------------------------------#
    # Armor bits that come back on repair: they circle around the wearer for a while before flying in. Client side, works on any server.
    ##########################################################################################################

    "armor bits - orbit" {
        # Bits that come back on repair circle around the wearer before they fly in. Off: they fly straight in, like before.
        B:"1 Bits circle the wearer"=false

        # How long a bit circles the wearer, in seconds.
        # Min: 0.0
        # Max: 30.0
        D:"2 Seconds circling"=0.3

        # How much the circling time differs from bit to bit. 0.0 = all exactly the time above, 0.5 = anywhere from half to one and a half times it, 1.0 = anywhere from no circling to twice as long.
        # Min: 0.0
        # Max: 1.0
        D:"3 Circling time randomness"=0.2

        # How far from the wearer's side the bits circle, in blocks (each bit varies a little).
        # Min: 0.0
        # Max: 4.0
        D:"4 Circle distance in blocks"=0.6

        # How fast the bits go around, in full turns per second (each bit varies a little, and they go both ways).
        # Min: 0.0
        # Max: 5.0
        D:"5 Turns per second"=5.0

        # If true, a returning bit disappears the moment it touches the wearer, whether it is still circling or flying in. If false, bits pass through the wearer while circling and only disappear once they reach their spot on the body.
        B:"6 Disappear on touching the wearer"=true
    }

    ##########################################################################################################
    # survival
    #--------------------------------------------------------------------------------------------------------#
    # Survival styling: End portals, End gateways and dyes. Read on the server.
    ##########################################################################################################

    survival {
        # An item or mob (not a player) that falls into an End portal gets the portal effect, or loses it if it has it. An item thrown into an End gateway gets the outline, or loses it. Both are thrown back out instead of being teleported. Right-clicking with a styled item in the main hand and a dye in the off hand colors its portal effect and outline (uses up one dye).
        B:"End Portal, Gateway And Dye Styling"=true
    }

    ##########################################################################################################
    # commands
    #--------------------------------------------------------------------------------------------------------#
    # The /cosmifyportal, /cosmifyoutline and /cosmifycopy commands: who may use them. Read on the server.
    ##########################################################################################################

    commands {
        # How far away (in blocks) the commands look for the nearest mob when used with "mob".
        # Min: 1.0
        # Max: 64.0
        D:"Mob Range"=8.0

        # Permission level needed for /cosmifyportal, /cosmifyoutline and /cosmifycopy. 0 = everyone, 2 = operators (cheats on in single player), 4 = server owner.
        # Min: 0
        # Max: 4
        I:"Permission Level"=2
    }

}


