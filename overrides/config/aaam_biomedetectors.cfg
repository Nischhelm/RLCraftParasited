# Configuration file

general {
    # Only used if "Rule-based Biome Detection" is enabled in the main AAAM config.
    # These are named rulesets that decide which tile a chunk gets on the atlas.
    # Every column (x/z) of a chunk is checked against every rule. A matching rule adds its weight to the bucket of its result.
    # The bucket with the highest sum wins, ties go to the bucket of the rule that's farther up.
    # 
    # Rule fields:
    #   name: count type in BiomeDetectorEvent. Rules with the same name share their count (giving an OR connection)
    #   weight: added to the result bucket per matching block column
    #   result: "biome" for the biome of the column, a biome id like "minecraft:river", or a pseudo tile name like lava, ravine, endIsland, endIslandPlants, endVoid, CAVE_WALLS
    #   group: if not empty, only the first matching rule of that group counts per column
    #   conditions: all have to match. Keep empty to always match.
    # 
    # Condition fields:
    #   type: BIOME (biome ids), BIOME_TYPE (biome dictionary types), BLOCK (block ids), BELOW_GROUND (top is more than yRelative blocks below the average ground level of the world)
    #         or a type added with CraftTweaker via mods.antiqueatlasautomarker.BiomeDetectors.addCondition
    #   negate: inverts the condition
    #   values: matches if any value matches. Ids of mods that aren't loaded are ignored, rules that can't match without them too
    #   yLookupType: BLOCK only. ABSOLUTE: yRelative is the height. TOP: yRelative is an offset to the height map top, which is the lowest block above all light blocking blocks
    #         (yRelative=-1 is the top solid block or water, 0 is above it, which is where lava, plants and air are)
    #   yRelative: see yLookupType and BELOW_GROUND
    Detectors {
        C:overworld <
            {
                S:name=biome

                I:weight=4

                S:result=biome

                S:group=priority

                C:conditions <
                    {
                        S:type=BIOME_TYPE

                        B:negate=false

                        S:values <
                            WATER
                        >

                        S:yLookupType=TOP

                        I:yRelative=0
                    }
                >
            }
            {
                S:name=biome

                I:weight=3

                S:result=biome

                S:group=priority

                C:conditions <
                    {
                        S:type=BIOME_TYPE

                        B:negate=false

                        S:values <
                            BEACH
                        >

                        S:yLookupType=TOP

                        I:yRelative=0
                    }
                >
            }
            {
                S:name=biome

                I:weight=1

                S:result=biome

                S:group=priority

                C:conditions <
                >
            }
            {
                S:name=water

                I:weight=2

                S:result=minecraft:river

                S:group=surface

                C:conditions <
                    {
                        S:type=BLOCK

                        B:negate=false

                        S:values <
                            minecraft:water
                        >

                        S:yLookupType=TOP

                        I:yRelative=-1
                    }
                    {
                        S:type=BIOME_TYPE

                        B:negate=true

                        S:values <
                            SWAMP
                        >

                        S:yLookupType=TOP

                        I:yRelative=0
                    }
                >
            }
            {
                S:name=water

                I:weight=3

                S:result=minecraft:river

                S:group=surface

                C:conditions <
                    {
                        S:type=BLOCK

                        B:negate=false

                        S:values <
                            minecraft:water
                        >

                        S:yLookupType=TOP

                        I:yRelative=-1
                    }
                    {
                        S:type=BIOME_TYPE

                        B:negate=true

                        S:values <
                            SWAMP
                        >

                        S:yLookupType=TOP

                        I:yRelative=0
                    }
                >
            }
            {
                S:name=ravine

                I:weight=12

                S:result=ravine

                S:group=ravine

                C:conditions <
                    {
                        S:type=BELOW_GROUND

                        B:negate=false

                        S:values <
                        >

                        S:yLookupType=TOP

                        I:yRelative=7
                    }
                >
            }
            {
                S:name=lava

                I:weight=6

                S:result=lava

                S:group=surface

                C:conditions <
                    {
                        S:type=BLOCK

                        B:negate=false

                        S:values <
                            minecraft:lava
                        >

                        S:yLookupType=TOP

                        I:yRelative=0
                    }
                >
            }
        >
        C:nether <
            {
                S:name=lava

                I:weight=4

                S:result=lava

                S:group=

                C:conditions <
                    {
                        S:type=BLOCK

                        B:negate=false

                        S:values <
                            minecraft:lava
                        >

                        S:yLookupType=ABSOLUTE

                        I:yRelative=31
                    }
                >
            }
            {
                S:name=wall

                I:weight=4

                S:result=CAVE_WALLS

                S:group=

                C:conditions <
                    {
                        S:type=BLOCK

                        B:negate=true

                        S:values <
                            minecraft:air
                        >

                        S:yLookupType=ABSOLUTE

                        I:yRelative=50
                    }
                >
            }
            {
                S:name=biome

                I:weight=3

                S:result=biome

                S:group=

                C:conditions <
                >
            }
        >
        C:end <
            {
                S:name=biome

                I:weight=1

                S:result=biome

                S:group=

                C:conditions <
                    {
                        S:type=BIOME

                        B:negate=true

                        S:values <
                            minecraft:sky
                        >

                        S:yLookupType=TOP

                        I:yRelative=0
                    }
                >
            }
            {
                S:name=chorus

                I:weight=257

                S:result=endIslandPlants

                S:group=

                C:conditions <
                    {
                        S:type=BIOME

                        B:negate=false

                        S:values <
                            minecraft:sky
                        >

                        S:yLookupType=TOP

                        I:yRelative=0
                    }
                    {
                        S:type=BLOCK

                        B:negate=false

                        S:values <
                            minecraft:chorus_flower
                            minecraft:chorus_plant
                        >

                        S:yLookupType=TOP

                        I:yRelative=0
                    }
                >
            }
            {
                S:name=endstone

                I:weight=1

                S:result=endIsland

                S:group=

                C:conditions <
                    {
                        S:type=BIOME

                        B:negate=false

                        S:values <
                            minecraft:sky
                        >

                        S:yLookupType=TOP

                        I:yRelative=0
                    }
                >
            }
            {
                S:name=void

                I:weight=2

                S:result=BE_ICE_STARFIELD_VOID

                S:group=void

                C:conditions <
                    {
                        S:type=BLOCK

                        B:negate=false

                        S:values <
                            minecraft:air
                        >

                        S:yLookupType=TOP

                        I:yRelative=-1
                    }
                    {
                        S:type=BIOME

                        B:negate=false

                        S:values <
                            betterendforge:ice_starfield
                        >

                        S:yLookupType=TOP

                        I:yRelative=0
                    }
                >
            }
            {
                S:name=void

                I:weight=2

                S:result=endVoid

                S:group=void

                C:conditions <
                    {
                        S:type=BLOCK

                        B:negate=false

                        S:values <
                            minecraft:air
                        >

                        S:yLookupType=TOP

                        I:yRelative=-1
                    }
                >
            }
        >
    }

    # Which detector is used in which dimension id
    "Dimension Detectors" {
        S:0=overworld
        S:-1=nether
        S:1=end
    }

    # Detector used in dimensions not listed in Dimension Detectors. Leave empty to use Antique Atlas detection there.
    S:"Default Detector"=overworld
}


