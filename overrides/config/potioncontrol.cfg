# Configuration file

~CONFIG_VERSION(general): 1.0

general {
    # If you're a modpack dev just starting to set up this mod, you probably want to start here.
    "first setup" {
        # !Disables itself after a one time use!
        # 
        # If enabled, during startup this mod will infer info about all registered potions and print them out in /config/potioncontrol/potions/inferred-inactive/.
        # The created json files can be used as blueprints from which to work off of.
        # To do so, copy everything to /config/potioncontrol/potions/active/, then delete every file + line in file that should stay default/untouched.
        # WARNING: All files in /inferred-inactive/ will be overwritten every time you start the game with this option enabled
        # Default: true
        B:"Print Inferred Potion Infos"=false

        # !Disables itself after a one time use!
        # 
        # If enabled, during startup this mod will infer info about all registered potion types and print them out in /config/potioncontrol/potiontypes/inferred-inactive/.
        # The created json files can be used as blueprints from which to work off of.
        # To do so, copy everything to /config/potioncontrol/potiontypes/active/, then delete every file + line in file that should stay default/untouched.
        # WARNING: All files in /inferred-inactive/ will be overwritten every time you start the game with this option enabled
        # Note: brewing recipes will only be inferred if "Mixin Toggles.Modify Brewing Recipes (Vanilla)" is enabled.
        # Default: true
        B:"Print Inferred Potion Type Infos"=false

        # Advanced
        # When inferring cfg jsons from existing potions+potiontypes, enabling this will print all available options into the jsons, even if they cant be inferred.
        # Every property not present in a json will keep the object unmodified for this property, so reduction is advised.
        # Default: false
        B:"Print Inferred Expanded"=false

        # Which time scale to use for durations in inferred potion type infos (MIN as float)
        # Default: MIN
        # Valid values:
        # TICK
        # SEC
        # MIN
        S:"Duration Time Scale"=MIN

        # Which brewing direction should be printed into inferred potion types.
        #  FROM: writes which other potiontypes + reagents can create this potion type
        #  TO: writes which other potiontypes this one can be brewed to, using which reagents
        # Default: FROM
        # Valid values:
        # FROM
        # TO
        # BOTH
        # NONE
        S:"Brewing Recipe Direction"=FROM

        # Whether to follow vanillas weird convention of using amplifiers (=lvl-1) instead of levels in inferred potion type infos
        # Default: false
        B:"Levels as Amplifiers"=false

        # Property jsons for potions found in /config/potioncontrol/potions/active/... that are unknown in game will be created and filled with the given properties.
        # Default: false
        B:"Should create unknown Potions"=false

        # Property jsons for potion types found in /config/potioncontrol/potiontypes/active/... that are unknown in game will be created and filled with the given properties.
        # Default: true
        B:"Should create unknown Potion Types"=false
    }

    # Option to blacklist potions and potion types entirely
    blacklists {
        # Potions in this list will be prevented from being registered in the game. There will be no way to access them at all.
        # If "Potions disable their types" is enabled, this will also unregister all connected potiontypes that only have this potion as an effect.
        # Default: []
        S:"Registered Potion Blacklist" <
            elenaidodge:can_dodge
            elenaidodge:nimble
            elenaidodge:climber
            rustic:full
            rustic:magic_resistance
            rustic:wither_ward
            potioncore:love
            potioncore:extension
            potioncore:teleport_spawn
            potioncore:invert
            potioncore:revival
            potioncore:chance
            potioncore:purity
            potioncore:antidote
            quark:resilience
            quark:black
            quark:blue
            quark:white
            mujmajnkraftsbettersurvival:cure
            mujmajnkraftsbettersurvival:dispel
            lycanitesmobs:envenom
            lycanitesmobs:staticaura
            lycanitesmobs:freezeaura
            lycanitesmobs:heataura
            lycanitesmobs:rage
            lycanitesmobs:recklessness
            betterendforge:end_veil
            eaglemixins:radiation_sickness
            eaglemixins:radiation_fatigue
            eaglemixins:radiation_weakness
            eaglemixins:teleportation_sickness
        >

        # Potion Types in this list will be prevented from being registered in the game. There will be no way to access them at all.
        # Default: []
        S:"Registered Potion Types Blacklist" <
            potioncore:bless
            potioncore:strong_bless
            potioncore:curse
            potioncore:strong_curse
            potioncore:long_flight
            potioncore:saturation
            potioncore:strong_saturation
            potioncore:wither
            potioncore:long_wither
            potioncore:strong_wither
            potioncore:hunger
            potioncore:strong_hunger
            potioncore:blindness
            potioncore:long_blindness
            potioncore:strong_blindness
            potioncore:nausea
            potioncore:long_nausea
            potioncore:long_levitation
            potioncore:absorption
            potioncore:long_absorption
            potioncore:strong_absorption
            potioncore:glowing
            potioncore:long_glowing
            potioncore:resistance
            potioncore:long_resistance
            potioncore:strong_resistance
            potioncore:unluck
            potioncore:broken_magic_shield
            potioncore:long_broken_magic_shield
            potioncore:strong_broken_magic_shield
            potioncore:drown
            potioncore:long_drown
            potioncore:long_climb
            oe:turtle_master
            oe:turtle_master_long
            oe:turtle_master_strong
        >

        # Most potion types are directly tied to a specific potion, as they only give that potion as an effect
        # Example: long_fire_resistance gives the effect of type fire_resistance, and no other effects
        # This toggle makes it so unregistering potions will automatically also unregister all potion types that only map to this potion
        # Disabling this toggle will force you to manually blacklist all connected types for each potion you unregister.
        # Default: true
        B:"Potions disable their types"=true
    }

    # Various toggleable options
    "mixin toggles" {
        # Allows to modify whether potions will prioritise high amplifiers (default) or high durations when combining two of the same potions effects
        # Use key "prioritisesDuration": true in the jsons to set longer effects of this potion to be prefered over stronger effects.
        # Default: true
        B:"Allow Prioritise Duration (Vanilla)"=false

        # Allows to modify which potions or potion types get registered via "Registered Potion/Type Blacklist" configs
        # Default: true
        B:"Allow Unregister Potions (Vanilla)"=true

        # Due to an oversight instead of planned 255 the real max potion amplifier is 127.
        # Higher amplifiers are possible, but will be saved and recognised on clientside as negative values.
        # This fixes it by allowing amplifiers a range between -32768 and +32767
        # Default: true
        B:"Fix Amplifier Cap (Vanilla)"=true

        # Writes only the actually missing descriptions in log instead of all of them if its "Log missing descriptions" config is enabled
        # Also allows to use linebreaks using \n
        # Default: true
        B:"Fix Missing Desc Log (PotionDescriptions)"=true

        # Displays Potion Levels outside of the range 1-3 in inventory (1-10 as roman numerals)
        # Default: true
        B:"Fix Potion Level Display (Vanilla)"=true

        # Displays Potion Levels between 1 and 10 as roman numerals, the rest as numbers
        # Default: true
        B:"Fix Potion Potency Tooltips (Vanilla)"=true

        # Instant potion effects from drinking, splash and lingering potions skip Forge's PotionApplicableEvent.
        # This fires the event for them too, so anything that blocks an effect through that event
        # (potion immunities, entity blacklists, ...) also blocks its instant application.
        # Default: true
        B:"Instant Potions Fire Applicable Event (Vanilla)"=true

        # Allows to modify which effects are available on each of the levels (1-4) of the beacon.
        # Modify by using key "beaconLevels":[] in the jsons
        # Note: more than 3 entries per level starts looking weird
        # Default: true
        B:"Modify Beacon Effects (Vanilla)"=false

        # Allows to modify brew times of brewing recipes either globally via config or by recipe via potion type jsons.
        # Requires "Modify Brewing Recipes"
        # Default: true
        B:"Modify Brew Time (Vanilla)"=false

        # Allows to modify brewing recipes via potion type jsons
        # If enabled, potion types that have the brews_from or brews_to set will have vanilla-style recipes in that direction replaced by the given ones
        # Modded recipes are left untouched, only the ones added by the PotionHelper.addMix / CT IPotionRecipe.add method are modified
        # Added recipes can also be modded with the input or the output item being any itemstack (including metadata, tags and potion type)
        # Use "to"/"from": {"item", "meta", "tag", "type"}
        # Recipes with a non bottle item in input will apply the output type on the input item as output
        # Recipes with a non bottle item in output will add recipes for all 3 bottle shapes to turn into the given output
        # Default: true
        B:"Modify Brewing Recipes (Vanilla)"=false

        # Allows to set a maximum for specific potions level or duration via their jsons. Use keys "maxLevel" and "maxDuration"
        # Default: true
        B:"Modify Max Potion Duration & Level (Vanilla)"=true

        # Allows to modify tipped arrow potion durations (in ticks) via potion type jsons (key: tipped_arrow_duration)
        # Default: true
        B:"Modify Tipped Arrow Time (Vanilla)"=false

        # Makes potion effects properly display their levels above 4 and below 1 in Dynamic Surroundings HUDs potion effect overlay
        # Default: true
        B:"Potion Level Display (DSHuds)"=true

        # Adds the emerald item to denote ILLAGER type mobs just like rotten flesh and spider eyes denote UNDEAD and ARTHROPOD.
        # Default: true
        B:"Render Illager Emerald (Neat)"=true

        # Renders the current potion effects of the targeted mob in the Neat overlay
        # Default: true
        B:"Render Potion Effects (Neat)"=true

        # Distance in which not just the potion effects of players are synced to client but the effects all entities.
        # Set to -1 to disable the mixin
        # Probably incompatible with JEID i didnt check yet
        # Min: -1 Max: 2147483647 Default: 32
        I:"Sync Entity Potions Distance (Vanilla)"=32
    }

    # Brewing Stand Options
    "brewing stand" {
        # Multiply the brewing duration of all brewing actions in the vanilla brewing stand by this amount.
        # Smaller than 1: Brews faster
        # Bigger than 1: Brews slower
        # Min: 0.0 Max: 1.7976931348623157E308 Default: 1.0
        D:"Global Brew Time Multiplier"=1.0
    }

    # Modify hardcoded values of vanilla potion effects, like how much Instant Health heals
    "vanilla potion values" {
        # Modify how much Instant Health heals
        "instant health" {
            # Enables the options in this category
            # Default: false
            B:"Modify Instant Health"=true

            # Health healed by level I Instant Health. Splash and lingering potions multiply this by how close the target was.
            # Also used for undead mobs hit by Instant Damage, since they get healed by it.
            # Min: 0.0 Max: 1.7976931348623157E308 Default: 4.0
            D:"Heal Amount"=6.0

            # true: Heal Amount doubles every level (vanilla: 4, 8, 16, ...)
            # false: Heal Amount is multiplied by the level (4, 8, 12, ...)
            # Default: true
            B:"Exponential Scaling"=true
        }

        # Modify how much damage Instant Damage deals
        "instant damage" {
            # Enables the options in this category
            # Default: false
            B:"Modify Instant Damage"=false

            # Damage dealt by level I Instant Damage. Splash and lingering potions multiply this by how close the target was.
            # Also used for undead mobs hit by Instant Health, since they get damaged by it.
            # Min: 0.0 Max: 1.7976931348623157E308 Default: 6.0
            D:"Damage Amount"=6.0

            # true: Damage Amount doubles every level (vanilla: 6, 12, 24, ...)
            # false: Damage Amount is multiplied by the level (6, 12, 18, ...)
            # Default: true
            B:"Exponential Scaling"=true
        }

        # Modify how much Regeneration heals per heal tick
        regeneration {
            # Enables the options in this category
            # Note: How often Regeneration heals can be changed via potion jsons (repeatingPeriod, periodAmpModifier)
            # Default: false
            B:"Modify Regeneration"=false

            # Health healed every time Regeneration heals
            # Min: 0.0 Max: 1.7976931348623157E308 Default: 1.0
            D:"Heal Amount"=1.0
        }

        # Modify how much damage Poison deals per damage tick
        poison {
            # Enables the options in this category
            # Note: How often Poison deals damage can be changed via potion jsons (repeatingPeriod, periodAmpModifier)
            # Default: false
            B:"Modify Poison"=false

            # Damage dealt every time Poison deals damage
            # Min: 0.0 Max: 1.7976931348623157E308 Default: 1.0
            D:"Damage Amount"=1.0

            # Poison will only deal damage while the entity has more health than this. Set to 0 to let poison kill.
            # Min: 0.0 Max: 1.7976931348623157E308 Default: 1.0
            D:"Minimum Health"=1.0
        }

        # Modify how much damage Wither deals per damage tick
        wither {
            # Enables the options in this category
            # Note: How often Wither deals damage can be changed via potion jsons (repeatingPeriod, periodAmpModifier)
            # Default: false
            B:"Modify Wither"=false

            # Damage dealt every time Wither deals damage
            # Min: 0.0 Max: 1.7976931348623157E308 Default: 1.0
            D:"Damage Amount"=1.0
        }

        # Modify how much exhaustion Hunger adds
        hunger {
            # Enables the options in this category
            # Default: false
            B:"Modify Hunger"=false

            # Exhaustion added every tick per level of Hunger. Every 4 exhaustion removes one saturation or food point.
            # Min: 0.0 Max: 1.7976931348623157E308 Default: 0.005
            D:"Exhaustion per Level"=0.005
        }

        # Modify how much food and saturation the Saturation effect restores
        saturation {
            # Enables the options in this category
            # Default: false
            B:"Modify Saturation"=false

            # Food points restored every tick per level of Saturation
            # Min: 0 Max: 2147483647 Default: 1
            I:"Food per Level"=1

            # Saturation modifier of the restored food. Saturation gained = food * modifier * 2
            # Min: 0.0 Max: 1.7976931348623157E308 Default: 1.0
            D:"Saturation Modifier"=1.0
        }

        # Modify how much absorption the Absorption effect grants
        absorption {
            # Enables the options in this category
            # Default: false
            B:"Modify Absorption"=false

            # Absorption health granted per level of Absorption
            # Changing this while entities have Absorption active can leave them with too much or too little absorption when it runs out.
            # Min: 0 Max: 2147483647 Default: 4
            I:"Absorption per Level"=4
        }

        # Modify how much damage Resistance blocks
        resistance {
            # Enables the options in this category
            # Note: With PotionCore, its armor bar overlay still displays 20% per level.
            # Note: With PotionCore + RLTweaker ("patchPotionCoreResistance", enabled by default), this does nothing.
            #   RLTweaker replaces the vanilla resistance calculation, use its "Resistance Potion Modifier Amount" or the potioncore.damageResistance attributeModifier in the potion jsons instead.
            # Note: With FirstAid, damage to players uses FirstAid's own resistance calculation, see "Modify Resistance (FirstAid)".
            # Default: false
            B:"Modify Resistance"=false

            # Percent of incoming damage blocked per level of Resistance. 100% or more makes entities immune to most damage.
            # Min: 0 Max: 100 Default: 20
            I:"Damage Reduction per Level"=15

            # FirstAid calculates resistance for damage to players itself ("resistanceReductionPercentPerLevel").
            # If this and "Modify Resistance" are enabled, FirstAid will use Damage Reduction per Level instead.
            # Default: true
            B:"Modify Resistance (FirstAid)"=true
        }

        # Modify how high Jump Boost lets entities jump and how much fall damage it prevents
        "jump boost" {
            # Enables the options in this category
            # Note: Player movement is calculated clientside, so the client needs the same values as the server.
            # Note: With PotionCore's "Controllable Jump Boost" (enabled by default), Jump Motion per Level does nothing.
            #   PotionCore overrides the jump motion, use its "Vanilla Jump Boost Height" or the potioncore.jumpHeight attributeModifier in the potion jsons instead.
            #   PotionCore also reduces fall distance by its jump height attribute, Safe Fall Distance per Level is applied on top of that.
            # Default: false
            B:"Modify Jump Boost"=false

            # Upwards motion added to jumps per level of Jump Boost (also for horses). For reference, a normal jump has 0.42
            # Min: 0.0 Max: 1.7976931348623157E308 Default: 0.1
            D:"Jump Motion per Level"=0.1

            # Blocks of fall distance that don't cause fall damage per level of Jump Boost
            # Min: 0.0 Max: 1.7976931348623157E308 Default: 1.0
            D:"Safe Fall Distance per Level"=1.0
        }

        # Modify how fast Levitation lifts entities
        levitation {
            # Enables the options in this category
            # Note: Player movement is calculated clientside, so the client needs the same values as the server.
            # Default: false
            B:"Modify Levitation"=false

            # Upwards speed per level of Levitation, in blocks per tick. Negative values make entities sink instead.
            # Default: 0.05
            D:"Speed per Level"=0.05
        }

        # Modify how much Haste speeds up mining and arm swings
        haste {
            # Enables the options in this category
            # Note: Mining speed is also calculated clientside, so the client needs the same values as the server.
            # Note: The attack speed bonus of Haste can be changed via potion jsons (attributeModifiers)
            # Default: false
            B:"Modify Haste"=false

            # Mining speed bonus per level of Haste. 0.2 = +20% per level
            # Min: 0.0 Max: 1.7976931348623157E308 Default: 0.2
            D:"Mining Speed per Level"=0.2

            # Ticks an arm swing gets shorter per level of Haste. Normal arm swings take 6 ticks.
            # Min: 0 Max: 2147483647 Default: 1
            I:"Swing Duration Reduction per Level"=1

            # Haste can't make arm swings shorter than this many ticks
            # Set to 0 to disable the minimum (vanilla). Swings with a duration of 0 or below end after 1 tick.
            # Min: 0 Max: 2147483647 Default: 2
            I:"Minimum Swing Duration"=2
        }

        # Modify how much Mining Fatigue slows down mining and arm swings
        "mining fatigue" {
            # Enables the options in this category
            # By default this fixes MC-279819: Vanilla uses 0.3, 0.09, 0.0027 and 0.00081 as mining speed multipliers,
            #   so from level III on mining is 10x slower than the intended 0.3 per level.
            #   To keep elder guardians about as strong as before, they give Mining Fatigue V instead of III by default.
            # Note: Mining speed is also calculated clientside, so the client needs the same values as the server.
            # Note: The attack speed malus of Mining Fatigue can be changed via potion jsons (attributeModifiers)
            # Default: false
            B:"Modify Mining Fatigue"=false

            # Mining speed multiplier for each level of Mining Fatigue, starting at level I.
            # Levels above the amount of entries use the last entry.
            # Default is 0.3^level. Vanilla is 0.3, 0.09, 0.0027, 8.1E-4, so one more zero than 0.3^level from lvl 3 on (MC-279819).
            # Default: [0.3, 0.09, 0.027, 0.0081, 0.00243]
            D:"Mining Speed Multipliers" <
                0.3
                0.09
                0.027
                0.0081
                0.00243
            >

            # Ticks an arm swing gets longer per level of Mining Fatigue. Normal arm swings take 6 ticks.
            # Min: 0 Max: 2147483647 Default: 2
            I:"Swing Duration Increase per Level"=2

            # Level of Mining Fatigue elder guardians give players nearby. Vanilla: 3
            # Default 5 (0.00243 with default multipliers) is about as strong as vanilla level III (0.0027)
            # Min: 1 Max: 2147483647 Default: 5
            I:"Elder Guardian Mining Fatigue Level"=5
        }
    }

    # Debug Options
    debug {
        # Disable this to remove PotionControls main feature which hooks into all registered potions code to modify how they behave. 
        # Some features will still work. This is mainly meant for testing if this mods ASM modification of potion classes is responsible for a crash
        # Default: true
        B:"(ASM & Mixin Toggle) Enable Potion Injection"=true

        # Potion classes that should not be modified at all by this mod. 
        # Use this if there are crashes when this mod tries to automatically modify some mods enchantments. 
        # You can find the class name in config/potioncontrol/tmp/enchclasses.dump
        # Class names noted here need to look like net.minecraft.potion.PotionAttackDamage
        # Vanilla enchants will always be targeted, so putting their classes in here won't do anything
        # Default: []
        S:"Blacklisted Potion Classes" <
        >

        # If enabled, writes all currently loaded potion and potion type infos to /config/potioncontrol/potion[type]s/loaded/ during startup. Can be used to check if a given config json is actually loaded (and loaded correctly).
        # Default: false
        B:"Print Loaded Potion+Type Infos"=false

        # If enabled, will log sent and avoided additional potion effect packet count for "Sync Entity Potions".
        # Default: false
        B:"Sync Potions Debug Mode"=false
    }
}


