# Configuration file

general {
    # Chance in % of XP orb spawning after harvest done
    # Min: 1
    # Max: 100
    I:Chance=100

    # List of crops to process with their ages. An entry that names only the block, without [...], matches every state of it
    S:"Crops List" <
        minecraft:potatoes[age=7]
        minecraft:carrots[age=7]
        minecraft:wheat[age=7]
        minecraft:beetroots[age=3]
        minecraft:nether_wart[age=3]
        betternether:bone_mushroom[age=2,facing=up]
        betternether:bone_mushroom[age=2,facing=east]
        betternether:bone_mushroom[age=2,facing=west]
        betternether:bone_mushroom[age=2,facing=north]
        betternether:bone_mushroom[age=2,facing=south]
     >

    # Curiosity Mode: sneak + right click on block to get info in chat
    B:Curiosity=false

    # List of blocks that are gathered from rather than harvested, with the states that carry a crop. An entry that names only the block, without [...], matches every state of it
    S:"Gather List" <
     >

    # Enable simple harvesting and replanting with right click
    B:"Simple Harvest"=false

    # Amount of XP given
    # Min: 1
    # Max: 2147483647
    I:"XP Amount"=1
}


