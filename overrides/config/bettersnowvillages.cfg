            0
         >

        # If true, treat the Snow Village Dimension Blacklist as a Whitelist instead
        B:"Better Snow Village Dimension Use Whitelist"=true

        # Generator for Better Snow Villages:
        # WorldGenerator
        # 	Behavior more similar to Vanilla Ice and Fire Snow Villages
        # 	Generation rate most influenced by chance per chunk
        # 	Safe to use Ice and Fire's generation config
        # MapGenStructure
        # 	Behavior more similar to Vanilla Minecraft Villages
        # 	Generation rate most influenced by minimum distance between others
        # 	Chance per chunk config is ignored in favor of compatibility with other features such as:
        # 		bettersnowvillages locate command
        # 		Antique Auto Atlas Marker's vanilla structure system
        # Valid values:
