# Configuration file

~CONFIG_VERSION(general): 1.0.0

general {
    ##########################################################################################################
    # compatibility
    #--------------------------------------------------------------------------------------------------------#
    # Mod Compat Mixin Toggles and other Settings
    ##########################################################################################################

    compatibility {
        # Players will not experience Bloodmoons until they have used a specified number of Heart Containers.
        # The server will set a Bloodmoon but only eligible players will experience their spawns.
        # Singleplayer will be allowed to sleep through Bloodmoon nights that they can not experience.
        # Default: true
        B:"Mixin: Bloodmoon Heart Container Requirement (Bloodmoon)"=true

        # Entities that deal Significant Damage dealt to a Player will be cached and the client notified.
        #    Notifies about Reskillable Undershirt usage
        #    Notifies about Morphine max health ability usage
        #    Notifies about Armor breaking
        # Default: true
        B:"Mixin: Cache Significant Damage (First Aid)"=true

        # Death messages involving Champions will display their Rank.
        # Hovering over the Rank will show all their modifiers.
        # Default: true
        B:"Mixin: Champions in Death Messages (Champions/Vanilla)"=true

        # Handles Defiled Lands Bleed damage as Non lethal damage.
        # Intended to be used when enabling damage scaling for the "magic" DamageSource as it is commonly used elsewhere.
        # Default: false
        B:"Mixin: Defiled Lands Bleed is Non Lethal (Defiled Lands)"=false

        # Death messages involving Infernal mobs will display their Classification.
        # Hovering over the Classification will show all their modifiers.
        # Additionally lets all players know when an Infernal is killed by a player via chat message with configurable minimum modifier count.
        # Default: true
        B:"Mixin: Infernal Classifications in Death Messages (Vanilla)"=true

        # Allows the Enchantment Loot Pools for Enchanted Books and Equipment to be modified.
        # This can be used to fix a inconsistency where book only have Vanilla Enchantments while equipment can have modded.
        # This can also be used to interact with RLCraft Luckified mod by using a Loot Function pool which considers luck.
        # Default: true
        B:"Mixin: Infernal Mobs Configurable Enchantment Pool (Infernal Mobs)"=true

        # Infernal Modified Mobs will spawn with equipment (armor, weapon, offhand) from their configured drops.
        # This will be similar to how Scaling Health Blighted Mobs are equipped with armor and weapons on spawn.
        # New equipment will not replace existing and drops are treated like Vanilla naturally spawned armor.
        # Default: true
        B:"Mixin: Infernal Mobs Use Loot As Equipment (Infernal Mobs)"=true

        # Handles Lycanites Bleed damage as Non lethal damage.
        # Intended to be used when enabling damage scaling for the "magic" DamageSource as it is commonly used elsewhere.
        # Default: false
        B:"Mixin: Lycanites Bleed is Non Lethal (Lycanites Mobs)"=false

        # Players will not experience Lycanites Mob Events until they have used a specified number of Heart Containers.
        # The server will set Mob Events but only eligible players will experience their spawns.
        # Default: true
        B:"Mixin: Lycanites Mob Event Heart Container Requirement (Lycanites Mobs)"=true

        # Applies the Pet Regen mechanic to tamed Lycanites entities.
        # Default: true
        B:"Mixin: Lycanites Pets Auto Regen (Lycanites Mobs)"=true

        # Handles SRP Bleed damage as Non lethal damage.
        # Intended to be used when enabling damage scaling for the "magic" DamageSource as it is commonly used elsewhere.
        # Default: false
        B:"Mixin: SRP Bleed is Non Lethal (Scape and Run: Parasites)"=false

        bloodmoon {
            # The number of Heart Containers that must be used in order to experience Bloodmoons
            # Default: 3
            I:"Heart Container Requirement"=3
        }

        "first aid" {
            # Text Formatting Value-By-Name for the chat message when at least one armor piece breaks
            # Default: RED
            # Valid values:
            # BLACK
            # DARK_BLUE
            # DARK_GREEN
            # DARK_AQUA
            # DARK_RED
            # DARK_PURPLE
            # GOLD
            # GRAY
            # DARK_GRAY
            # BLUE
            # GREEN
            # AQUA
            # RED
            # LIGHT_PURPLE
            # YELLOW
            # WHITE
            # OBFUSCATED
            # BOLD
            # STRIKETHROUGH
            # UNDERLINE
            # ITALIC
            # RESET
            S:"Armor Break - Message Formatting"=RED

            # Buffs Morphine Potion Effect/Item to include the following:
            #     Being at max health can prevent one-shot deaths, leaving you at half a heart on vitals
            #     Damage will be not overflow/transfer to another body part if the part being targeted has any health
            # The buff will not apply to certain damage sources such as Explosions, specifically any usages of:
            #     DirectDamageDistribution
            #     EqualDamageDistribution
            # Default: true
            B:"Morphine Rework"=true

            # Tweak to obtaining and losing the Morphine Potion Effect:
            #     + Can not be removed by general effect cleanse/purge/removal, only timeout allowed
            #     - Duration can not be refreshed/extended outside of using the Morphine Item
            # Default: true
            B:"Morphine Rework - Applicable Rules"=true

            # Seconds between each unique duration.
            # First Aid's default values is 15 second between which creates 4 total unique durations.
            # Min: 0 Max: 2147483647 Default: 15
            I:"Morphine Rework - Bound Increment"=15

            # Maximum duration in seconds that the Morphine Item provides
            # Min: 0 Max: 2147483647 Default: 270
            I:"Morphine Rework - Maximum Duration"=270

            # Text Formatting Value-By-Name for the chat message when preventing a one-shot
            # Default: YELLOW
            # Valid values:
            # BLACK
            # DARK_BLUE
            # DARK_GREEN
            # DARK_AQUA
            # DARK_RED
            # DARK_PURPLE
            # GOLD
            # GRAY
            # DARK_GRAY
            # BLUE
            # GREEN
            # AQUA
            # RED
            # LIGHT_PURPLE
            # YELLOW
            # WHITE
            # OBFUSCATED
            # BOLD
            # STRIKETHROUGH
            # UNDERLINE
            # ITALIC
            # RESET
            S:"Morphine Rework - Message Formatting"=YELLOW

            # Minimum duration in seconds that the Morphine Item provides
            # Min: 0 Max: 2147483647 Default: 210
            I:"Morphine Rework - Minimum Duration"=210

            # Sound Event Resource Location for the sound effect that will play when preventing a one-shot
            # Default: minecraft:entity.witch.drink
            S:"Morphine Rework - Sound Event"=minecraft:entity.witch.drink

            # Fixes First Aid's Poison handling ignoring Player Immunity Frames
            # Also allows the damage to be modified by other mods (such as Scaling Health damage scaling)
            # Default: true
            B:"Poison Damage IFrame Bug Fix"=true

            # If IFrame ignoring poison is desirable, extend this aspect to all mobs instead of only players.
            # Default: false
            B:"Poison Damage IFrame Bug UnFix All"=false

            # Text Formatting Value-By-Name for the chat message when preventing a one-shot
            # Default: AQUA
            # Valid values:
            # BLACK
            # DARK_BLUE
            # DARK_GREEN
            # DARK_AQUA
            # DARK_RED
            # DARK_PURPLE
            # GOLD
            # GRAY
            # DARK_GRAY
            # BLUE
            # GREEN
            # AQUA
            # RED
            # LIGHT_PURPLE
            # YELLOW
            # WHITE
            # OBFUSCATED
            # BOLD
            # STRIKETHROUGH
            # UNDERLINE
            # ITALIC
            # RESET
            S:"Reskillable Undershirt - Message Formatting"=AQUA
        }

        "infernal mobs" {
            # The minimum number of Modifiers the Infernal killed must have.
            # 	Infernal - 11 or more
            # 	Ultra - 6 to 10
            # 	Rare - 5 or less
            # Default: 11
            I:"Infernal Killed by Player Message Modifier Count"=11

            # Allows an item from the Infernal drops config to replace an existing item set on natural spawn.
            #     Mobs like Skeletons and Vindicators will be able to have a different mainhand
            #     Although an item randomly provided by another mod can be replaced
            # Default: true
            B:"Replace Existing Equipment On Spawn"=true

            ##########################################################################################################
            # Infernal Equipment Chance
            #--------------------------------------------------------------------------------------------------------#
            # Defines the chance for each piece of equipment, the order of armor/hands is random.
            #     These values are used only for worn Equipment.
            # An undefined entry will default to a 0% chance
            ##########################################################################################################

            "Infernal Equipment Chance" {
                D:RARE=0.5
                D:ULTRA=0.75
                D:INFERNAL=1.0
            }

            ##########################################################################################################
            # Infernal Equipment Enchantability
            #--------------------------------------------------------------------------------------------------------#
            # Defines the value range for Equipment Enchantability value.
            #     These values are used for worn Equipment and loot dropped.
            # An undefined entry uses Infernal Mob's default of using the Item's Material base value
            #     which is often lower than Vanilla naturally spawned enchanted equipped mobs of [5, 22]
            ##########################################################################################################

            "Infernal Equipment Enchantability" {
                RARE {
                    # Min: 0 Max: 2147483647 Default: 0
                    I:Minimum=10

                    # Min: 0 Max: 2147483647 Default: 0
                    I:Maximum=20
                }
                ULTRA {
                    # Min: 0 Max: 2147483647 Default: 0
                    I:Minimum=20

                    # Min: 0 Max: 2147483647 Default: 0
                    I:Maximum=30
                }
                INFERNAL {
                    # Min: 0 Max: 2147483647 Default: 0
                    I:Minimum=30

                    # Min: 0 Max: 2147483647 Default: 0
                    I:Maximum=50
                }
            }

            # Determines where the Enchanted Book Enchantsments Pool comes from.
            # Intended to be used to choose if it should interact with RLCraft Luckified or the So Many Enchantments blacklists.
            #     ENCHANT_RANDOMLY_LOOT_FUNC - The minecraft:enchant_randomly loot function
            #     FORGE_REGISTRY - All loaded enchantments
            #     LIBRARIAN_VILLAGER - Enchanted Books sold by Librarians
            #     VANILLA_REGISTRY - Only Vanilla enchantments
            # Infernal Mobs originally used VANILLA_REGISTRY
            # Default: ENCHANT_RANDOMLY
            # Valid values:
            # ENCHANT_RANDOMLY
            # FORGE_REGISTRY
            # LIBRARIAN_VILLAGER
            # VANILLA_REGISTRY
            S:"Enchanted Book Loot Enchantment Pool"=ENCHANT_RANDOMLY

            # Determines where the Enchanted Equipment Enchantsments Pool comes from.
            # Intended to be used to choose if it should interact with RLCraft Luckified or the So Many Enchantments blacklists.
            #     ENCHANTMENT_HELPER - Directly use EnchantmentHelper.addRandomEnchantment
            #     ENCHANT_WITH_LEVELS - The minecraft:enchant_with_levels loot function
            #     FORGE_REGISTRY - Chooses up to 3 from the top after using EnchantmentHelper.addRandomEnchantment
            # Infernal Mobs originally used FORGE_REGISTRY 
            # Default: ENCHANT_WITH_LEVELS
            # Valid values:
            # ENCHANTMENT_HELPER
            # ENCHANT_WITH_LEVELS
            # FORGE_REGISTRY
            S:"Enchanted Equipment Loot Enchantment Pool"=ENCHANT_WITH_LEVELS
        }

        "lycanites mobs" {
            # Whether the Scaling Health Auto Regen is applied to Lycanites Soulbinds, who have their own auto regen mechanic.
            # Default: true
            B:"Auto Regen Soulbinds"=true

            # The number of Heart Containers that must be used in order to experience Lycanites Mob Events
            # Default: 3
            I:"Mob Event Heart Container Requirement"=3
        }
    }

    "damage scaling" {
        # List of exact Class names which the damaged Entity will be instance checked
        # '*' wildcard will match everything
        # The blacklist is check BEFORE the whitelist
        # Default: [*]
        S:"Entity Class Blacklist" <
            *
        >

        # List of exact Class names which the damaged Entity will be instance checked
        # '*' wildcard will match everything
        # The whitelist is check AFTER the blacklist
        # Default: [net.minecraft.entity.monster.IMob, net.minecraft.entity.passive.IAnimals]
        S:"Entity Class Whitelist" <
            net.minecraft.entity.monster.IMob
            net.minecraft.entity.passive.IAnimals
        >

        # Overhauls the Damage Scaling Mechanic (Main Config in Mod Options -> Scaling Health -> player -> damage)
        # 	Config for Hostile Mobs, no longer limited to instances of IMob, a limited group.
        # 	Config for Passive Mobs, no longer limited any non Player or IMob, a very wide group.
        # 	Additional Config for Scaling Value for NULL True Source, aka environmental damage
        # 	Additional Config for Scaling Value for non-NULL True Source, aka damage with an attacker
        # Treated as additional scaling rules where if none match, falls back to vanilla Scaling Health
        # Default: true
        B:"Mixin: Overhaul Damage Scaling"=true

        ##########################################################################################################
        # Damage Scaling Values - Environmental
        #--------------------------------------------------------------------------------------------------------#
        # Similar to the vanilla Scaling Health player -> damage -> "Scale By Source" config
        # The default config includes Vanilla Damage Sources that Scaling Health 1.12 did not include
        ##########################################################################################################

        "Damage Scaling Values - Environmental" {
            D:mob=0.0
            D:player=0.0
            D:arrow=0.0
            D:thrown=0.0
            D:indirectMagic=0.0
            D:thorns=0.0
            D:explosion.player=0.0
            D:explosion=0.0
        }

        ##########################################################################################################
        # Damage Scaling Values - Has Attacker
        #--------------------------------------------------------------------------------------------------------#
        # Similar to the vanilla Scaling Health player -> damage -> "Scale By Source" config
        # The default config includes Vanilla Damage Sources that Scaling Health 1.12 did not include
        ##########################################################################################################

        "Damage Scaling Values - Has Attacker" {
            D:mob=0.0
            D:player=0.0
            D:arrow=0.0
            D:thrown=0.0
            D:indirectMagic=0.0
            D:thorns=0.0
            D:explosion.player=0.0
            D:explosion=0.0
        }
    }

    debug {
        # Default: false
        B:"Log Blights"=false

        # Default: false
        B:"Log Damage Scaling Overhaul"=false

        # Default: false
        B:"Log Difficulty"=false

        # Default: false
        B:"Log Mod Config"=false
    }

    "mixin toggles" {
        # Entities that deal Significant Damage dealt to a Player will be cached and the client notified.
        #    Notifies about Reskillable Undershirt usage
        #    Notifies about Armor breaking
        # Default: true
        B:"Cache Significant Damage (Vanilla)"=true

        # The Server will add a click event and underline the entity's TextComponent used to display it's name.
        # The click event runs a command to view the inventory of the entity.
        # Intended to be used to view the equipment of what kill you with "Entity Equipment View GUI" enabled
        # Default: true
        B:"Death Message Clickable Equipment (Vanilla)"=true

        # Fixes the Blight configs "Armor Piece Chance" and "Hand Piece Chance" being inverted.
        # ex. A config value of 1.0, or 100% was incorrectly treated as 0% chance.
        # Default: false
        B:"Fix Inverted Config For Equipment Piece Chances"=false

        # Buffs the Totem of Undying to refresh various modded Death Protection mechanics as Totems are generally always used last.
        #     Bountiful Baubles Broken Heart - Max Health as a cost fatal damage protection
        #     Reskillable Undershirt - Cooldown based fatal damage protection
        # The supported mods do not need to be installed.
        # Default: true
        B:"Totem of Undying Refreshes Other Mechanics (Vanilla)"=true
    }

    mob {
        blights {
            # Enables Blight Equipment on spawn to be Configurable
            #     * Allows Equipment to be Defined per Tier
            #     * Allows Equipment/Enchantment chances to be configured per minimum Blight Difficulty
            # Any equipment added through ScalingHealthAPI will be respected and used
            # Available in Mob/Blights/Enchantments and Mob/Blights/Equipment
            # Default: true
            B:"Mixin: Blight Equipment Config"=true

            enchantments {
                # Determines where the Enchanted Equipment Enchantsments Pool comes from.
                # Intended to be used to choose if it should interact with RLCraft Luckified or the So Many Enchantments blacklists.
                #     ENCHANTMENT_HELPER - Directly use EnchantmentHelper.addRandomEnchantment
                #     ENCHANT_WITH_LEVELS - The minecraft:enchant_with_levels loot function
                #     FORGE_REGISTRY - Original behavior of always level 30 without treasure
                # Infernal Mobs originally used FORGE_REGISTRY 
                # Default: ENCHANT_WITH_LEVELS
                # Valid values:
                # ENCHANTMENT_HELPER
                # ENCHANT_WITH_LEVELS
                # FORGE_REGISTRY
                S:"Enchanted Equipment Enchantment Pool"=ENCHANT_WITH_LEVELS

                ##########################################################################################################
                # Random Enchantments Per Difficulty
                #--------------------------------------------------------------------------------------------------------#
                # Random Enchantment Settings depending on a Mob's Difficulty
                # The config specifies an inclusive starting bound up that links to the next entry
                #     Minimum, Maximum, and Treasure follow the properties of the minecraft:enchant_with_levels loot function
                ##########################################################################################################

                "Random Enchantments Per Difficulty" {
                    0.0 {
                        # Min: 0 Max: 2147483647 Default: 0
                        I:Minimum=29

                        # Min: 0 Max: 2147483647 Default: 0
                        I:Maximum=30

                        # Can include Treasure Enchantments
                        # Default: false
                        B:Treasure=false
                    }
                    30.0 {
                        # Min: 0 Max: 2147483647 Default: 0
                        I:Minimum=30

                        # Min: 0 Max: 2147483647 Default: 0
                        I:Maximum=60

                        # Can include Treasure Enchantments
                        # Default: false
                        B:Treasure=true
                    }
                    60.0 {
                        # Min: 0 Max: 2147483647 Default: 0
                        I:Minimum=60

                        # Min: 0 Max: 2147483647 Default: 0
                        I:Maximum=90

                        # Can include Treasure Enchantments
                        # Default: false
                        B:Treasure=true
                    }
                }
            }

            equipment {
                # Overrides the default expected max tier of 4
                # This value is used by Scaling Health and its API
                # This value should be equal to the highest tier set in any Equipment Item List
                # Default: 5
                I:"Maximum Expected Tier"=5

                # Allows a config item to replace an existing item set on natural spawn.
                #     Mobs like Skeletons and Vindicators will be able to have a different mainhand
                #     Although an item randomly provided by another mod can be replaced
                # Default: true
                B:"Replace Existing Equipment On Spawn"=true

                ##########################################################################################################
                # Armor Piece Chance Per Difficulty
                #--------------------------------------------------------------------------------------------------------#
                # Just like the original config, however set by Difficulty
                # The config specifies an inclusive starting bound up that links to the next entry
                #     If no valid entry exists, uses Scaling Health's original config value
                # The chance of an additional armor piece being given. Every blight receives a helmet,
                #  then has this probability of receiving a chestplate. If it gets a chestplate, it has
                #  this probability of receiving leggings, etc.
                ##########################################################################################################

                "Armor Piece Chance Per Difficulty" {
                    D:0.0=0.5
                    D:30.0=0.75
                    D:60.0=1.0
                }

                ##########################################################################################################
                # Hand Piece Chance Per Difficulty
                #--------------------------------------------------------------------------------------------------------#
                # Just like the original config, however set by Difficulty
                # The config specifies an inclusive starting bound up that links to the next entry
                #     If no valid entry exists, uses Scaling Health's original config value
                # The chance that a blight will receive equipment in their hands (swords, etc.) They only
                #  get a chance at an offhand item if a main hand item is selected. Depending on the
                #  mods you have installed, there may not be any hand equipment to chose from.
                ##########################################################################################################

                "Hand Piece Chance Per Difficulty" {
                    D:0.0=0.25
                    D:30.0=0.75
                    D:60.0=1.0
                }

                ##########################################################################################################
                # Highest Common Tier Per Difficulty
                #--------------------------------------------------------------------------------------------------------#
                # Just like the original config, however set by Difficulty
                # The config specifies an inclusive starting bound up that links to the next entry
                #     If no valid entry exists, uses Scaling Health's original config value
                # The highest commonly-occuring equipment tier for blights. This goes from 0 to 4
                #  inclusive. For armor, the defaults (tiers 0 to 4) are leather, gold, chainmail,
                #  iron, and diamond.
                ##########################################################################################################

                "Highest Common Tier Per Difficulty" {
                    I:0.0=1
                    I:100.0=2
                    I:200.0=3
                    I:300.0=4
                    I:400.0=5
                }

